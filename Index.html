<style>
/* ---------- Design tokens ---------- */
:root{
  --pitch-dark:#0E2E22;
  --pitch:#164A34;
  --pitch-light:#1F6244;
  --cream:#F6F1E4;
  --cream-2:#EFE8D6;
  --paper:#FFFFFF;
  --ink:#1A2420;
  --ink-soft:#4B584F;
  --gold:#C79A3A;
  --gold-deep:#A57C22;
  --ball:#A6192E;
  --line:#E3DCC8;
  --shadow: 0 1px 2px rgba(20,30,20,0.06), 0 6px 20px rgba(20,30,20,0.08);
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --nav-h: 64px;
  --top-h: 58px;
}

*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;
  background:var(--cream);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  background:var(--cream);
  display:flex;
  flex-direction:column;
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  height:var(--top-h);
  display:flex; align-items:center; gap:8px;
  padding:0 6px 0 4px;
  background:var(--pitch);
  color:var(--cream);
  padding-top: env(safe-area-inset-top);
}
.topbar .tb-inner{
  display:flex; align-items:center; gap:6px; width:100%;
  height:var(--top-h);
}
.icon-btn{
  width:42px;height:42px;border:none;background:transparent;color:var(--cream);
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  flex:none; cursor:pointer;
}
.icon-btn:active{ background:rgba(255,255,255,0.12); }
.icon-btn svg{width:22px;height:22px;}
.topbar .title-wrap{ flex:1; min-width:0; }
.topbar .title{
  font-size:17px; font-weight:700; letter-spacing:0.1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-family:'Fraunces', serif;
}
.topbar .subtitle{
  font-size:11.5px; color:var(--gold); opacity:0.95; margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar .spacer{width:42px;flex:none;}

/* ---------- Content ---------- */
.content{
  flex:1;
  padding: 16px 16px calc(var(--nav-h) + 24px) 16px;
  overflow-x:hidden;
}
.screen{ animation: fadeIn .18s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

/* ---------- Home screen ---------- */
.home-hero{
  padding: 22px 4px 6px 4px;
}
.home-hero h1{
  font-family:'Fraunces', serif;
  font-size:26px; line-height:1.15; margin:0 0 4px 0;
  color:var(--pitch-dark);
  font-weight:600;
}
.home-hero p{
  margin:0; color:var(--ink-soft); font-size:14.5px; line-height:1.5;
  max-width:38ch;
}

.home-grid{
  display:flex; flex-direction:column; gap:14px; margin-top:18px;
}
.home-card{
  display:flex; align-items:center; gap:14px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:16px 16px;
  box-shadow:var(--shadow);
  cursor:pointer;
  text-align:left;
  -webkit-tap-highlight-color: transparent;
}
.home-card:active{ transform: scale(0.985); }
.home-card .badge{
  width:52px;height:52px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.home-card .badge svg{width:28px;height:28px;}
.badge-mcc{ background:linear-gradient(155deg,#1F6244,#0E2E22); color:var(--cream);}
.badge-senior{ background:linear-gradient(155deg,#C79A3A,#A57C22); color:#241B08;}
.badge-junior{ background:linear-gradient(155deg,#A6192E,#7A1220); color:var(--cream);}
.home-card .body{flex:1; min-width:0;}
.home-card .body h3{
  margin:0 0 2px 0; font-size:16.5px; font-weight:700; color:var(--ink);
  font-family:'Fraunces', serif;
}
.home-card .body p{ margin:0; font-size:12.8px; color:var(--ink-soft); }
.home-card .chev{ color:#B9B09A; flex:none; }
.home-card .chev svg{width:20px;height:20px;}

.home-footer-note{
  margin-top:22px; padding: 12px 14px; border-radius:14px;
  background:var(--cream-2); border:1px dashed var(--line);
  font-size:12px; color:var(--ink-soft); line-height:1.5;
}

/* ---------- Section header (list screens) ---------- */
.section-lead{
  padding: 4px 2px 14px 2px;
}
.section-lead h2{
  font-family:'Fraunces', serif;
  font-size:21px; margin:0 0 4px 0; color:var(--pitch-dark);
}
.section-lead p{ margin:0; font-size:13px; color:var(--ink-soft); }

/* ---------- List rows ---------- */
.list{
  display:flex; flex-direction:column; gap:10px;
}
.row{
  display:flex; align-items:center; gap:12px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:13px 14px;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
}
.row:active{ background:var(--cream-2); }
.row .num{
  flex:none; min-width:34px; height:34px; border-radius:10px;
  background:var(--cream-2); color:var(--pitch);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px; font-family:'Fraunces', serif;
  padding: 0 6px;
}
.row.law .num{ background:var(--pitch); color:var(--cream); }
.row.senior-row .num{ background:#F3E6C4; color:var(--gold-deep); }
.row.junior-row .num{ background:#F2D9DD; color:#8C2032; }
.row .rowtitle{ flex:1; min-width:0; font-size:14.5px; font-weight:600; color:var(--ink); }
.row .rowsub{ flex:1; min-width:0; }
.row .rowsub .rt{ font-size:14.5px; font-weight:600; color:var(--ink); display:block;}
.row .rowsub .rs{ font-size:12px; color:var(--ink-soft); display:block; margin-top:1px;}
.row .count-pill{
  flex:none; font-size:11.5px; color:var(--ink-soft);
  background:var(--cream-2); border-radius:999px; padding:3px 9px;
}
.row .chev{ color:#C6BEA6; flex:none; display:flex; }
.row .chev svg{width:18px;height:18px;}

.cat-group-label{
  font-size:11.5px; text-transform:none; color:var(--ink-soft);
  margin: 18px 2px 8px 2px; font-weight:600;
}
.cat-group-label:first-child{margin-top:0;}

/* ---------- Detail screen ---------- */
.detail-card{
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-lg); padding:18px 18px 20px 18px;
  box-shadow:var(--shadow);
}
.detail-card .eyebrow{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12px; font-weight:700; color:var(--pitch);
  background:var(--cream-2); padding:4px 10px; border-radius:999px;
  margin-bottom:10px;
}
.detail-card h2{
  font-family:'Fraunces', serif;
  font-size:20px; line-height:1.3; margin:0 0 12px 0; color:var(--ink);
}
.detail-card .body-text{
  font-size:14.5px; line-height:1.62; color:#2B342E; white-space:pre-line;
}
.detail-card .body-text b{ color:var(--pitch); }

.sublaw-list{ margin-top:16px; display:flex; flex-direction:column; gap:8px;}
.sublaw-item{
  display:flex; gap:10px; align-items:center;
  background:var(--cream); border:1px solid var(--line); border-radius:12px;
  padding:11px 13px;
}
.sublaw-item.clickable{ cursor:pointer; -webkit-tap-highlight-color: transparent; }
.sublaw-item.clickable:active{ background:var(--cream-2); }
.sublaw-item .snum{
  flex:none; font-weight:700; font-size:12.5px; color:var(--gold-deep);
  min-width:40px; font-family:'Fraunces', serif;
}
.sublaw-item .stitle{ flex:1; font-size:13.8px; color:var(--ink); line-height:1.4; }
.sublaw-item .chev{ color:#C6BEA6; flex:none; display:flex; }
.sublaw-item .chev svg{ width:16px; height:16px; }

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  max-width:560px; margin:0 auto;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background:var(--paper);
  border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 -6px 20px rgba(20,30,20,0.06);
}
.home-btn{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--pitch); cursor:pointer;
  padding:6px 22px; border-radius:14px;
}
.home-btn.dim{ color:#9CA79C; }
.home-btn svg{ width:22px; height:22px; }
.home-btn span{ font-size:11px; font-weight:600; }
.home-btn:active{ background:var(--cream-2); }

/* Search */
.search-wrap{ margin-bottom:14px; }
.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--paper); border:1px solid var(--line);
  border-radius:14px; padding:10px 14px;
}
.search-box svg{width:18px;height:18px;color:var(--ink-soft); flex:none;}
.search-box input{
  border:none; outline:none; background:transparent; flex:1;
  font-size:14.5px; color:var(--ink); font-family:inherit;
}
.no-results{ text-align:center; color:var(--ink-soft); font-size:13.5px; padding: 30px 10px;}

/* scrollbar hide */
::-webkit-scrollbar{ width:0; height:0; }

@media (min-width:561px){
  #app{ box-shadow:0 0 40px rgba(0,0,0,0.08); }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
const MCC_LAWS = [{"num": 1, "title": "The players", "subs": [{"num": "1.1", "title": "Number of players", "body": "A match is played between two sides, each of eleven players, one of whom shall be captain. By agreement a match may be played between sides of fewer than, or more than, eleven players, but not more than eleven players may field at any time. If, during the match and for whatever reason, a side is reduced to fewer than the original number of nominated players, the match shall continue as long as it is possible to do so under the Laws or any agreements made before the toss."}, {"num": "1.2", "title": "Nomination and replacement of players", "body": "1.2.1 Each captain shall nominate their players in writing to one of the umpires before the toss.\n\n1.2.2 No player may be replaced after the nomination without the consent of the opposing captain. If such consent is granted, the captain of the team in which the player is being replaced shall inform the umpires and scorers.\n\n1.2.3 Any replacement player shall be considered the same player as the nominated player they replaced for the purposes of these Laws.\n\n1.2.3.1 A replacement shall not bat in an innings in which the nominated player they are replacing has completed their innings.\n\n1.2.3.2 A ny unserved Penalty time, warnings or suspensions, that applied to the original nominated player will be inherited by their replacement."}, {"num": "1.3", "title": "Captain", "body": "1.3.1 If at any time the captain is not available, a deputy shall act for them.\n\n1.3.2 If a captain is not available to nominate the players, then any person associated with that team may act as their deputy to do so. See 1.2.\n\n1.3.3 At any time after the nomination of the players, only a nominated player can act as deputy in discharging the duties and responsibilities of the captain as stated in these Laws, including at the toss. See Law 13.4 (The toss)."}, {"num": "1.4", "title": "Responsibility of captains", "body": "The captains are responsible at all times for ensuring that play is conducted within The Spirit of Cricket as well as within the Laws. See The Preamble \u2013 The Spirit of Cricket and Law 41.1 (Fair and unfair play \u2013 responsibility of captains)."}]}, {"num": 2, "title": "The umpires", "subs": [{"num": "2.1", "title": "Appointment and attendance", "body": "Before the match, two umpires shall be appointed, one for each end, to control the match as required by the Laws, with absolute impartiality. The umpires shall be present on the ground and report to the Executive of the ground at least 45 minutes before the scheduled start of each day\u2019s play."}, {"num": "2.2", "title": "Change of umpire", "body": "An umpire shall not be changed during the match, other than in exceptional circumstances, unless they are injured or ill. If there has to be a change of umpire, the replacement shall act only as the striker\u2019s end umpire unless the captains agree that the replacement should take full responsibility as an umpire."}, {"num": "2.3", "title": "Consultation with captains", "body": "Before the toss the umpires shall\n\n2.3.1 meet with the captains; the umpires shall determine\n\n2.3.1.1 the balls to be used during the match. See Law 4 (The ball).\n\n2.3.1.2 the hours of play and the times and durations of any agreed intervals. In a match of one day\u2019s and one innings\u2019 duration, no specific time need be agreed for the tea interval. It may be agreed instead to take this interval between innings. See Law 11 (Intervals).\n\n2.3.1.3 which clock or watch and back-up timepiece is to be used during the match.\n\n2.3.1.4 the boundary of the field of play and allowances for boundaries, including whether any obstacle within the field of play is to be regarded as a boundary. See Law 19 (Boundaries).\n\n2.3.1.5 the use of covers. See Law 10 (Covering the pitch).\n\n2.3.1.6 any special conditions of play affecting the conduct of the match.\n\n2.3.2 inform the scorers of agreements in 2.3.1.2, 2.3.1.3, 2.3.1.4 and 2.3.1.6."}, {"num": "2.4", "title": "The wickets, creases and boundaries", "body": "Before the toss and during the match, the umpires shall satisfy themselves that\n\n2.4.1 the creases are correctly marked. See Law 7 (The creases).\n\n2.4.2 the wickets are properly positioned. See Law 8 (The wickets).\n\n2.4.3 the boundary of the field of play complies with the requirements of Laws 19.1 (Determining the boundary of the field of play), 19.2 (Identifying and marking the boundary) and 19.3 (Restoring the boundary)."}, {"num": "2.5", "title": "Conduct of the match, implements and equipment", "body": "Before the toss and during the match, the umpires shall satisfy themselves that\n\n2.5.1 the conduct of the match is strictly in accordance with the Laws.\n\n2.5.2 the implements used in the match conform to the following:\n\n2.5.2.1 Law 4 (The ball).\n\n2.5.2.2 externally visible requirements of Law 5 (The bat) and Appendix B.\n\n2.5.2.3 either Laws 8.2 (Size of stumps) and 8.3 (The bails) or, if applicable, Law 8.4 (Junior cricket).\n\n2.5.3 no player uses equipment other than that permitted. See Appendix A.2. Note particularly therein the interpretation of \u2018protective helmet\u2019.\n\n2.5.4 the wicket-keeper\u2019s gloves comply with the requirements of Law 27.2 (Gloves)."}, {"num": "2.6", "title": "Fair and unfair play", "body": "The umpires shall be the sole judges of fair and unfair play."}, {"num": "2.7", "title": "Fitness for play", "body": "2.7.1 It is solely for the umpires together to decide whether either conditions of ground, weather or light or exceptional circumstances mean that it would be dangerous or unreasonable for play to take place. Conditions shall not be regarded as either dangerous or unreasonable merely because they are not ideal. The fact that the grass and the ball are wet does not warrant the ground conditions being regarded as unreasonable or dangerous.\n\n2.7.2 Conditions shall be regarded as dangerous if there is actual and foreseeable risk to the safety of any player or umpire.\n\n2.7.3 Conditions shall be regarded as unreasonable if, although posing no risk to safety, it would not be sensible for play to proceed.\n\n2.7.4 If the umpires consider the ground is so wet or slippery as to deprive: the bowler of a reasonable foothold the fielders of the ability to move freely or the batters of the ability to play their strokes or to run between the wickets then these conditions shall be regarded as so bad that it would be dangerous and unreasonable for play to take place."}, {"num": "2.8", "title": "Fitness for play", "body": "circumstances\n\n2.8.1 All references to ground include the pitch. See Law 6.1 (Area of pitch).\n\n2.8.2 The Umpires shall immediately suspend play, or not allow play to start or to recommence, if either umpire considers that the conditions of ground, weather or light, or any other circumstances are either dangerous or unreasonable.\n\n2.8.3 When there is a suspension of play it is the responsibility of the umpires to monitor conditions. They shall make inspections as often as appropriate, unaccompanied by any players or officials. Immediately the umpires together agree that the conditions are no longer dangerous or unreasonable they shall call upon the players to resume play."}, {"num": "2.9", "title": "Position of umpires", "body": "The umpires shall stand where they can best see any act upon which their decision may be required. Subject to this overriding consideration, the bowler\u2019s end umpire shall stand in a position so as not to interfere with either the bowler\u2019s run-up or the striker\u2019s view. The striker\u2019s end umpire may elect to stand on the off side instead of the on side of the pitch, provided they inform the captain of the fielding side, the striker and the other umpire."}, {"num": "2.10", "title": "Umpires changing ends", "body": "The umpires shall change ends after each side has had one completed innings. See Law 13.3 (Completed innings)."}, {"num": "2.11", "title": "Disagreement and dispute", "body": "Where there is disagreement or dispute about any matter, the umpires together shall make the final decision. See also Law 31.6 (Consultation by umpires)."}, {"num": "2.12", "title": "Umpire\u2019s decision", "body": "An umpire may alter any decision provided that such alteration is made promptly and does not contradict Law 20.6 (Dead ball not to be revoked). This apart, an umpire\u2019s decision, once made, is final."}, {"num": "2.13", "title": "Signals", "body": "2.13.1 The following code of signals shall be used by umpires:\n\n2.13.1.1 Signals made while the ball is in play Dead ball \u2013 by crossing and re-crossing the wrists below the waist. No ball \u2013 by extending one arm horizontally. Out \u2013 by raising an index finger above the head. (If not out, the umpire shall call Not out.) Wide \u2013 by extending both arms horizontally.\n\n2.13.1.2 When the ball is dead, the bowler\u2019s end umpire shall repeat the signals in 2.13.1.1, with the exception of the signal for Out, to the scorers.\n\n2.13.1.3 The signals listed below shall be made to the scorers only when the ball is dead. Boundary 4 \u2013 by waving an arm from side to side finishing with the arm across the chest. Boundary 6 \u2013 by raising both arms above the head. Bye \u2013 by raising an open hand above the head.\n\nCommencement of Last hour \u2013 by pointing to a raised wrist with the other hand. Five Penalty runs awarded to the batting side \u2013 by repeated tapping of one shoulder with the opposite hand. Five Penalty runs awarded to the fielding side \u2013 by placing one hand on the opposite shoulder. Leg bye \u2013 by touching a raised knee with the hand. New ball \u2013 by holding the ball above the head. Revoke last signal \u2013 by touching both shoulders, each with the opposite hand. Short run \u2013 by bending one arm upwards and touching the nearer shoulder with the tips of the fingers. The following signals are for Level 3 and 4 offences in Law 42 (Players\u2019 conduct). Each signal has two parts, both of which should be acknowledged separately by the scorers. Level 3 conduct Part 1 \u2013 by putting one arm out to the side of the body and repeatedly raising it and lowering it. Part 2 \u2013 by raising both hands, all fingers spread, to shoulder height, palms facing towards the scorers. Level 4 conduct Part 1 \u2013 by putting one arm out to the side of the body and repeatedly raising it and lowering it. Part 2 \u2013 by raising an index finger, held at shoulder height, to the side of the body.\n\n2.13.1.4 A ll the signals in 2.13.1.3 are to be made by the bowler\u2019s end umpire except that for Short run, which is to be signalled by the umpire at the end where short running occurs. However, the bowler\u2019s end umpire shall be responsible both for the final signal of Short run to the scorers and, if more than one run is short, for informing them as to the number of runs to be recorded.\n\n2.13.2 The umpire shall wait until each signal to the scorers has been separately acknowledged by a scorer before allowing play to proceed.\n\n2.13.2.1 I fseveral signals are to be used, they shall be given in the order that the events occurred.\n\n2.13.2.2 Where more than one contravention of the Laws occurs during the same delivery, any sanctions under each Law shall be applied independently, unless otherwise stated. However, where the necessary sanctions contradict one another, the sanctions in respect of the contravention that occurred first shall apply."}, {"num": "2.14", "title": "Informing the umpires", "body": "Throughout the Laws, wherever the umpires are to receive information from captains or other players, it will be sufficient for one umpire to be so informed and for them to inform the other umpire."}, {"num": "2.15", "title": "Correctness of scores", "body": "Consultation between umpires and scorers on doubtful points is essential. The umpires shall, throughout the match, satisfy themselves as to the correctness of the number of runs scored, the wickets that have fallen and, where appropriate, the number of overs bowled. They shall agree these with the scorers at least at every interval, other than a drinks interval, and at the conclusion of the match. See Laws 3.2 (Correctness of scores), 16.8 (Correctness of result) and 16.10 (Result not to be changed)."}]}, {"num": 3, "title": "The scorers", "subs": [{"num": "3.1", "title": "Appointment of scorers", "body": "Two scorers shall be appointed to record all runs scored, all wickets taken and, where appropriate, the number of overs bowled."}, {"num": "3.2", "title": "Correctness of scores", "body": "The scorers shall frequently check to ensure that their records agree. They shall agree with the umpires, at least at every interval, other than drinks intervals, and at the conclusion of the match, the runs scored, the wickets that have fallen and, where appropriate, the number of overs bowled. See Law 2.15 (Correctness of scores)."}, {"num": "3.3", "title": "Acknowledging signals", "body": "The scorers shall accept all instructions and signals given to them by the umpires and shall immediately acknowledge each separate signal."}]}, {"num": 4, "title": "The ball", "subs": [{"num": "4.1", "title": "Weight and size", "body": "A Size 1 ball, when new, shall weigh not less than 5.5 ounces/156 g, nor more than 5.75 ounces/163 g, and shall measure not less than 8.81 in/22.4 cm, nor more than 9 in/22.9 cm in circumference. A Size 2 ball, when new, shall weigh not less than 5 ounces/142 g, nor more than 5.25 ounces/149 g, and shall measure not less than 8.46 in/21.5 cm nor more than 8.66 in/22 cm in circumference. A Size 3 ball, when new, shall weigh not less than 4.69 ounces/133 gnor more than 4.84 ounces/140 g, and shall measure not less than 8.07 in/20.5 cm nor more than 8.27 in/21 cm in circumference."}, {"num": "4.2", "title": "Approval and control of balls", "body": "4.2.1 All balls to be used in the match, having been determined by the umpires, shall be in the possession of the umpires before the toss and shall remain under their control throughout the match.\n\n4.2.2 The umpire shall take possession of the ball in use at the fall of each wicket, at the start of any interval and at any interruption of play."}, {"num": "4.3", "title": "New ball", "body": "Unless an agreement to the contrary has been made before the match, either captain may demand a new ball at the start of each innings."}, {"num": "4.4", "title": "New ball in match of more than one day\u2019s duration", "body": "In a match scheduled to be of more than one day\u2019s duration, the captain of the fielding side may demand a new ball when the number of overs, excluding any part overs, bowled with the old one is equal to or greater than 80 overs. The umpire shall inform the other umpire and indicate to the batters and the scorers whenever a new ball is taken into play."}, {"num": "4.5", "title": "Ball lost or becoming unfit for play", "body": "If, during play, the ball cannot be found or recovered or the umpires agree that it has become unfit for play through normal use, the umpires shall replace it with a ball which has had wear comparable with that which the previous ball had received before the need for its replacement. When the ball is replaced, the umpire shall inform the batters and the fielding captain."}, {"num": "4.6", "title": "Specifications", "body": "The Governing Body responsible for the match shall determine the size of ball to be used. If no such determination has been made, the umpires shall determine the size of ball to be used under Law 2.3.1.1."}]}, {"num": 5, "title": "The bat", "subs": [{"num": "5.1", "title": "The bat", "body": "5.1.1 The bat consists of two parts, a handle and a blade.\n\n5.1.2 The basic requirements and measurements of the bat are set out in this Law with detailed specifications in Appendix B."}, {"num": "5.2", "title": "The handle", "body": "5.2.1 The handle is to be made principally of cane and/or wood.\n\n5.2.2 The part of the handle that is wholly outside the blade is defined to be the upper portion of the handle. It is a straight shaft for holding the bat.\n\n5.2.3 The upper portion of the handle may be covered with a grip as defined in Appendix B.2.2."}, {"num": "5.3", "title": "The blade", "body": "5.3.1 The blade comprises the whole of the bat apart from the handle as defined in 5.2 and in Appendix B.3.\n\n5.3.2 The blade shall consist solely of wood.\n\n5.3.3 All bats may have commercial identifications on the blade, the size of which must comply with the relevant specification in Appendix B.6."}, {"num": "5.4", "title": "Protection and repair", "body": "Subject to the specifications in Appendix B.4 and providing 5.5 is not contravened,\n\n5.4.1 solely for the purposes of either protection from surface damage to the face, sides and shoulders of the blade or repair to the blade after surface damage, material that is not rigid, either at the time of its application to the blade or subsequently, may be placed on these surfaces.\n\n5.4.2 for repair of the blade after damage other than surface damage\n\n5.4.2.1 solid material may be inserted into the blade.\n\n5.4.2.2 The only material permitted for any insertion is wood with minimal essential adhesives.\n\n5.4.3 to prevent damage to the toe, material may be placed on that part of the blade but shall not extend over any part of the face, back or sides of the blade."}, {"num": "5.5", "title": "Alterations to bat during innings/match", "body": "5.5.1 For any part of the bat, covered or uncovered, the hardness of the constituent materials and the surface texture thereof shall not be such that either or both could cause unacceptable damage to the ball.\n\n5.5.2 Any material placed on any part of the bat, for whatever purpose, shall similarly not be such that it could cause unacceptable damage to the ball.\n\n5.5.3 For the purpose of this Law, unacceptable damage is any change that is greater than normal wear and tear caused by the ball striking the uncovered wooden surface of the blade."}, {"num": "5.6", "title": "Contact with the ball", "body": "In these Laws,\n\n5.6.1 reference to the bat shall imply that the bat is held in the batter\u2019s hand or a glove worn on their hand, unless stated otherwise.\n\n5.6.2 contact between the ball and any of 5.6.2.1 to 5.6.2.4\n\n5.6.2.1 the bat itself\n\n5.6.2.2 the batter\u2019s hand holding the bat\n\n5.6.2.3 any part of a glove worn on the batter\u2019s hand holding the bat\n\n5.6.2.4 any additional materials permitted under 5.4 shall be regarded as the ball striking or touching the bat or being struck by the bat."}, {"num": "5.7", "title": "Bat size limits", "body": "5.7.1 The overall length of the bat, when the lower portion of the handle is inserted, shall not be more than 38 in/96.52 cm.\n\n5.7.2 The blade of the bat shall not exceed the following dimensions:\n\nWidth: 4.25 in/10.8 cm Depth: 2.64 in/6.7 cm Edges: 1.56 in/4.0 cm. Furthermore, it should also be able to pass through a bat gauge as described in Appendix B.8.\n\n5.7.3 Except for bats of size 6 and less, the handle shall not exceed 52% of the overall length of the bat.\n\n5.7.4 The material permitted for covering the blade in 5.4.1 shall not exceed 0.04 in/0.1 cm in thickness.\n\n5.7.5 The maximum permitted thickness of protective material placed on the toe of the blade is 0.12 in/0.3 cm."}, {"num": "5.8", "title": "Categories of bat", "body": "5.8.1 Types A, B and C are bats conforming to 5.1 to 5.7 inclusive.\n\n5.8.2 Type A bats may be used at any level of cricket.\n\n5.8.3 Type B bats may have material inserted at the toe and/or along the sides, parallel to the face of the blade (see B.4.2).\n\n5.8.4 Type C bats may have a cloth covering (see B.3.3). They may also have material inserted at the toe and/or along the sides, parallel to the face of the blade (see B.4.2), and a greater proportion of materials other than cane, wood or twine in the handle than Types A and B (see B.2.3).\n\n5.8.5 Type D bats may be laminated and/or coloured, as outlined in Appendix B.7, and are for use only at lower levels of the game, as determined by the Governing Body for cricket in the country concerned.\n\n5.8.6 Bats of Type B and Type C, may be used only at or below levels determined by the Governing Body for cricket in the country concerned.\n\n5.8.7 Bats that do not qualify for any of the four categories A to D are not recognised in the Laws."}]}, {"num": 6, "title": "The pitch", "subs": [{"num": "6.1", "title": "Area of pitch", "body": "The pitch is a rectangular area of the ground 22 yards/20.12 m in length and 10 ft/3.05 m in width. It is bounded at either end by the bowling creases and on either side by imaginary lines, one each side of the imaginary line joining the centres of the two middle stumps, each parallel to it and 5 ft/1.52 m from it. If the pitch is next to an artificial pitch which is closer than 5 ft/1.52 m from the middle stumps, the pitch on that side will extend only to the junction of the two surfaces. See 6.6, Law 8.1 (Description, width and pitching), Law 7.2 (The bowling crease) and Appendix C."}, {"num": "6.2", "title": "Fitness of pitch for play", "body": "The umpires shall be the sole judges of the fitness of the pitch for play. See Laws 2.7 (Fitness for play) and 2.8 (Suspension of play in dangerous or unreasonable conditions)."}, {"num": "6.3", "title": "Selection and preparation", "body": "Before the match, the Ground Authority shall be responsible for the selection and preparation of the pitch. During the match, the umpires shall control its use and maintenance."}, {"num": "6.4", "title": "Changing the pitch", "body": "The pitch shall not be changed during the match unless the umpires decide that it is dangerous or unreasonable for play to continue on it and then only with the consent of both captains."}, {"num": "6.5", "title": "Non-turf pitches", "body": "In the event of a non-turf pitch being used, the artificial surface shall conform to the following measurements: Length \u2013 a minimum of 58 ft/17.68 m Width \u2013 a minimum of 6 ft/1.83 m See Law 9.8 (Non-turf pitches)."}, {"num": "6.6", "title": "Junior Cricket", "body": "The Governing Body for cricket in the country concerned shall determine the length of the pitch for junior cricket."}]}, {"num": 7, "title": "The creases", "subs": [{"num": "7.1", "title": "The creases", "body": "The positions of a bowling crease, a popping crease and two return creases shall be marked by white lines, as set out in 7.2, 7.3 and 7.4, at each end of the pitch. See Appendix C."}, {"num": "7.2", "title": "The bowling crease", "body": "The bowling crease, which is the back edge of the crease marking, is the line that marks the end of the pitch, as in Law 6.1 (Area of pitch). It shall be 8 ft 8 in/2.64 m in length."}, {"num": "7.3", "title": "The popping crease", "body": "The popping crease, which is the back edge of the crease marking, shall be in front of and parallel to the bowling crease and shall be 4 ft/1.22 m from it. The popping crease shall be marked to a minimum of 6 ft/1.83 m on either side of the imaginary line joining the centres of the two middle stumps and shall be considered to be unlimited in length."}]}, {"num": 8, "title": "The wickets", "subs": [{"num": "8.1", "title": "Description, width and position", "body": "Two sets of wickets shall be positioned opposite and parallel to each other in the centres of the bowling creases. Each set shall be 9 in/22.86 cm wide and shall consist of three wooden stumps with two wooden bails on top. See Appendix D."}, {"num": "8.2", "title": "Size of stumps", "body": "The tops of the stumps shall be 28 in/71.12 cm above the playing surface and shall be dome shaped except for the bail grooves. The portion of a stump above the playing surface shall be cylindrical apart from the domed top, with circular section of diameter not less than 1.38 in/3.50 cm nor more than 1.5 in/3.81 cm. See Appendix D."}, {"num": "8.3", "title": "The bails", "body": "8.3.1 The bails, when in position on top of the stumps, shall not project more than 0.5 in/1.27 cm above them. shall fit between the stumps without forcing them out of the vertical.\n\n8.3.2 Each bail shall conform to the following specifications (see Appendix D): Overall length 4.31 in/10.95 cm Length of barrel 2.13 in /5.40 cm Longer spigot 1.38 in/3.50 cm Shorter spigot 0.81 in/2.06 cm.\n\n8.3.3 The two spigots and the barrel shall have the same centre line.\n\n8.3.4 Devices aimed at protecting player safety by limiting the distance that a bail can travel off the stumps will be allowed, subject to the approval of the Governing Body for the match and the Ground Authority."}, {"num": "8.4", "title": "Junior cricket", "body": "The Governing Body for cricket in the country concerned shall determine the dimensions of the stumps and bails."}, {"num": "8.5", "title": "Dispensing with bails", "body": "The umpires may agree to dispense with the use of bails, if necessary. If they so agree then no bails shall be used at either end. The use of bails shall be resumed as soon as conditions permit. See Law 29.5 (Dispensing with bails)."}]}, {"num": 9, "title": "Preparation and maintenance of the playing area", "subs": [{"num": "9.1", "title": "Rolling", "body": "The pitch shall not be rolled during the match except as permitted in 9.1.1 and 9.1.2.\n\n9.1.1 Frequency and duration of rolling During the match the pitch may be rolled at the request of the captain of the batting side, for a period of not more than 7 minutes, before the start of each innings, other than the first innings of the match, and before the start of each subsequent day\u2019s play. See 9.1.4.\n\n9.1.2 Rolling after a delayed start In addition to the rolling permitted above, if, after the toss and before the first innings of the match, the start is delayed, the captain of the batting side may request that the pitch be rolled for not more than 7 minutes. However, if the umpires together agree that the delay has had no significant effect on the state of the pitch, they shall refuse such request for rolling of the pitch.\n\n9.1.3 Choice of rollers If there is more than one roller available the captain of the batting side shall choose which one is to be used.\n\n9.1.4 Timing of permitted rolling The rolling permitted (maximum 7 minutes) before play begins on any day shall be started not more than 30 minutes before the time scheduled or rescheduled for play to begin. The captain of the batting side may, however, delay the start of such rolling until not less than 10 minutes before the time scheduled or rescheduled for play to begin."}, {"num": "9.2", "title": "Clearing debris from the pitch", "body": "9.2.1 The pitch shall be cleared of any debris\n\n9.2.1.1 before the start of each day\u2019s play. This shall be after the completion of mowing and before any rolling, not earlier than 30 minutes nor later than 10 minutes before the time or any rescheduled time for start of play.\n\n9.2.1.2 between innings. This shall precede rolling if any is to take place.\n\n9.2.1.3 at all intervals for meals.\n\n9.2.2 The clearance of debris in 9.2.1 shall be done by any means deemed appropriate by the Ground Authority, so long as the umpires do not consider that this may be detrimental to the surface of the pitch. In this case the debris must be cleared from that area by hand.\n\n9.2.3 In addition to 9.2.1, debris may be cleared from the pitch by hand, before mowing and whenever either umpire considers it necessary."}, {"num": "9.3", "title": "Mowing", "body": "9.3.1 Responsibility for mowing\n\n9.3.1.1 A ll mowings which are carried out before the match shall be the sole responsibility of the Ground Authority.\n\n9.3.1.2 A ll subsequent mowings shall be carried out under the supervision of the umpires.\n\n9.3.2 The pitch and outfield In order that throughout the match the ground conditions should be as nearly the same for both sides as possible, both the pitch and the outfield shall be mown on each day of the match on which play is expected to take place, if ground and weather conditions permit. If, for reasons other than conditions of ground or weather, complete mowing of the outfield is not possible, the Ground Authority shall notify the captains and umpires of the procedure to be adopted for such mowing during the match.\n\n9.3.3 Timing of mowing\n\n9.3.3.1 Mowing of the pitch on any day shall be completed not later than 30 minutes before the time scheduled or rescheduled for play to begin on that day, before any sweeping prior to rolling. If necessary, debris may be removed from the pitch before mowing, by hand. See 9.2.3.\n\n9.3.3.2 Mowing of the outfield on any day shall be completed not later than 15 minutes before the time scheduled or rescheduled for play to begin on that day."}, {"num": "9.4", "title": "Watering the pitch", "body": "The pitch shall not be watered during the match."}, {"num": "9.5", "title": "Re-marking creases", "body": "Creases shall be re-marked whenever either umpire considers it necessary."}, {"num": "9.6", "title": "Maintenance of footholes", "body": "The umpires shall ensure that the holes made by the bowlers and batters are cleaned out and dried whenever necessary to facilitate play. In matches of more than one day\u2019s duration, the umpires shall allow, if necessary, the re-turfing of footholes made by the bowlers in their delivery strides, or the use of quick-setting fillings for the same purpose."}, {"num": "9.7", "title": "Securing of footholds and maintenance of pitch", "body": "During play, umpires shall allow the players to secure their footholds by the use of sawdust provided that no damage to the pitch is caused and that Law 41 (Unfair play) is not contravened."}, {"num": "9.8", "title": "Non-turf pitches", "body": "Wherever appropriate, the provisions set out in 9.1 to 9.7 shall apply."}]}, {"num": 10, "title": "Covering the pitch", "subs": [{"num": "10.1", "title": "Before the match", "body": "The use of covers before the match is the responsibility of the Ground Authority and may include full covering if required. However, the Ground Authority shall grant suitable facility to the captains to inspect the pitch before the nomination of their players and to the umpires to discharge their duties as laid down in Laws 2 (The umpires), 6 (The pitch), 7 (The creases), 8 (The wickets), and 9 (Preparation and maintenance of the playing area)."}, {"num": "10.2", "title": "During the match", "body": "Unless determined otherwise before the toss, on each night of the match and if appropriate when play is suspended at any time during the match\n\n10.2.1 the whole pitch and a minimum of 4 ft/1.22 m beyond it at each end shall be covered.\n\n10.2.2 the bowlers\u2019 run-ups, where possible, shall be covered."}]}, {"num": 11, "title": "Intervals", "subs": [{"num": "11.1", "title": "An interval", "body": "11.1.1 The following shall be classed as intervals: The period between close of play on one day and the start of the next day\u2019s play. Intervals between innings. Intervals for meals. Intervals for drinks. Any other agreed interval.\n\n11.1.2 Only these intervals shall be considered as scheduled breaks for the purposes of Law 24.2.6 (Fielder absent or leaving the field of play)."}, {"num": "11.2", "title": "Duration of intervals", "body": "11.2.1 An interval for lunch or tea shall be of the duration determined under Law 2.3 (Consultation with captains), taken from the call of Time before the interval until the call of Play on resumption after the interval.\n\n11.2.2 An interval between innings shall be 10 minutes, commencing from the close of an innings until the call of Play for the start of the next innings. See, however, 11.3, 11.5 and 11.6."}, {"num": "11.3", "title": "Allowance for interval between innings", "body": "In addition to the provisions of 11.5 and 11.6,\n\n11.3.1 if an innings ends when 10 minutes or less remains before the time agreed for close of play on any day, there shall be no further play on that day. No change shall be made to the time for the start of play on the following day on account of the 10 minute interval between innings.\n\n11.3.2 if a captain declares an innings closed or forfeits an innings during an interruption in play of more than 10 minutes duration, provided that at least 10 minutes remains of the interruption, no adjustment shall be made to the time for resumption of play on account of the 10 minute interval between innings, which shall be considered as included in the interruption. If less than 10 minutes remains of the interruption when the captain declares the innings closed, or forfeits an innings, the next innings shall commence 10 minutes after the declaration or forfeiture is made.\n\n11.3.3 if a captain declares an innings closed or forfeits an innings during any interval other than an interval for drinks, provided that at least 10 minutes remains of the interval, the interval shall be of the agreed duration and shall be considered to include the 10 minute interval between innings. If less than 10 minutes remains of the interval when the captain declares the innings closed, or forfeits an innings, the interval shall be extended as necessary and the next innings shall commence 10 minutes after the declaration or forfeiture is made."}, {"num": "11.4", "title": "Changing agreed times of intervals", "body": "If, at any time during the match, either Playing time is lost through adverse conditions of ground, weather or light or in exceptional circumstances, or the players have occasion to leave the field other than at a scheduled interval, the time of the lunch interval or of the tea interval may be changed if the two umpires and both captains so agree, providing the requirements of 11.2 and 11.5, 11.6, 11.7 and 11.8.3 are not contravened."}, {"num": "11.5", "title": "Changing agreed time for lunch interval", "body": "11.5.1 If an innings ends when 10 minutes or less remains before the agreed time for lunch, the interval shall be taken immediately. It shall be of the agreed duration and shall be considered to include the 10-minute interval between innings.\n\n11.5.2 If, because of adverse conditions of ground, weather or light, or in exceptional circumstances, a stoppage occurs when 10 minutes or less remains before the agreed time for lunch, then, whether or not agreement is reached in the circumstances of 11.4, the interval shall be taken immediately. It shall be of the agreed duration. Play shall resume at the end of this interval or as soon after as conditions permit.\n\n11.5.3 If the players have occasion to leave the field for any reason when more than 10 minutes remains before the agreed time for lunch, then, unless the umpires and captains together agree to alter it, lunch shall be taken at the agreed time."}, {"num": "11.6", "title": "Changing agreed time for tea interval", "body": "11.6.1 I fan innings ends when 30 minutes or less remains before the agreed time for tea, the interval shall be taken immediately.\n\nIt shall be of the agreed duration and shall be considered to include the 10-minute interval between innings.\n\n11.6.2 If, when 30 minutes remains before the agreed time for tea, an interval between innings is already in progress, play shall resume at the end of the 10-minute interval, if conditions permit.\n\n11.6.3 If, because of adverse conditions of ground, weather or light, or in exceptional circumstances, a stoppage occurs when 30 minutes or less remains before the agreed time for tea, then unless either there is an agreement to change the time for tea, as permitted in 11.4 or the captains agree to forgo the tea interval, as permitted in 11.9 the interval shall be taken immediately. The interval shall be of the agreed duration. Play shall resume at the end of the interval or as soon after as conditions permit.\n\n11.6.4 If a stoppage is already in progress when 30 minutes remains before the agreed time for tea, 11.4 shall apply."}, {"num": "11.7", "title": "Lunch or tea interval \u2013 9 wickets down", "body": "For the lunch interval and for the tea interval if either 9 wickets are already down when 3 minutes remains to the agreed time for the interval, or the 9th wicket falls within this 3 minutes, or at any time up to and including the final ball of the over in progress at the agreed time for the interval, then the provisions of Law 12.5.2 shall not apply and the interval will not be taken until the end of the over that is in progress 30 minutes after the originally agreed time for the interval, unless the players have cause to leave the field of play or the innings is completed earlier. For the purposes of this section of Law, the retirement of a batter is not to be considered equivalent to the fall of a wicket."}, {"num": "11.8", "title": "Intervals for drinks", "body": "11.8.1 I fon any day the umpires determine that there shall be intervals for drinks, the option to take such drinks shall be available to either side. Each interval shall be kept as short as possible and in any case shall not exceed 5 minutes.\n\n11.8.2 Unless, as permitted in 11.9, the captains agree to forgo it, a drinks interval shall be taken at the end of the over in progress when the agreed time is reached. If, however, a wicket falls or a batter retires within 5 minutes of the agreed time then drinks shall be taken immediately. No other variation in the timing of drinks intervals shall be permitted except as provided for in 11.8.3.\n\n11.8.3 If an innings ends or the players have to leave the field of play for any other reason within 30 minutes of the agreed time for a drinks interval, the umpires and captains together may rearrange the timing of drinks intervals in that session.\n\n11.8.4 Intervals for drinks may not be taken during the last hour of the match, as defined in Law 12.6 (Last hour of match \u2013 number of overs). Subject to this limitation, the umpires shall determine the times for such intervals, if any, before the toss and on each subsequent day not later than 10 minutes before play is scheduled to start."}, {"num": "11.9", "title": "Agreement to forgo intervals", "body": "At any time during the match, the captains may agree to forgo the tea interval or any of the drinks intervals. The umpires shall be informed of the decision. When play is in progress, the batters at the wicket may deputise for their captain in making an agreement to forgo a drinks interval in that session."}, {"num": "11.10", "title": "Scorers to be informed", "body": "The umpires shall ensure that the scorers are informed of all agreements about hours of play and intervals and of any changes made thereto as permitted under this Law."}]}, {"num": 12, "title": "Start of play; cessation of play", "subs": [{"num": "12.1", "title": "Call of Play", "body": "The bowler\u2019s end umpire shall call Play before the first ball of the match and on the resumption of play after any interval or interruption."}, {"num": "12.2", "title": "Call of Time", "body": "The bowler\u2019s end umpire shall call Time, when the ball is dead, at the start of any interval or interruption or as required by the Laws. See also Law 20.3 (Call of Over or Time)."}, {"num": "12.3", "title": "Removal of bails", "body": "After the call of Time, except at the start of a drinks interval, the bails shall be removed from both wickets."}, {"num": "12.4", "title": "Starting a new over", "body": "Another over shall always be started at any time during the match, unless an interval is to be taken in the circumstances set out in 12.5.2, if the umpire, walking at normal pace, has arrived at the position behind the stumps at the bowler\u2019s end before the time agreed for the next interval, or for the close of play, has been reached."}, {"num": "12.5", "title": "Completion of an over", "body": "Other than at the end of the match,\n\n12.5.1 if the agreed time for an interval is reached during an over, the over shall be completed before the interval is taken, except as provided for in 12.5.2.\n\n12.5.2 when less than 3 minutes remains before the time agreed for the next interval, the interval shall be taken immediately if either a batter is dismissed or retires, other than at the end of a day\u2019s play, in which case the over shall be completed or the players have occasion to leave the field whether this occurs during an over or at the end of an over. Except at the end of an innings, if an over is thus interrupted it shall be completed on the resumption of play."}, {"num": "12.6", "title": "Last hour of match \u2013 number of overs", "body": "When one hour of Playing time of the match remains, according to the agreed hours of play, the over in progress shall be completed. The next over shall be the first of a minimum of 20 overs which must be bowled, provided that a result is not reached earlier and provided that there is no interval or interruption in play.\n\nThe bowler\u2019s end umpire shall indicate the commencement of this 20 overs to the players and to the scorers. The period of play thereafter shall be referred to as the Last hour, whatever its actual duration. When the minimum number of overs have been bowled in the Last hour, further overs can be started only if the original time for the close of play has not been reached. See 12.7 and 12.8."}, {"num": "12.7", "title": "Last hour of match \u2013 interruptions of play", "body": "If there is an interruption in play during the Last hour of the match, the minimum number of overs to be bowled shall be reduced from 20 as follows.\n\n12.7.1 The time lost for an interruption is counted from the call of Time until the time for resumption as decided by the umpires.\n\n12.7.2 One over shall be deducted for every complete 3 minutes of time lost.\n\n12.7.3 In the case of more than one such interruption, the minutes lost shall not be aggregated; the calculation shall be made for each interruption separately.\n\n12.7.4 If, when one hour of Playing time remains, an interruption is already in progress\n\n12.7.4.1 only the time lost after this moment shall be counted in the calculation.\n\n12.7.4.2 the over in progress at the start of the interruption shall be completed on resumption and shall not count as one of the minimum number of overs to be bowled.\n\n12.7.5 If, after the start of the Last hour, an interruption occurs during an over, the over shall be completed on resumption of play. The two part-overs shall between them count as one over of the minimum number to be bowled."}, {"num": "12.8", "title": "Last hour of match \u2013 intervals between innings", "body": "If an innings ends so that a new innings is to be started during the Last hour of the match, the interval starts with the end of the innings and is to end 10 minutes later.\n\n12.8.1 If this interval is already in progress at the start of the Last hour then, to determine the number of overs to be bowled in the new innings, calculations are to be made as set out in 12.7.\n\n12.8.2 If the innings ends after the Last hour has started, two calculations are to be made, as set out in 12.8.3 and 12.8.4. The greater of the numbers yielded by these two calculations is to be the minimum number of overs to be bowled in the new innings.\n\n12.8.3 Calculation based on overs remaining At the conclusion of the innings, the number of overs that remain to be bowled, of the minimum in the Last hour, to be noted. If this is not a whole number it is to be rounded up to the next whole number. Three overs, for the interval, to be deducted from the resulting number to determine the number of overs still to be bowled.\n\n12.8.4 Calculation based on time remaining At the conclusion of the innings, the time remaining until the agreed time for close of play to be noted.\n\n10 minutes, for the interval, to be deducted from this time to determine the Playing time remaining. A calculation to be made of one over for every complete 3 minutes of the Playing time remaining, plus one more over if a further part of 3 minutes remains."}, {"num": "12.9", "title": "Conclusion of match", "body": "12.9.1 The match is concluded\n\n12.9.1.1 a ssoon as a result as defined in Laws 16.1 to 16.4 and 16.5.1 (The result) is reached.\n\n12.9.1.2 as soon as both the minimum number of overs for the Last hour are completed and the agreed time for close of play is reached, unless a result is reached earlier.\n\n12.9.1.3 i nthe case of an agreement under Law 13.1.2 (Number of innings), as soon as the final innings is completed as defined in Law 13.3.5 (Completed innings).\n\n12.9.2 The match is concluded if, without a conclusion having been reached under 12.9.1, the players leave the field for adverse conditions of ground, weather or light, or in exceptional circumstances, and no further play is possible."}, {"num": "12.10", "title": "Completion of last over of match", "body": "The over in progress at the close of play on the final day shall be completed unless either a result has been reached or the players have occasion to leave the field. In this case there shall be no resumption of play except in the circumstances of Law 16.9 (Mistakes in scoring) and the match shall be at an end."}]}, {"num": 13, "title": "Innings", "subs": [{"num": "13.1", "title": "Number of innings", "body": "13.1.1 A match shall be one or two innings for each side according to agreement reached before the match.\n\n13.1.2 It may be agreed to limit any innings to a number of overs or to a period of time. If such an agreement is made then\n\n13.1.2.1 i n a one-innings match a similar agreement shall apply to both innings.\n\n13.1.2.2 i n a two-innings match similar agreements shall apply: to the first innings of each side or to the second innings of each side or to both innings of each side. For both one-innings and two-innings matches, the agreement must also include criteria for determining the result when neither of Laws 16.1 (A Win \u2013 two-innings match) or 16.2 (A Win \u2013 one-innings match) applies."}, {"num": "13.2", "title": "Alternate innings", "body": "In a two-innings match each side shall take their innings alternately except in the cases provided for in Law 14 (The follow-on) or in Law 15.2 (Forfeiture of an innings)."}, {"num": "13.3", "title": "Completed innings", "body": "A side\u2019s innings is to be considered as completed if any of the following applies:\n\n13.3.1 the side is all out.\n\n13.3.2 at the fall of a wicket or the retirement of a batter, further balls remain to be bowled but no further batter is available to come in.\n\n13.3.3 the captain declares the innings closed.\n\n13.3.4 the captain forfeits the innings.\n\n13.3.5 in the case of an agreement under 13.1.2, either the prescribed number of overs has been bowled or the prescribed time has expired as appropriate."}, {"num": "13.4", "title": "The toss", "body": "The captains shall toss a coin for the choice of innings, on the field of play and in the presence of one or both of the umpires, not earlier than 30 minutes, nor later than 15 minutes before the scheduled or any rescheduled time for the start of play. Note, however, the provisions of Law 1.3 (Captain)."}, {"num": "13.5", "title": "Decision to be notified", "body": "As soon as the toss is completed, the captain of the side winning the toss shall decide whether to bat or to field and shall notify the opposing captain and the umpires of this decision. Once notified, the decision cannot be changed."}]}, {"num": 14, "title": "The follow-on", "subs": [{"num": "14.1", "title": "Lead on first innings", "body": "14.1.1 In a two-innings match of 5 days or more, the side which bats first and leads by at least 200 runs shall have the option of requiring the other side to follow their innings.\n\n14.1.2 The same option shall be available in two-innings matches of shorter duration with the minimum leads as follows: 150 runs in a match of 3 or 4 days; 100 runs in a 2-day match; 75 runs in a 1-day match."}, {"num": "14.2", "title": "Notification", "body": "A captain shall notify the opposing captain and the umpires of their intention to enforce the follow-on. Once notified, the decision cannot be changed."}, {"num": "14.3", "title": "First day\u2019s play lost", "body": "If no play takes place on the first day of a match of more than one day\u2019s duration, 14.1 shall apply in accordance with the number of days remaining from the start of play. The day on which play first commences shall count as a whole day for this purpose, irrespective of the time at which play starts. Play will have taken place as soon as, after the call of Play, the first over has started. See Law 17.2 (Start of an over)."}]}, {"num": 15, "title": "Declaration and forfeiture", "subs": [{"num": "15.1", "title": "Time of declaration", "body": "With the exception of the final innings of the match, the captain of the side batting may declare an innings closed, when the ball is dead, at any time during the innings. A declared innings shall be considered to be a completed innings."}, {"num": "15.2", "title": "Forfeiture of an innings", "body": "With the exception of the final innings of the match, a captain may forfeit either of their side\u2019s innings at any time before the commencement of that innings. A forfeited innings shall be considered to be a completed innings."}, {"num": "15.3", "title": "Notification", "body": "A captain shall notify the opposing captain and the umpires of any decision to declare or to forfeit an innings. Once notified, the decision cannot be changed."}]}, {"num": 16, "title": "The result", "subs": [{"num": "16.1", "title": "A Win \u2013 two-innings match", "body": "The side which has scored a total of runs in excess of that scored in the two completed innings of the opposing side shall win the match. See Law 13.3 (Completed innings). Note also 16.6."}, {"num": "16.2", "title": "A Win \u2013 one-innings match", "body": "The side which has scored in its one innings a total of runs in excess of that scored by the opposing side in its one completed innings shall win the match. See Law 13.3 (Completed innings). Note also 16.6."}, {"num": "16.3", "title": "Umpires awarding a match", "body": "Regardless of any agreement under Law 13.1.2 (Number of innings),\n\n16.3.1 a match shall be lost by a side which\n\n16.3.1.1 concedes defeat.\n\n16.3.1.2 i nthe opinion of the umpires refuses to play. If so, the umpires shall award the match to the other side.\n\n16.3.2 if an umpire considers that an action by any player or players might constitute a refusal by either side to play then that umpire shall call Time, and the umpires together shall ascertain the cause of the action. If they then decide together that this action does constitute a refusal to play by one side, they shall so inform the captain of that side. If the captain persists in the action the umpires shall award the match in accordance with 16.3.1. See also Law 42.6.1 (Captain refusing to remove a player from the field).\n\n16.3.3 if action as in 16.3.2 takes place after play has started and does not constitute a refusal to play, Playing time shall be counted as lost from the call of Time to the call of Play, excluding intervals (Law 11) and suspensions of play (Law 2.8). the time for close of play on that day shall be extended by this length of time. if applicable, no overs shall be deducted during the Last hour of the match solely on account of this time."}, {"num": "16.4", "title": "Matches in which there is an agreement under Law 13.1.2", "body": "For any match in which there is an agreement under Law\n\n13.1.2 (Number of innings), if the result is not determined in any of the ways stated in 16.1, 16.2 or 16.3, then the result shall be as laid down in that agreement."}, {"num": "16.5", "title": "All other matches \u2013 A Tie or Draw", "body": "16.5.1 A Tie The result of a match shall be a Tie when all innings have been completed and the scores are equal.\n\n16.5.2 A Draw The result of a match shall be a Draw when it is not determined in any of the ways stated in 16.1, 16.2, 16.3, 16.4,\n\n16.5.1 or Law 42.6.2 (Captain refusing to remove a player from the field)."}, {"num": "16.6", "title": "Winning hit or extras", "body": "16.6.1 As soon as a result is reached as defined in 16.1, 16.2, 16.3, 16.4 or 16.5.1, the match is at an end. Nothing that happens thereafter, except as in Law 41.17.2 (Penalty runs), shall be regarded as part of it. Note also 16.9.\n\n16.6.2 The side batting last will have scored enough runs to win only if its total of runs is sufficient without including any runs completed by the batters before the completion of a catch, or the obstruction of a catch, from which the striker could be dismissed.\n\n16.6.3 If a boundary is scored before the batters have completed sufficient runs to win the match, the whole of the boundary allowance shall be credited to the side\u2019s total and, in the case of a hit by the bat, to the striker\u2019s score."}, {"num": "16.7", "title": "Statement of result", "body": "If the side batting last wins the match without losing all its wickets, the result shall be stated as a win by the number of wickets still then to fall. If, without having scored a total of runs in excess of the total scored by the opposing side, the innings of the side batting last has been completed, but as the result of an award of 5 Penalty runs its total of runs is then sufficient to win, the result shall be stated as a win to that side by Penalty runs. If the side fielding last wins the match, the result shall be stated as a win by runs. If the match is decided by one side conceding defeat or refusing to play, the result shall be stated as Match Conceded or Match Awarded, as the case may be."}, {"num": "16.8", "title": "Correctness of result", "body": "Any decision as to the correctness of the scores shall be the responsibility of the umpires. See Law 2.15 (Correctness of scores)."}, {"num": "16.9", "title": "Mistakes in scoring", "body": "If, after the players and umpires have left the field in the belief that the match has been concluded, the umpires discover that a mistake in scoring has occurred which affects the result then, subject to 16.10, they shall adopt the following procedure.\n\n16.9.1 If, when the players leave the field, the side batting last has not completed its innings and either the number of overs to be bowled in the Last hour, or in that innings, has not been completed or the agreed time for close of play, or for the end of the innings, has not been reached then, unless one side concedes defeat, the umpires shall order play to resume. Unless a result is reached sooner, play will then continue, if conditions permit, until the prescribed number of overs has been completed and either time for close of play has been reached or the allotted time for the innings has expired, as appropriate. The number of overs and time remaining shall be taken as they were at the call of Time for the supposed conclusion of the match. No account shall be taken of the time between that moment and the resumption of play.\n\n16.9.2 If, at this call of Time, the overs have been completed and no Playing time remains, or if the side batting last has completed its innings, the umpires shall immediately inform both captains of the necessary corrections to the scores and to the result."}, {"num": "16.10", "title": "Result not to be changed", "body": "Once the umpires have agreed with the scorers the correctness of the scores at the conclusion of the match \u2013 see Laws 2.15 (Correctness of scores) and 3.2 (Correctness of scores) \u2013 the result cannot thereafter be changed."}]}, {"num": 17, "title": "The over", "subs": [{"num": "17.1", "title": "Number of balls", "body": "The ball shall be bowled from each end alternately in overs of 6 valid balls."}, {"num": "17.2", "title": "Start of an over", "body": "An over has started when the bowler starts their run- up or, if there is no run-up, starts their action for the first delivery of that over."}, {"num": "17.3", "title": "Validity of balls", "body": "17.3.1 A ball shall not count as one of the 6 balls of the over unless it is delivered, even though, as in Law 38.3 (Non- striker leaving their ground early) a batter may be dismissed or some other incident occurs without the ball having been delivered.\n\n17.3.2 A ball delivered by the bowler shall not count as one of the 6 balls of the over\n\n17.3.2.1 i fit is called dead, or is to be considered dead, before the striker has had an opportunity to play it. See Law 20.7 (Dead ball; ball counting as one of over).\n\n17.3.2.2 i fit is called dead in the circumstances of Law 20.4.2.6. Note also the special provisions of Law\n\n20.4.2.5 (Umpire calling and signalling Dead ball).\n\n17.3.2.3 i fit is a No ball. See Law 21 (No ball).\n\n17.3.2.4 i fit is a Wide. See Law 22 (Wide ball).\n\n17.3.2.5 when any of Laws 24.4 (Player returning without permission), 28.2 (Fielding the ball), 41.4 (Deliberate attempt to distract or obstruct striker), or 41.5 (Deliberate distraction, deception or obstruction of batter) is applied.\n\n17.3.3 Any deliveries other than those listed in 17.3.1 and 17.3.2 shall be known as valid balls. Only valid balls shall count towards the 6 balls of the over."}, {"num": "17.4", "title": "Call of Over", "body": "When 6 valid balls have been bowled and when the ball becomes dead, the umpire shall call Over before leaving the wicket. See also Law 20.3 (Call of Over or Time)."}, {"num": "17.5", "title": "Umpire miscounting", "body": "17.5.1 If the umpire miscounts the number of valid balls, the over as counted by the umpire shall stand.\n\n17.5.2 If, having miscounted, the umpire allows an over to continue after 6 valid balls have been bowled, the umpire shall subsequently call Over when the ball becomes dead after any delivery, even if that delivery is not a valid ball."}, {"num": "17.6", "title": "Bowler changing ends", "body": "A bowler shall be allowed to change ends as often as desired, provided they do not bowl two overs consecutively, nor bowl parts of each of two consecutive overs, in the same innings."}, {"num": "17.7", "title": "Finishing an over", "body": "17.7.1 Other than at the end of an innings, a bowler shall finish an over in progress unless incapacitated or suspended under any of the Laws.\n\n17.7.2 If for any reason, other than the end of an innings, an over is left uncompleted at the start of an interval or interruption, it shall be completed on resumption of play."}, {"num": "17.8", "title": "Bowler incapacitated or suspended during an over", "body": "If for any reason a bowler is incapacitated while running up to deliver the first ball of an over, or is incapacitated during an over, the umpire shall call and signal Dead ball. If a bowler is incapacitated or suspended during an over, another bowler shall complete the over from the same end, provided that no bowler delivers two overs consecutively, nor delivers parts of each of two consecutive overs, in that innings."}]}, {"num": 18, "title": "Scoring runs", "subs": [{"num": "18.1", "title": "A run", "body": "The score shall be reckoned by runs. A run is scored\n\n18.1.1 so often as the batters, at any time while the ball is in play, have crossed and made good their ground from end to end.\n\n18.1.2 when a boundary is scored. See Law 19 (Boundaries).\n\n18.1.3 when Penalty runs are awarded. See 18.6."}, {"num": "18.2", "title": "Runs disallowed and runs not scored", "body": "Wherever in these Laws provision is made for the scoring of runs or awarding of penalties, such runs and penalties will be subject to any provisions that may be applicable for a run to be disallowed or a run not to be scored (see Appendix A.11) or for the non-award of penalties. When runs are disallowed, the one-run penalty for No ball or Wide shall stand and 5-run penalties shall be allowed, except for Penalty runs under Law 28.3 (Protective helmets belonging to the fielding side)."}, {"num": "18.3", "title": "Short runs", "body": "18.3.1 A run is short if a batter fails to make good their ground in turning for a further run.\n\n18.3.2 Although a short run shortens the next one, the latter if completed shall not be regarded as short. A striker setting off for the first run from in front of the popping crease may do so also without penalty."}, {"num": "18.4", "title": "Unintentional short runs", "body": "Except in the circumstances of 18.5,\n\n18.4.1 if either batter runs a short run, the umpire concerned shall, unless a boundary is scored, call and signal Short run as soon as the ball becomes dead and that run shall not be scored.\n\n18.4.2 if, after either or both batters run short, a boundary is scored the umpire concerned shall disregard the short running and shall not call or signal Short run, unless the boundary is a result of an overthrow or wilful act of a fielder. See Law 19.8 (Overthrow or wilful act of fielder).\n\n18.4.3 if both batters run short in one and the same run, this shall be regarded as only one short run.\n\n18.4.4 if more than one run is short then, subject to 18.4.2 and 18.4.3, all runs called as short shall not be scored.\n\n18.4.5 if there has been more than one short run, the umpire shall inform the scorers as to the number of runs to be recorded."}, {"num": "18.5", "title": "Deliberate short runs", "body": "18.5.1 If either umpire considers that one or both batters deliberately ran short at that umpire\u2019s end, the umpire concerned shall, when the ball is dead, call and signal Short run and inform the other umpire of what has occurred and apply 18.5.2.\n\n18.5.1.1 A deliberate short run is an attempt by the batters to appear to run more than one run, while at least one batter deliberately does not make good their ground at one end.\n\n18.5.1.2 Provided the umpires believe that there was no intention by the batter concerned to deceive the umpires, it will not be considered a deliberate short run if the batters abandon an attempted run.\n\n18.5.2 The bowler\u2019s end umpire shall disallow all runs to the batting side signal No ball or Wide to the scorers, if applicable repeat the Short run signal to the scorers award 5 Penalty runs to the fielding side award any other 5-run Penalty that is applicable except for Penalty runs under Law 28.3 (Protective helmets belonging to the fielding side) inform the captain of the fielding side and, as soon as practicable, the captain of the batting side of the reason for this action. instruct the fielding captain to decide which of the batters at the wicket, including the incoming batter if applicable, shall face the next delivery (see 18.13).\n\n18.5.3 The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "18.6", "title": "Runs awarded for penalties", "body": "Runs shall be awarded for penalties under 18.5, and Laws 21 (No ball), 22 (Wide ball), 24.4 (Player returning without permission), 26.4 (Penalties for contravention), 27.4.2 (Illegal movement by the wicket-keeper), 28.2 (Fielding the ball), 28.3 (Protective helmets belonging to the fielding side), 28.6.3 (Illegal movement by any fielder other than the wicket- keeper), 41 (Unfair play) and 42 (Players\u2019 conduct). Note, however, the restrictions on the award of Penalty runs under 18.5, and Laws 23.3 (Leg byes not to be awarded), 25.7 (Restriction on the striker\u2019s runner), 28.3 (Protective helmets belonging to the fielding side), 34 (Hit the ball twice), 41.14 (Batter damaging the pitch) and 41.15 (Striker in protected area)."}, {"num": "18.7", "title": "Runs scored for boundaries", "body": "Runs shall be scored for boundary allowances under Law 19 (Boundaries)."}, {"num": "18.8", "title": "Runs scored when a batter is dismissed", "body": "When a batter is dismissed, any runs for penalties awarded to either side shall stand. No other runs shall be credited to the batting side, except as follows.\n\n18.8.1 If a batter is dismissed Obstructing the field, the batting side shall also score any runs completed before the offence. If, however, the obstruction or distraction prevented a catch being made, no runs other than penalties shall be scored.\n\n18.8.2 If a batter is dismissed Run out, the batting side shall also score any runs completed before the wicket was fairly broken.\n\nIf, however, when a striker has a runner, and the striker is dismissed Run out under Law 25.6.5 (Dismissal and conduct of a batter and their runner), any runs completed by the runner and the other batter shall be disallowed."}, {"num": "18.9", "title": "Runs scored when the ball becomes dead other than at the fall of a wicket", "body": "the fall of a wicket When the ball becomes dead for any reason other than the fall of a wicket, or is called dead by an umpire, unless there is specific provision otherwise in the Laws, any runs for penalties awarded to either side shall be scored. Note however the provisions of Laws 23.3 (Leg byes not to be awarded) and 28.3 (Protective helmets belonging to the fielding side). Additionally, the batting side shall be credited with, a ll runs completed by the batters before the incident or call of Dead ball and the run in progress if the batters had already crossed at the instant of the incident or call of Dead ball. Note specifically, however, the provisions of Law 41.5.8 (Deliberate distraction, deception or obstruction of batter)."}, {"num": "18.10", "title": "Crediting of runs scored", "body": "Unless stated otherwise in any of the Laws,\n\n18.10.1 if the ball is struck by the bat, all runs scored by the batting side shall be credited to the striker, except for the following: an award of 5 Penalty runs, which shall be scored as Penalty runs the one-run penalty for a No ball, which shall be scored as a No ball extra.\n\n18.10.2 if the ball is not struck by the bat, runs shall be scored as Penalty runs, Byes, Leg byes, No ball extras or Wides as the case may be. If Byes or Leg byes accrue from a No ball, only the one-run penalty for No ball shall be scored as such, and the remainder as Byes or Leg byes as appropriate.\n\n18.10.3 the bowler shall be debited with: all runs scored by the striker all runs scored as No ball extras all runs scored as Wides."}, {"num": "18.11", "title": "Batter returning to original end", "body": "18.11.1 When the striker is dismissed in any of the circumstances in 18.11.1.1 to 18.11.1.7, the not out batter shall return to their original end.\n\n18.11.1.1 A dismissal in the circumstances of Law 25.6.4 or\n\n25.6.5 (Dismissal and conduct of a batter and their runner).\n\n18.11.1.2 Bowled.\n\n18.11.1.3 Stumped.\n\n18.11.1.4 Hit the ball twice.\n\n18.11.1.5 LBW.\n\n18.11.1.6 Hit wicket.\n\n18.11.1.7 Caught.\n\n18.11.2 The batters shall return to their original ends when\n\n18.11.2.1 a boundary is scored, unless as a result of an overthrow or wilful act of a fielder (see Law 19.8).\n\n18.11.2.2 runs are disallowed for any reason except under Law 18.5.2 (see 18.13)."}, {"num": "18.12", "title": "Penalty runs", "body": "18.12.1 When a batter is dismissed in any of the ways in 18.12.1.1 to 18.12.1.2, the not out batter shall return to the wicket they have left but only if the batters had not already crossed at the instant of the incident causing the dismissal. If runs are to be disallowed, however, the not out batter shall return to their original end.\n\n18.12.1.1 Obstructing the field, where the obstruction or distraction does not prevent the striker being out Caught.\n\n18.12.1.2 Run out other than under Law 25.6.4 or 25.6.5 (Dismissal and conduct of a batter and their runner).\n\n18.12.2 If, while a run is in progress, the ball becomes dead for any reason other than the dismissal of a batter, the batters shall return to the wickets they had left, but only if they had not already crossed in running when the ball became dead. If, however, any of the circumstances of 18.11.2.1 to 18.11.2.2 apply, the batters shall return to their original ends."}, {"num": "18.13", "title": "Batters going to an end determined by players", "body": "18.13.1 When a batter is dismissed Obstructing the field, where the obstruction prevents a catch being taken, the captain of the fielding side shall decide whether the not out batter shall return to the wicket they have left, or the other end.\n\n18.13.2 If the ball becomes Dead under Law 18.5.2 (Deliberate short running), the captain of the fielding side shall decide which batter is to face the next delivery.\n\n18.13.3 If the ball becomes dead under Law 41.5 (Deliberate distraction, deception or obstruction of batter), the batters at the wicket decide which batter is to face the next delivery."}]}, {"num": 19, "title": "Boundaries", "subs": [{"num": "19.1", "title": "Determining the boundary of the field of play", "body": "19.1.1 Before the toss, the umpires shall determine the boundary of the field of play, which shall be fixed for the duration of the match. See Law 2.3.1.4 (Consultation with captains).\n\n19.1.2 The boundary shall be determined such that no part of any sightscreen will, at any stage of the match, be within the field of play."}, {"num": "19.2", "title": "Identifying and marking the boundary", "body": "19.2.1 Wherever practicable, the boundary shall be marked by means of a continuous white line or by an object in contact with the ground.\n\n19.2.2 If the boundary is marked by means of a white line,\n\n19.2.2.1 the edge of the line nearest the pitch shall be the boundary.\n\n19.2.2.2 a nobject such as a flag, post or board, used merely to highlight the position of a line marked
