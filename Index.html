 may transfer between age teams within the same club with Elected Committee approval."}, {"num": "2.8", "title": "Committee May Reject Registration/Transfers", "body": "The Committee may reject any registration or transfer, in any grade/age group, at its discretion."}]}, {"id": "parent", "title": "The Parent(s) or Carer(s)", "items": [{"num": "3.1", "title": "Parent(s)/Carer(s) Code of Behaviour", "body": "Parents/carers are expected to: support and encourage their child and all players, coaches and officials positively; accept that officials can make mistakes without being criticised; put their child's emotional and physical wellbeing ahead of winning, in a safe and healthy environment; remember the game is for the kids, not the adults, and help make it fun; treat everyone with respect regardless of race, creed or ability; pitch in however they can (as a fan, coach, or with admin); and keep youth sport events free of drugs, alcohol and tobacco."}, {"num": "3.2", "title": "Failing to Adhere to Parent Code", "body": "Penalties (via Elected Committee, Management Committee, P&DC, or combination) may include: being prohibited from attending games for a set number of games; suspension for the season; or suspension of the child and/or parent for a set period or the season."}]}, {"id": "coach", "title": "The Coach", "items": [{"num": "4.1", "title": "Coaching Certificates Required", "body": "Junior team coaches must hold at least the minimum Orientation Coaching Level Certificate."}, {"num": "4.2", "title": "Representative Coach", "body": "BCDCA Representative team coaches must hold at least a Level 1 Coaching Certificate."}, {"num": "4.3", "title": "Umpiring Certificates Required", "body": "All Junior Coaches must hold a BCDCA Certificate before the last competition round in December."}, {"num": "4.4", "title": "Minimal On-Field Coaching", "body": "Permitted in Under 10, Under 11, and Under 12 age groups."}, {"num": "4.5", "title": "No On-Field Coaching", "body": "Not permitted in Under 13, Under 15, and Under 17 age groups."}, {"num": "4.6", "title": "Replacing Player Called to Blacktown Grade", "body": "With Elected Committee approval, a club may replace a player promoted to Blacktown Grade mid-match; the replacement continues the original player's innings and must be a registered, eligible club member."}]}, {"id": "protocol", "title": "Match Protocol", "items": [{"num": "5.1", "title": "No Smoking", "body": "Smoking is not permitted on the field of play during a match."}, {"num": "5.2", "title": "Fitness of Grounds", "body": "5.2.1 Ground fitness is decided by both teams' coaches/managers, or the appointed umpire if they disagree, or the status quo continues if no umpire is present and they disagree.\n5.2.2 Teams must attend the ground."}, {"num": "5.3", "title": "Seven Players Required on Day 1", "body": "Teams need at least 7 players present by 8:45am on day 1 or forfeit to the opponent.\n5.3.1 First forfeit: fine up to $30.\n5.3.2 Second forfeit: automatic $60 fine, possible suspension, unless a satisfactory excuse is accepted by the Elected Committee.\n5.3.3 A forfeiting team/club pays any appointed umpires' fees within 14 days."}, {"num": "5.4", "title": "Forfeit (2nd Innings)", "body": "A team failing to take the field for its 2nd innings when required (conditions permitting) is fined the equivalent of a forfeit and may lose competition points."}, {"num": "5.5", "title": "Less Than 11 Players \u2013 Scorebook", "body": "With fewer than 11 players and all available wickets fallen, absent players are recorded 'NIL' and the 10th wicket is deemed fallen; an absent player who never batted doesn't count as an innings for averages."}, {"num": "5.6", "title": "Team Sheets", "body": "5.6.1 Result slips/team sheets are due to the Junior Competition Secretary by 8:00pm the Thursday after the match.\n5.6.2 An honest incorrect team sheet draws a $10 fine (first offence) / $25 (subsequent); no points are lost.\n5.6.3 Home team posts results/scorecards on Play HQ by 8:00pm the following Tuesday ($10 fine for non-compliance).\n5.6.4 Away team enters scores and confirms results by 8:00pm the following Thursday ($10 fine for non-compliance).\n5.6.5 Teams must nominate all available players (including substitutes) on Play HQ before play; all named players must bat or bowl."}, {"num": "5.7", "title": "Awarding of Match Points", "body": "2-Day Matches: Outright win 10; outright win (lost 1st innings) 10; 1st innings win 6; tied match (2nd innings) 5; tied match (1st innings) 4; 1st innings loss 1; outright loss/forfeit/bye 0.\n1-Day & T20: 1st innings win 6; tied match 4; drawn match 3; 1st innings loss 1; forfeit/bye 0.\nAll formats: win on forfeit = highest points gained that round in that age/division."}, {"num": "5.8", "title": "Disputes on Match Results", "body": "Disputed scorebooks go to the Elected Committee; an appointed umpire impounds and forwards them to the Honorary Secretary.\n5.8.1 Play HQ disputes: press the dispute button and email the Junior Competition Secretary.\n5.8.2 A disputed match continues under protest, with details recorded in both scorebooks; BCDCA decides the result."}, {"num": "5.9", "title": "Wides and No-Balls \u2013 Entering", "body": "In competitions above Under 11, wides and no-balls delivered are entered as runs scored against the bowler."}, {"num": "5.10", "title": "Suspect Bowling Action \u2013 Procedure", "body": "5.10.1 Raise it with the opposing management after the match; don't no-ball the player during the game.\n5.10.2 Either team's management may request a Committee member (with a BCDCA member) to view the bowler and give an opinion.\n5.10.3 The player must never be humiliated.\n5.10.4 This procedure is for a suspect action, distinct from a deliberate throw."}, {"num": "5.11", "title": "Regrading of a Team During the Season", "body": "After a management-committee-set date, age groups are reviewed and imbalanced teams may be moved between divisions (e.g. Div 1\u21942, Div 3\u21942). A team moving down keeps its points or is bumped up to match the lowest team in the new division; a team moving up keeps its points or drops to match the highest team in the new division, whichever is lower."}]}, {"id": "condition", "title": "Match Condition", "items": [{"num": "6.1", "title": "No Postponement of Matches", "body": "No match may be postponed for picnics or similar functions."}, {"num": "6.2", "title": "Pitches", "body": "6.2.1 Home clubs provide coir matting over concrete wickets lacking other covering.\n6.2.2 A ball pitching on the matting leathers or exposed concrete centre is called 'No Ball'.\n6.2.3 A ball pitching off synthetic or concrete pitches is called 'No Ball'.\n6.2.4 In all age groups, any full-pitched ball (full toss) passing above the batter's waist is called 'No Ball', regardless of bowler pace."}, {"num": "6.3", "title": "Boundaries", "body": "Boundaries are set at 55 metres from the stumps except where impractical (see stage-specific modified lengths for Stage 1, 2 and 3)."}, {"num": "6.4", "title": "Approved Cricket Balls", "body": "Under 9: Kookaburra Softaball (110g). Under 10 & 11: Kookaburra Rookie/Star (142g). Under 12 & 13: Kookaburra Red King/Colt (142g). Under 15 & 17: Kookaburra Tuff Pitch/Red King/Colt (156g). Balls must carry the BCDCA brand (Kookaburra, Commander, Softaball); Rookie/Star do not carry the brand. The batting team has no right to demand a new ball for its 2nd innings. In U9/U10/U11, a ball may be reused multiple times if coaches deem it fit; disputes are resolved with a new/other ball."}, {"num": "6.5", "title": "Clothing", "body": "White/cream collared shirt, white/cream trousers or shorts, predominantly white shoes/boots; white/cream socks (or long white/cream trousers if no socks); white/cream sweater permitted.\n6.5.1 An approved coloured team shirt (with collar) may substitute for white/cream.\n6.5.2 Other exposed clothing (e.g. skins) must be white. Coloured shirt colours/designs need Management Committee approval (final decision); if used, the whole club wears the same approved shirt.\n6.5.3 Girl's League players may wear white, cream or black trousers."}, {"num": "6.6", "title": "No Metal Spikes \u2013 Synthetic Pitch", "body": "No metal spikes or cleats on grounds with synthetic cricket wickets."}, {"num": "6.7", "title": "Helmet Mandatory", "body": "All players must wear a helmet while batting, in all weather and against all bowling types."}, {"num": "6.8", "title": "Fielding Restrictions", "body": "6.8.1 Under-14s can't field within a 10m circle at the striker's end, except wicketkeeper, offside slip and gully.\n6.8.2 Over-14 and under-16 players in that 10m circle must wear a helmet (with faceguard) and protector, except wicketkeeper, offside slip and gully.\n6.8.3 A breach before the batter strikes/is struck/ball passes the stumps means the umpire calls 'Dead Ball'.\n6.8.4 Wicketkeepers standing up to the stumps (within 2m) must always wear a helmet."}, {"num": "6.9", "title": "Extreme Heat Policy", "body": "'Feels like' temperature (BOM app, nearest station) is the official measure.\nLevel 1: extra drinks intervals scheduled if 'feels like' exceeds 32\u00b0C; players/umpires may leave the field.\nLevel 2: play stops immediately at 38\u00b0C or higher; resumes if it drops below 38\u00b0C; abandoned (result: draw, if no result yet) if it hasn't dropped below 38\u00b0C after 1 hour off the field.\nLost playing time from heat is treated like a rain delay.\nThe Association may cancel an entire day's play in advance if the forecast for 4:00pm the day before is 45\u00b0C or more.\nFor forecasts above 32\u00b0C, umpires (if assigned), coaches and captains hold a pre-play heat safety briefing to decide on extra/longer drinks breaks and any extended interval between innings."}, {"num": "6.10", "title": "Lightning Strike \u2013 Procedure", "body": "If thunder follows a lightning flash within 30 seconds, play stops immediately and doesn't resume until 30 minutes after that flash."}]}, {"id": "finals", "title": "Final Series", "items": [{"num": "7.1", "title": "Age Group Positions by Percentage", "body": "Where teams haven't played the same number of matches, positions are decided by percentage: points gained \u00f7 maximum points possible for matches played."}, {"num": "7.2", "title": "Finals Qualification \u2013 Equal Points", "body": "Top 4 teams meet: 1st v 4th, 2nd v 3rd; winners play the Final. Ties on points/percentage are broken by runs-per-wicket ratio: (runs scored \u00f7 wickets lost) \u00f7 (runs scored against \u00f7 wickets taken); the higher quotient wins."}, {"num": "7.3.1", "title": "Finals Eligibility", "body": "A player needs at least 40% of their team's competition matches played before the semis to be eligible.\n7.3.1.1 An injured/indisposed player may be substituted by a player from no higher age group (or same/higher division) who has played 80% of matches, with details/statistics sent to the Elected Committee.\n7.3.1.2 A match only counts if the player was on the team sheet and batted/bowled; forfeited matches, byes and abandoned matches don't count."}, {"num": "7.3.2", "title": "Semis/Finals Format & Grounds", "body": "Played over 2 days on Elected-Committee-allocated grounds; home ground goes to the higher-finishing team where suitable, otherwise the Committee allocates a suitable ground."}, {"num": "7.3.3\u20137.3.6", "title": "No-Result Outcomes", "body": "7.3.3 No 1st-innings result in a semi: the higher-placed team pre-semis is declared the winner. 7.3.4 No play possible on both Final days: rescheduled to the following weekend. 7.3.5 No 1st-innings result in the rescheduled Final: the higher-placed finalist pre-semis is declared Premiers. 7.3.6 A tied Final results in Joint-Premiers."}]}, {"id": "umpires", "title": "Umpires", "items": [{"num": "8.1", "title": "Dress Requirements", "body": "Coaches/managers/parents officiating as umpires (where no official umpire stands, or as square-leg umpire alongside a single appointed umpire) must wear a shirt (no singlets/muscle shirts) and enclosed footwear (no thongs/masseurs/flip-flops)."}, {"num": "8.2", "title": "MCC Rule 42 Not Applied", "body": "MCC Law 42 of the 2017 Laws of Cricket does not apply in BCDCA competitions, since official umpires aren't present at every game, leaving the rule open to abuse."}]}, {"id": "formats_overview", "title": "Match Formats \u2013 Overview", "items": [{"num": "9.1.1", "title": "U10 & U11", "body": "Play under Cricket Australia 'Stage 1' Format."}, {"num": "9.1.2", "title": "U12 & U13", "body": "Play under Cricket Australia 'Stage 2' Format."}, {"num": "9.1.3", "title": "U15", "body": "Plays under Cricket Australia 'Stage 3' Format (1-Day & 2-Day matches)."}, {"num": "9.1.4", "title": "Girl's League U13", "body": "Plays under Cricket Australia 'Stage 1' Format."}, {"num": "9.1.5", "title": "Girl's League Over 13", "body": "Plays under Cricket Australia 'Stage 2' Format."}, {"num": "9.1.6", "title": "U17", "body": "Plays under the BCDCA Senior Competition Format (1-Day & 2-Day match formats)."}], "short": "Match Formats"}, {"id": "stage1", "title": "Cricket Australia Stage 1 (U10 / U11 / Girls League U13)", "items": [{"num": "Overs & Time", "title": "Overs, Team Size & Time", "body": "20 overs per team (120 balls), 1 innings each. Ideal 10 players/team (8 for Girls U13), minimum 5, maximum 8 on field at once. Matches run up to 3 hours (180 min). U10/U11 start 8am, finish no later than 11:10am(equivalent slot); Girls League U13 starts 9am, finishes no later than 12:10pm."}, {"num": "Batting", "title": "Batting Rules & Retirement", "body": "All balls (including wides/no-balls) count toward a batter's ball total. Batters swap ends after a dismissal (not-out batter faces next ball after a run out). Batters retire once they reach their allotted balls, not at over's end. Allotted balls by team size: 5 players\u201324 balls, 6\u201320, 7\u201317, 8\u201315 (ideal for U10/U11 and Girls U13), 9\u201313, 10\u201312. The last batters in the line-up receive any remaining balls. Unlimited dismissals \u2014 batters must still face their allotted balls."}, {"num": "Bowling", "title": "Bowling Rules", "body": "6 balls max per over. All players must bowl. Max 3 overs per bowler (U10/U11 Sunday cricket allows 1 bowler up to 4 overs if only 5 players on the day; Girls League U13 allows max 4 overs per bowler). Bowling is from one end for the whole match."}, {"num": "Fielding", "title": "Fielding Rules", "body": "Fielders rotate to experience all positions. No fielder within 15 metres of the batter or each other. Each team uses two wicketkeepers (10 overs each). Extra players rotate on/off the field each over."}, {"num": "Pitch & Boundary", "title": "Pitch & Boundary Dimensions", "body": "Pitch: 16 metres stump-to-stump, popping crease 1.2m from stumps. Boundary: 40 metres, measured from the striker's end (Girls U13: minimum boundary clearance 3m)."}, {"num": "Equipment", "title": "Equipment Requirements", "body": "Helmets must be worn at all times, including by wicketkeepers. Pads, gloves, protector and other safety gear as preferred. Minimum 1 set of portable stumps per team (2 recommended). Bat under 1.8lb (800g). Measuring tape, chalk/tape for creases, boundary markers."}, {"num": "Dismissals", "title": "Modes of Dismissal", "body": "Bowled, Caught, Hit Wicket, Run Out, Stumped, Caught & Bowled."}], "short": "Stage 1 (U10/U11/Girls U13)"}, {"id": "stage2", "title": "Cricket Australia Stage 2 (U12 / U13 / Girls League O13)", "items": [{"num": "Overs & Time", "title": "Overs, Team Size & Time", "body": "30 overs per team (180 balls), 1 innings each, closing at 8 wickets down or all overs bowled. Ideal 9 players/team, minimum 7, maximum 9 on field. Matches run up to 3.5 hours (220 min): start by 8:15am, 1st-innings cut-off 10:00am, 15-min change of innings, 2nd innings from 10:15am to 12:00pm, match completed by 12:10pm at the latest. Pitch: 18 metres stump-to-stump, popping crease 1.2m from stumps."}, {"num": "Batting", "title": "Batting Rules & Retirement", "body": "Batters retire at 35 balls faced (assuming some dismissals); retired batters return to bat only after all others have batted, in retirement order. A dismissed batter's innings ends (no further batting) unless retired-not-out rules apply. Max 9 players may bat per team; players who didn't bowl must bat. All balls (including wides/no-balls) count toward the ball total."}, {"num": "Bowling", "title": "Bowling Rules", "body": "6 balls/over (max 8 including wides/no-balls); the 30th over must have 6 legal deliveries. Max 5 overs per bowler. If the team has 9 players or fewer, all must bowl; if more than 9, a maximum of 9 may bowl, and those who didn't bat must bowl. Bowling is from one end for the match, except in Under 13, where bowlers change ends after 15 overs (each end bowls 15 of the 30 overs)."}, {"num": "Fielding & Dismissals", "title": "Fielding & Dismissals", "body": "Fielders rotate to experience all positions; no fielder within 10 metres of the batter or each other. Wicketkeepers may be changed at the 15-over mark. All modes of dismissal count in Under 13; there is no LBW dismissal in Under 12."}, {"num": "Boundary", "title": "Boundary Dimensions", "body": "45 metres. In Under 12, measured from the batter's end. In Under 13, measured from the centre of the pitch (so both teams bowl from both ends across their 30 overs \u2014 15 overs per end). Minimum boundary clearance 3m."}, {"num": "Equipment", "title": "Equipment Requirements", "body": "Helmets must be worn at all times, including by wicketkeepers. Pads, gloves, protector and other safety gear. Minimum 1 set of portable stumps per team (2 recommended). Bat under 2lb (1000g). Measuring tape, chalk/tape for creases, boundary markers."}], "short": "Stage 2 (U12/U13)"}, {"id": "stage3", "title": "Cricket Australia Stage 3 (U15, base rules for U17)", "items": [{"num": "Overs & Time", "title": "Overs, Team Size & Time", "body": "30 overs per team (180 balls), 11 players/team, 1 innings each (10 wickets or all overs). Matches run up to 3.5 hours (220 min): start by 8:15am, 1st-innings cut-off 10:00am, 15-min change of innings, 2nd innings 10:15am\u201312:00pm, completed by 12:10pm at latest. Standard pitch length (20.1m), clearly marked popping creases."}, {"num": "Batting", "title": "Batting Rules", "body": "No retirement in Stage 3 cricket. The innings closes at 10 wickets down or when allocated overs are completed."}, {"num": "Bowling", "title": "Bowling Rules", "body": "6 balls per over; wides and no-balls must be re-bowled. Max overs per bowler: 5 in Under 15, 6 in Under 17 (see the One-Day Match Format section for full spell/rest rules)."}, {"num": "Fielding & Boundary", "title": "Fielding & Boundary", "body": "Fielders rotate positions; no fielder within 10 metres of the batter or each other. Boundary measured from the centre, set at 55 metres, minimum clearance 3m."}, {"num": "Dismissals & Equipment", "title": "Dismissals & Equipment", "body": "All modes of dismissal count. Helmets mandatory at all times (including wicketkeepers). Pads, gloves, protector and other safety gear. Bat under 2.2lb (1000g). Minimum 1 set of portable stumps and bails per team (2 recommended)."}], "short": "Stage 3 (U15, U17 base)"}, {"id": "oneday", "title": "One-Day Match Format (Sections 13.x)", "items": [{"num": "13.1", "title": "Overs & Minimum Time", "body": "Each team bowls 30 overs; at least 15 overs bowled per side is required to constitute a match."}, {"num": "13.2.1", "title": "Bowler Overs Cap", "body": "No bowler in Under 12\u201317 may bowl more than 6 overs in an innings of a 30-over/one-day match \u2014 including in semis/finals played under these conditions."}, {"num": "13.2.2", "title": "Spell Restrictions by Age", "body": "U12 & U13: max 4-over spell, rested double the overs bowled. U15: max 5-over spell, rested double. U17: max 6-over spell, rested double."}, {"num": "13.2.3", "title": "Extending a Spell", "body": "A bowler resuming before the rest period ends is treated as extending the same spell (overall spell limit still applies); the normal inter-spell break applies once the spell finishes."}, {"num": "13.2.4", "title": "Rest-Period Calculation", "body": "Interruptions (wet weather/interval) count as 1 over per 3.5 minutes (or part); a scheduled 20-minute tea interval counts as 3 overs from each end."}, {"num": "13.2.5\u201313.2.6", "title": "Record-Keeping & Breach", "body": "Scorers and umpires use signed Bowling Limitation Record Sheets each innings. Breach of these restrictions may lead to disciplinary action and/or loss of competition points."}, {"num": "13.3", "title": "Innings Cut-Off Times", "body": "The team batting first completes its innings at the over in progress at 10:00am, regardless of overs bowled; the team batting second gets the same number of overs and starts at 10:15am."}, {"num": "13.4", "title": "Second Innings Closure", "body": "The team batting second may close its innings at any time; the over count then no longer applies, and play continues to the scheduled close unless both managers agree to end the game (noted and signed in both scorebooks)."}, {"num": "13.5", "title": "No Outright Results", "body": "There are no outright results; the match concludes with a first-innings result."}], "short": "One-Day Format"}, {"id": "twoday", "title": "Two-Day Match Format \u2013 Stage 3 (Sections 14.x)", "items": [{"num": "14.1", "title": "Overs", "body": "Each team bowls 60 overs."}, {"num": "14.2", "title": "Insufficient Overs on Day 1", "body": "If the side bowling first hasn't bowled at least 55 overs by 12:00noon (and the opposition isn't all out), day 2 starts 10 minutes early to complete the 55 overs. If 55\u201359 overs were bowled by noon, the match is reduced so the second team receives the same overs as the first."}, {"num": "14.3", "title": "Weather/Injury Adjustment", "body": "In inclement weather or injury only, the first innings over rate is reduced by 3.5 minutes per over for lost time."}, {"num": "14.4", "title": "60 Overs Completed Early", "body": "If 60 overs are bowled on day 1 before the finishing time, play continues after the change of innings until the scheduled close."}, {"num": "14.5", "title": "No Play on Day 1", "body": "If there's no play on day 1, the match is played on day 2 under one-day match conditions."}, {"num": "14.6\u201314.7", "title": "Over Rate", "body": "Minimum over rate of 18 overs/hour (~3.5 minutes/over); teams are expected to bowl at or better than this. Departure may be treated as unfair play by the Elected Committee."}, {"num": "14.8\u201314.9", "title": "End of Match & Result", "body": "The match concludes at stumps regardless of scheduled overs; no result by then means a draw. The team scoring more runs (regardless of wickets) wins; the first innings ends immediately once its overs are bowled, and the match continues to stumps."}, {"num": "14.10", "title": "Second Innings Closure", "body": "If the team batting second uses its full overs, closes, or is dismissed before the allocated overs, the over count no longer applies and play continues to stumps, unless both managers agree to end the game (noted and signed in both scorebooks)."}, {"num": "14.11", "title": "Second Team's Over Allocation", "body": "If the team batting first is dismissed/closes before 60 overs, the team batting second gets its full 60-over allocation \u2014 except if the first team loses its final wicket in overs 55\u201360 within 4 minutes of stumps on day 1, in which case the second team gets only the same number of overs as the first."}, {"num": "14.12", "title": "Follow-On", "body": "The required lead to enforce the follow-on is 75 runs."}, {"num": "14.13", "title": "Match Conclusion Timing", "body": "The match concludes at the rule-specified time regardless of overs completed; no result by then means a draw."}, {"num": "14.14", "title": "Injured Bowler", "body": "Another player completes the over immediately if a bowler is injured, but no player bowls two overs (or part) consecutively in one innings."}, {"num": "14.15.1\u201314.15.2", "title": "Bowler Overs & Spell Caps", "body": "U15: max 10 overs/innings, max 5-over spell, rested double the overs bowled. U17: max 12 overs/innings, max 6-over spell, rested double."}, {"num": "14.15.3", "title": "Extending a Spell", "body": "A bowler resuming before the rest period ends is treated as extending the same spell (limit still applies); the normal break applies once the spell finishes."}, {"num": "14.15.4", "title": "Rest-Period Calculation", "body": "Interruptions count as 1 over per 3.5 minutes (or part); a 20-minute tea interval counts as 3 overs from each end."}, {"num": "14.15.5\u201314.15.6", "title": "Record-Keeping & Breach", "body": "Signed Bowling Limitation Record Sheets are used each innings. Breach may lead to disciplinary action and/or loss of competition points."}, {"num": "14.16.1\u201314.16.3", "title": "Player Limits", "body": "Maximum 13 players nominated per team sheet; only 11 may bat and 11 may bowl. If a team bats/bowls a second innings, the same original 11 batters/bowlers from the first innings must be used again."}], "short": "Two-Day Format"}, {"id": "awards", "title": "Awards", "items": [{"num": "15.1", "title": "Junior Competition Championship", "body": "Per By-Law 9(b), a club needs a minimum of 4 junior teams playing to be eligible for the Junior Club Championship (same threshold applies for seniors)."}, {"num": "15.2.1", "title": "Batting Aggregate Award", "body": "Awarded to the highest run-scorer in each age group/division (U12, U15/U16, U17, and Stage 2/3 competitions); the player must have played at least 50% of the season's matches."}, {"num": "15.2.2", "title": "Batting Average Award", "body": "Awarded to the highest-average scorer in each age group/division (U12, U15, U17, Stage 2/3); requires at least 50% of matches played and a minimum of 150 runs scored."}, {"num": "15.2.3", "title": "Highest Score Award", "body": "Awarded for the single highest score in each age group/division (U12, U15, U17, Stage 2/3) \u2014 simply the highest individual innings score."}, {"num": "15.2.4", "title": "Bowling Aggregate Award", "body": "Awarded to the most wickets taken in each age group/division (U12, U15, U17, Stage 2/3); requires at least 50% of matches played."}, {"num": "15.2.5", "title": "Bowling Average Award", "body": "Awarded for the lowest bowling average in each age group/division (U12, U15, U17, Stage 2/3); requires at least 50% of matches played and a minimum of 15 wickets taken."}, {"num": "15.2.5b", "title": "Best Bowling Award", "body": "Awarded for the best innings bowling figures in each age group/division (U12, U15, U17, Stage 2/3) \u2014 most wickets first, then fewest runs conceded as tiebreaker."}]}]};

<script>
/* ============================================================
   BCDCA Cricket Rules — App Logic
   Stack-based router so the back button always returns to the
   exact previous screen, with a persistent Home control.
   ============================================================ */

const ICONS = {
  back: `<svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  home: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></svg>`,
  chev: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  gavel: `<svg viewBox="0 0 24 24" fill="none"><path d="M14 4l6 6M5 13l6 6M9.5 8.5l-6 6 3 3 6-6M13 5l6 6M17 3l4 4-2 2-4-4 2-2z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  trophy: `<svg viewBox="0 0 24 24" fill="none"><path d="M7 4h10v4a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 5H4v2a4 4 0 0 0 3.5 4M17 5h3v2a4 4 0 0 1-3.5 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 13v3m-3 4h6m-3-4v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  seedling: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 21v-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6zM12 13c0-3-2.5-5-6-5 0 3.5 2.5 5 6 5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
};

/* ---------- Router ---------- */
const stack = [];               // navigation stack of {render, title, subtitle}
let currentPopup = false;

function pushScreen(screen, opts={}){
  stack.push({screen, opts});
  render();
  if(!opts.silentScroll) document.getElementById('content').scrollTop = 0;
  history.pushState({depth: stack.length}, '');
}

function goHome(){
  stack.length = 0;
  stack.push({screen:'home', opts:{}});
  render();
  document.getElementById('content').scrollTop = 0;
  history.replaceState({depth:1}, '');
}

function goBack(){
  if(stack.length > 1){
    stack.pop();
    render();
    document.getElementById('content').scrollTop = 0;
  }
}

window.addEventListener('popstate', (e)=>{
  if(stack.length > 1){
    stack.pop();
    render();
  } else {
    // already at home; allow default (would exit)
  }
});

/* ---------- Init ---------- */
document.addEventListener('DOMContentLoaded', () => {
  stack.push({screen:'home', opts:{}});
  history.replaceState({depth:1}, '');
  render();
});

/* ---------- Rendering ---------- */
function render(){
  const top = stack[stack.length-1];
  const app = document.getElementById('app');
  const isHome = stack.length === 1;

  const topbarHtml = `
    <div class="topbar">
      <div class="tb-inner">
        ${isHome
          ? `<div class="spacer"></div>`
          : `<button class="icon-btn" onclick="goBack()" aria-label="Back">${ICONS.back}</button>`}
        <div class="title-wrap">
          <div class="title">${top.opts.title || 'BCDCA Cricket Rules'}</div>
          ${top.opts.subtitle ? `<div class="subtitle">${top.opts.subtitle}</div>` : ''}
        </div>
        <div class="spacer"></div>
      </div>
    </div>`;

  const bottomHtml = `
    <div class="bottomnav">
      <button class="home-btn ${isHome ? '' : 'dim'}" onclick="goHome()">
        ${ICONS.home}
        <span>Home</span>
      </button>
    </div>`;

  app.innerHTML = `${topbarHtml}<div class="content" id="content"><div class="screen">${renderScreen(top)}</div></div>${bottomHtml}`;
}

function renderScreen(top){
  switch(top.screen){
    case 'home': return renderHome();
    case 'mcc-list': return renderMccList();
    case 'mcc-detail': return renderMccDetail(top.opts.lawNum);
    case 'mcc-sub-detail': return renderMccSubDetail(top.opts.lawNum, top.opts.subNum);
    case 'bcdca-cats': return renderBcdcaCats(top.opts.dataset, top.opts.kind);
    case 'bcdca-items': return renderBcdcaItems(top.opts.dataset, top.opts.catId, top.opts.kind);
    case 'bcdca-detail': return renderBcdcaDetail(top.opts.dataset, top.opts.catId, top.opts.itemIdx, top.opts.kind);
    default: return '';
  }
}

/* ---------- HOME ---------- */
function renderHome(){
  return `
    <div class="home-hero">
      <h1>Blacktown City &amp; District Cricket</h1>
      <p>Browse the official Laws and Competition Rules — organised for quick reference on match day.</p>
    </div>
    <div class="home-grid">
      <div class="home-card" onclick="openMccList()">
        <div class="badge badge-mcc">${ICONS.gavel}</div>
        <div class="body">
          <h3>MCC Laws of Cricket</h3>
          <p>All 42 Laws, 2017 Code — tap a Law for its clauses</p>
        </div>
        <div class="chev">${ICONS.chev}</div>
      </div>
      <div class="home-card" onclick="openBcdcaCats('senior')">
        <div class="badge badge-senior">${ICONS.trophy}</div>
        <div class="body">
          <h3>BCDCA Senior Rules</h3>
          <p>${BCDCA_SENIOR.subtitle} — playing conditions &amp; competition rules</p>
        </div>
        <div class="chev">${ICONS.chev}</div>
      </div>
      <div class="home-card" onclick="openBcdcaCats('junior')">
        <div class="badge badge-junior">${ICONS.seedling}</div>
        <div class="body">
          <h3>BCDCA Junior Rules</h3>
          <p>${BCDCA_JUNIOR.subtitle} — age groups, formats &amp; conduct</p>
        </div>
        <div class="chev">${ICONS.chev}</div>
      </div>
    </div>
    <div class="home-footer-note">Reference only. In case of any discrepancy, the official BCDCA and MCC documents take precedence.</div>
  `;
}

function openMccList(){ pushScreen('mcc-list', {title:'MCC Laws of Cricket', subtitle:'2017 Code, 4th Edition'}); }
function openBcdcaCats(kind){
  const ds = kind === 'senior' ? BCDCA_SENIOR : BCDCA_JUNIOR;
  pushScreen('bcdca-cats', {dataset: kind, kind, title: ds.title, subtitle: ds.subtitle});
}

/* ---------- MCC LIST ---------- */
function renderMccList(){
  const rows = MCC_LAWS.map(l => `
    <div class="row law" onclick="openMccDetail(${l.num})">
      <div class="num">${l.num}</div>
      <div class="rowsub">
        <span class="rt">${escapeHtml(l.title)}</span>
        <span class="rs">${l.subs.length} clause${l.subs.length===1?'':'s'}</span>
      </div>
      <div class="chev">${ICONS.chev}</div>
    </div>`).join('');
  return `
    <div class="section-lead">
      <h2>The 42 Laws</h2>
      <p>Tap any Law to see its numbered clauses.</p>
    </div>
    <div class="list">${rows}</div>
  `;
}

function openMccDetail(num){
  pushScreen('mcc-detail', {lawNum: num, title: `Law ${num}`, subtitle: 'MCC Laws of Cricket'});
}

function renderMccDetail(num){
  const law = MCC_LAWS.find(l => l.num === num);
  if(!law) return '<div class="no-results">Law not found.</div>';
  const subs = law.subs.map(s => `
    <div class="sublaw-item clickable" onclick="openMccSubDetail(${law.num}, '${s.num}')">
      <div class="snum">${s.num}</div>
      <div class="stitle">${escapeHtml(s.title)}</div>
      <div class="chev">${ICONS.chev}</div>
    </div>`).join('');
  return `
    <div class="detail-card">
      <div class="eyebrow">Law ${law.num}</div>
      <h2>${escapeHtml(law.title)}</h2>
      <div class="body-text">Tap a clause below to read its full text.</div>
      <div class="sublaw-list">${subs}</div>
    </div>
  `;
}

function openMccSubDetail(lawNum, subNum){
  pushScreen('mcc-sub-detail', {lawNum, subNum, title: `Law ${subNum}`, subtitle: 'MCC Laws of Cricket'});
}

function renderMccSubDetail(lawNum, subNum){
  const law = MCC_LAWS.find(l => l.num === lawNum);
  if(!law) return '<div class="no-results">Law not found.</div>';
  const sub = law.subs.find(s => s.num === subNum);
  if(!sub) return '<div class="no-results">Clause not found.</div>';
  return `
    <div class="detail-card">
      <div class="eyebrow">Law ${law.num} — ${escapeHtml(law.title)}</div>
      <h2>${escapeHtml(sub.num)} &nbsp;${escapeHtml(sub.title)}</h2>
      <div class="body-text">${escapeHtml(sub.body || '')}</div>
    </div>
  `;
}

/* ---------- BCDCA CATEGORY LIST ---------- */
function renderBcdcaCats(kind){
  const ds = kind === 'senior' ? BCDCA_SENIOR : BCDCA_JUNIOR;
  const rowClass = kind === 'senior' ? 'senior-row' : 'junior-row';
  const rows = ds.categories.map((c,idx) => `
    <div class="row ${rowClass}" onclick="openBcdcaItems('${kind}','${c.id}')">
      <div class="num">${idx+1}</div>
      <div class="rowsub">
        <span class="rt">${escapeHtml(c.title)}</span>
        <span class="rs">${c.items.length} item${c.items.length===1?'':'s'}</span>
      </div>
      <div class="chev">${ICONS.chev}</div>
    </div>`).join('');
  return `
    <div class="section-lead">
      <h2>${escapeHtml(ds.title)}</h2>
      <p>${escapeHtml(ds.subtitle)} — choose a section below.</p>
    </div>
    <div class="list">${rows}</div>
  `;
}

function openBcdcaItems(kind, catId){
  const ds = kind === 'senior' ? BCDCA_SENIOR : BCDCA_JUNIOR;
  const cat = ds.categories.find(c=>c.id===catId);
  pushScreen('bcdca-items', {dataset: kind, catId, kind, title: cat.short || cat.title, subtitle: ds.title});
}

/* ---------- BCDCA ITEM LIST ---------- */
function renderBcdcaItems(kind, catId){
  const ds = kind === 'senior' ? BCDCA_SENIOR : BCDCA_JUNIOR;
  const cat = ds.categories.find(c=>c.id===catId);
  const rowClass = kind === 'senior' ? 'senior-row' : 'junior-row';
  const rows = cat.items.map((it, idx) => `
    <div class="row ${rowClass}" onclick="openBcdcaDetail('${kind}','${catId}',${idx})">
      <div class="num">${escapeHtml(String(it.num))}</div>
      <div class="rowtitle">${escapeHtml(it.title)}</div>
      <div class="chev">${ICONS.chev}</div>
    </div>`).join('');
  return `
    <div class="section-lead">
      <h2>${escapeHtml(cat.title)}</h2>
      <p>Tap a rule to read the full detail.</p>
    </div>
    <div class="list">${rows}</div>
  `;
}

function isNumericRef(num){ return /\d/.test(String(num)); }

function openBcdcaDetail(kind, catId, idx){
  const ds = kind === 'senior' ? BCDCA_SENIOR : BCDCA_JUNIOR;
  const cat = ds.categories.find(c=>c.id===catId);
  const item = cat.items[idx];
  const topTitle = isNumericRef(item.num) ? `Rule ${item.num}` : item.title;
  pushScreen('bcdca-detail', {dataset: kind, catId, itemIdx: idx, kind, title: topTitle, subtitle: cat.short || cat.title});
}

function renderBcdcaDetail(kind, catId, idx){
  const ds = kind === 'senior' ? BCDCA_SENIOR : BCDCA_JUNIOR;
  const cat = ds.categories.find(c=>c.id===catId);
  const item = cat.items[idx];
  const heading = isNumericRef(item.num)
    ? `${escapeHtml(String(item.num))} &nbsp;${escapeHtml(item.title)}`
    : `${escapeHtml(item.title)}`;
  return `
    <div class="detail-card">
      <div class="eyebrow">${escapeHtml(cat.short || cat.title)}</div>
      <h2>${heading}</h2>
      <div class="body-text">${escapeHtml(item.body)}</div>
    </div>
  `;
}

/* ---------- Utils ---------- */
function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');
}
