hes the highest point of their normal bowling action in the delivery swing, once the bowler has reached that point it is no longer possible for the bowler to run out the non-striker under this Law.\n\n38.3.2 If the ball is not delivered, if there is an appeal, the umpire shall make their decision on the Run out. if there is no appeal, or if the decision is not out, the umpire shall call and signal Dead ball as soon as possible. the ball shall not count as one in the over.\n\n38.3.3 If the ball is delivered and there is an appeal, the umpire shall make their decision on the Run out. if the non-striker is not dismissed, the ball remains in play and Law 21.6 (Bowler breaking wicket in delivering ball) shall apply. if the non-striker is dismissed, the ball shall not count as one in the over."}, {"num": "38.4", "title": "Which batter is out", "body": "The batter out in the circumstances of 38.1 is the one whose ground is at the end where the wicket is fairly broken. See Laws 25.6 (Dismissal and conduct of a batter and their runner) and 30.2 (Which is a batter\u2019s ground)."}, {"num": "38.5", "title": "Runs scored", "body": "If either batter is dismissed Run out, the run in progress when the wicket is broken shall not be scored, but any runs completed by the batters shall stand, together with any runs for penalties awarded to either side. See Laws 18.6 (Runs awarded for penalties) and 18.8 (Runs scored when a batter is dismissed). If, however, when a striker has a runner, the striker is dismissed Run out and runs are completed by the runner and the other batter before the wicket is broken, the umpire shall: Disallow all runs to the batting side Return any not out batter to their original end Signal No ball or Wide ball to the scorers if applicable Award any 5-run Penalty that is applicable. See Law 25.6 (Dismissal and conduct of a batter and their runner)."}, {"num": "38.6", "title": "Bowler does not get credit", "body": "The bowler does not get credit for the wicket."}]}, {"num": 39, "title": "Stumped", "subs": [{"num": "39.1", "title": "Out Stumped", "body": "39.1.1 The striker is out Stumped, except as in 39.3, if a ball which is delivered is not called No ball and the striker is out of their ground, other than as in 39.3.1 and the striker has not attempted a run when the striker\u2019s wicket is fairly broken by the wicket- keeper without the intervention of another fielder. Note, however Laws 25.6.2 and 25.6.5 (Dismissal and conduct of a batter and their runner) and 27.3 (Position of wicket-keeper).\n\n39.1.2 The striker is out Stumped if all the conditions of 39.1.1 are satisfied, even though a decision of Run out would be justified."}, {"num": "39.2", "title": "Ball rebounding from wicket-keeper\u2019s person", "body": "If the wicket is broken by the ball, it shall be regarded as having been broken by the wicket-keeper if the ball: rebounds on to the stumps from any part of the wicket-keeper\u2019s person or equipment or has been kicked or thrown on to the stumps by the wicket-keeper."}, {"num": "39.3", "title": "Not out Stumped", "body": "39.3.1 The striker will not be out Stumped if, after having received the delivery, they have left their ground in order to avoid injury.\n\n39.3.2 If the striker is not out Stumped they may, except in the circumstances of Law 38.2.2.2 (Batter not out Run out), be out Run out if the conditions of Law 38.1 (Out Run out) apply."}, {"num": "39.4", "title": "Runs Scored", "body": "When a striker is dismissed Stumped from a Wide ball, the one-run penalty shall stand. Note Laws 12.9 (Conclusion of match), 16.6 (Winning hit or extras) and 22.2 (Call and signal of Wide ball) mean that if the penalty for a Wide concludes the match, then a stumping is not possible, but the one-run penalty for the Wide remains."}]}, {"num": 40, "title": "Timed out", "subs": [{"num": "40.1", "title": "Out Timed out", "body": "40.1.1 After the fall of a wicket or the retirement of a batter, the incoming batter must, unless Time has been called, be ready to receive the ball, or for the other batter to be ready to receive the next ball within 3 minutes of the dismissal or retirement. If this requirement is not met, the incoming batter will be out, Timed out.\n\n40.1.2 In the event of an extended delay in which no batter comes to the wicket, the umpires shall adopt the procedure of Law 16.3 (Umpires awarding a match). For the purposes of that Law the start of the action shall be taken as the expiry of the 3 minutes referred to above."}, {"num": "40.2", "title": "Bowler does not get credit", "body": "The bowler does not get credit for the wicket."}]}, {"num": 41, "title": "Unfair play", "subs": [{"num": "41.1", "title": "Fair and unfair play \u2013 responsibility of captains", "body": "The captains are responsible for ensuring that play is conducted within The Spirit of Cricket, as described in The Preamble \u2013 The Spirit of Cricket, as well as within the Laws."}, {"num": "41.2", "title": "Unfair actions", "body": "41.2.1 The umpires shall be the sole judges of fair and unfair play. If an umpire considers that any action by a player, not covered in the Laws, is unfair, that umpire shall call and signal Dead ball, if appropriate, as soon as it becomes clear that the call will not disadvantage the non-offending side, and report the matter to the other umpire.\n\n41.2.1.1 I fthis is a first offence by that side, the bowler\u2019s end umpire shall then summon the offending player\u2019s captain and issue a first and final warning which shall apply to all members of the team for the remainder of the match. warn the offending player\u2019s captain that any further such offence by any member of their team shall result in the award of 5 Penalty runs to the opposing team.\n\n41.2.1.2 I fthis is a second or subsequent offence by that side, the bowler\u2019s end umpire shall then summon the offending player\u2019s captain and inform them that there has been a further such offence. award 5 Penalty runs to the opposing side 41.2.1.3 The umpires together shall report the incident as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.3", "title": "The match ball \u2013 changing its condition", "body": "41.3.1 The umpires shall make frequent and irregular inspections of the ball. In addition, they shall immediately inspect the ball if they suspect anyone of attempting to change the condition of the ball, except as permitted in 41.3.2.\n\n41.3.2 It is an offence for any player to take any action which changes the condition of the ball. Except in carrying out the normal duties of a batter, a batter is not allowed to wilfully damage the ball. See also Law 5.5 (Damage to the ball). A fielder may, however\n\n41.3.2.1 polish the ball on their clothing provided that no artificial substance is used, that the only natural substance used is sweat, and that such polishing wastes no time.\n\n41.3.2.2 remove mud from the ball under the supervision of an umpire.\n\n41.3.2.3 dry a wet ball on a piece of cloth that has been approved by the umpires.\n\n41.3.3 The umpires shall consider the condition of the ball to have been unfairly changed if any action by any player does not comply with the conditions in 41.3.2.\n\n41.3.4 If the umpires consider that the condition of the ball has been unfairly changed by a member or members of either side, they shall ask the captain of the opposing side if they would like the ball to be replaced. If necessary, in the case of the batting side, the batters at the wicket may deputise for their captain.\n\n41.3.4.1 I f a replacement ball is requested, the umpires shall select and bring into use immediately, a ball which shall have wear comparable to that of the previous ball immediately prior to the contravention.\n\n41.3.4.2 Regardless of whether a replacement ball has been chosen to be used, the bowler\u2019s end umpire shall award 5 Penalty runs to the opposing side. if appropriate, inform the batters at the wicket and the captain of the fielding side that the ball has been changed and the reason for their action. inform the captain of the batting side as soon as practicable of what has occurred. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team.\n\n41.3.5 If the umpires agree that in the match there has been any further instance by that team of unfairly changing the condition of the ball, they shall\n\n41.3.5.1 repeat the procedure in 41.3.4.1 and 41.3.4.2.\n\nI fthe further offence is committed by the fielding side, additionally the bowler\u2019s end umpire shall\n\n41.3.5.2 direct the captain of the fielding side to suspend immediately from bowling the bowler who delivered the preceding ball; that bowler shall not be allowed to bowl again in the match. inform the batters at the wicket and, as soon as practicable, the captain of the batting side of the reason for the action. if necessary, the over shall be completed by another bowler, who shall neither have bowled any part of the previous over, nor be allowed to bowl any part of the next over."}, {"num": "41.4", "title": "Deliberate attempt to distract or obstruct striker", "body": "41.4.1 It is unfair for any fielder deliberately to attempt to distract or obstruct the striker while the striker is preparing to receive or receiving a delivery.\n\n41.4.2 If either umpire considers that any action by a fielder is such an attempt, that umpire shall immediately call and signal Dead ball and inform the other umpire of the reason for the call. The bowler\u2019s end umpire shall award 5 Penalty runs to the batting side. inform the captain of the fielding side, the batters and, as soon as practicable, the captain of the batting side of the reason for the action. Neither batter shall be dismissed from that delivery and the ball shall not count as one of the over. However, if either umpire had reason to call and signal No ball, this call shall stand regardless of the attempt to distract or obstruct the striker.\n\nTogether with the other umpire report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.5", "title": "Deliberate distraction, deception or obstruction of batter", "body": "41.5.1 In addition to 41.4, it is unfair for any fielder wilfully to attempt, by word or action, to distract, deceive or obstruct either batter after the striker has received the ball.\n\n41.5.2 It is for either one of the umpires to decide whether any distraction, deception or obstruction is wilful or not.\n\n41.5.3 If either umpire considers that a fielder has caused or attempted to cause such a distraction, deception or obstruction, that umpire shall immediately call and signal Dead ball and inform the other umpire of the reason for the call.\n\n41.5.4 Neither batter shall be dismissed from that delivery.\n\n41.5.5 If an obstruction involves physical contact, the umpires together shall decide whether or not an offence under Law 42 (Players\u2019 conduct) has been committed.\n\n41.5.5.1 I fan offence under Law 42 (Players\u2019 conduct) has been committed, they shall apply the relevant procedures in Law 42 and shall also apply each of\n\n41.5.7 to 41.5.9.\n\n41.5.5.2 I fthey consider that there has been no offence under Law 42 (Players\u2019 conduct), they shall apply each of 41.5.6 to 41.5.10.\n\n41.5.6 The bowler\u2019s end umpire shall signal No ball or Wide to the scorers, if applicable, award 5 Penalty runs to the batting side, inform the captain of the fielding side of the reason for this action and as soon as practicable inform the captain of the batting side.\n\n41.5.7 The ball shall not count as one of the over.\n\n41.5.8 Any runs completed by the batters before the offence shall be scored, together with any runs for penalties awarded to either side. Additionally, the run in progress shall be scored whether or not the batters had already crossed at the instant of the offence.\n\n41.5.9 The batters at the wicket shall decide which of them is to face the next delivery. See Law 18.13.\n\n41.5.10 The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.6", "title": "Bowling of dangerous and unfair short deliveries", "body": "41.6.1 The bowling of short deliveries is dangerous if the bowler\u2019s end umpire considers that, taking into consideration the skill of the striker, by their speed, length, height and direction they are likely to inflict physical injury on the striker. The fact that the striker is wearing protective equipment shall be disregarded.\n\n41.6.2 The bowler\u2019s end umpire may consider that the bowling of short deliveries, although not dangerous under 41.6.1, is unfair if they repeatedly pass above head height of the striker standing upright at the crease. See also Law 22.1.3 (Ball bouncing over head height of striker).\n\n41.6.3 As soon as the umpire decides that the bowling of short deliveries has become dangerous under 41.6.1, or unfair under 41.6.2, that umpire shall call and signal No ball. When the ball is dead, the umpire shall caution the bowler, indicating that this is a first and final warning, and inform the other umpire, the captain of the fielding side and the batters of what has occurred. This caution shall apply to that bowler throughout the innings.\n\n41.6.4 Should there be any further such delivery by the same bowler in that innings, the umpire shall call and signal No ball when the ball is dead, direct the captain of the fielding side to suspend the bowler immediately from bowling inform the other umpire for the reason for this action. The suspended bowler shall not be allowed to bowl again in that innings. If applicable, the over shall be completed by another bowler, who shall neither have bowled any part of the previous over, nor be allowed to bowl any part of the next over. The umpire shall inform the batters and, as soon as practicable, the captain of the batting side. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team.\n\n41.6.5 The warning sequence in 41.6.3 and 41.6.4 is independent of the warning and action sequence in 41.7."}, {"num": "41.7", "title": "Bowling of dangerous and unfair non-landing deliveries", "body": "41.7.1 Any delivery, which passes or would have passed, without landing, above waist height of the striker standing upright at the popping crease, is unfair. Whenever such a delivery is bowled, the umpire shall call and signal No ball.\n\n41.7.2 The bowling of a delivery as defined in 41.7.1 is also dangerous if the bowler\u2019s end umpire considers that there is a risk of injury to the striker. In making that judgement the umpire shall: disregard any protective equipment worn by the striker be mindful of: the speed, height and direction of the delivery the skill of the striker the repeated nature of such deliveries.\n\n41.7.3 If the umpire considers a non-landing delivery, or a series of non-landing deliveries, to be dangerous under 41.7.2, when the ball is dead, the umpire shall repeat the No ball signal to the scorers and then caution the bowler, indicating that this is a first and final warning. The umpire shall also inform the other umpire, the captain of the fielding side and the batters of what has occurred. This caution shall apply to that bowler throughout the innings.\n\n41.7.4 Should there be any further dangerous such delivery by the same bowler in that innings, the umpire shall call and signal No ball when the ball is dead, direct the captain of the fielding side to suspend the bowler immediately from bowling inform the other umpire for the reason for this action. The suspended bowler shall not be allowed to bowl again in that innings. If applicable, the over shall be completed by another bowler, who shall neither have bowled any part of the previous over, nor be allowed to bowl any part of the next over. Additionally, the umpire shall inform the batters and, as soon as practicable, the captain of the batting side. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team.\n\n41.7.5 The warning and action sequences in 41.7.3 and 41.7.4 are independent of those in 41.6.\n\n41.7.6 If the umpire considers that a bowler deliberately bowled a non-landing delivery, deemed to be unfair as defined in 41.7.1, then the caution and warning in 41.7.3 shall be dispensed with. The umpire shall immediately call and signal No ball. when the ball is dead, direct the captain of the fielding side to suspend the bowler immediately from bowling and inform the other umpire for the reason for this action. The suspended bowler shall not be allowed to bowl again in the match.\n\nIf applicable, the over shall be completed by another bowler, who shall neither have bowled any part of the previous over, nor be allowed to bowl any part of the next over. inform the batters and, as soon as practicable, the captain of the batting side. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.8", "title": "Bowling of deliberate front-foot No ball", "body": "If the umpire considers that the bowler has delivered a deliberate front-foot No ball, that umpire shall immediately call and signal No ball. when the ball is dead, direct the captain of the fielding side to suspend the bowler immediately from bowling inform the other umpire for the reason for this action. The suspended bowler shall not be allowed to bowl again in the match. If applicable, the over shall be completed by another bowler, who shall neither have bowled any part of the previous over, nor be allowed to bowl any part of the next over. inform the batters and, as soon as practicable, the captain of the batting side. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.9", "title": "Time wasting by the fielding side", "body": "41.9.1 It is unfair for any fielder to waste time.\n\n41.9.2 If either umpire considers that the progress of an over is unnecessarily slow, or time is being wasted in any other way, by the captain of the fielding side or by any other fielder, at the first instance the umpire concerned shall if the ball is in play, call and signal Dead ball. inform the other umpire of what has occurred. The bowler\u2019s end umpire shall then warn the captain of the fielding side, indicating that this is a first and final warning. inform the batters of what has occurred.\n\n41.9.3 If either umpire considers that there is any further waste of time in that innings by any fielder, the umpire concerned shall if the ball is in play, call and signal Dead ball. inform the other umpire of what has occurred. The bowler\u2019s end umpire shall then either i fthe waste of time is not during an over, award 5 Penalty runs to the batting side and inform the captain of the fielding side of the reason for this action or i fthe waste of time is during the course of an over, direct the captain of the fielding side to suspend the bowler immediately from bowling. The suspended bowler shall not be allowed to bowl again in that innings.\n\nIf applicable, the over shall be completed by another bowler, who shall neither have bowled any part of the previous over, nor be allowed to bowl any part of the next over. Additionally the umpire shall inform the batters and, as soon as is practicable, the captain of the batting side of what has occurred. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.10", "title": "Batter wasting time", "body": "41.10.1 It is unfair for a batter to waste time. In normal circumstances, the striker should always be ready to take strike when the bowler is ready to start their run-up.\n\n41.10.2 Should either batter waste time by failing to meet this requirement, or in any other way, the following procedure shall be adopted. At the first instance, either before the bowler starts their run-up or when the ball becomes dead, as appropriate, the umpire shall warn both batters and indicate that this is a first and final warning. This warning shall apply throughout the innings. The umpire shall so inform each incoming batter. inform the other umpire of what has occurred. inform the captain of the fielding side and, as soon as practicable, the captain of the batting side of what has occurred.\n\n41.10.3 If there is any further time wasting by any batter in that innings, the umpire shall, at the appropriate time while the ball is dead award 5 Penalty runs to the fielding side. inform the other umpire of the reason for this action. inform the other batter, the captain of the fielding side and, as soon as practicable, the captain of the batting side of what has occurred. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.11", "title": "The protected area", "body": "The protected area is defined as that area of the pitch contained within a rectangle bounded at each end by imaginary lines parallel to the popping creases and 5 ft/1.52 m in front of each, and on the sides by imaginary lines, one each side of the imaginary line joining the centres of the two middle stumps, each parallel to it and 1 ft/30.48 cm from it."}, {"num": "41.12", "title": "Fielder damaging the pitch", "body": "41.12.1 It is unfair to cause deliberate or avoidable damage to the pitch. A fielder will be deemed to be causing avoidable damage if either umpire considers that the fielder\u2019s presence on the pitch is without reasonable cause.\n\n41.12.2 If a fielder causes deliberate or avoidable damage to the pitch, other than as in 41.13.1, at the first instance either umpire shall, when the ball is dead, inform the other umpire. The bowler\u2019s end umpire shall then caution the captain of the fielding side and indicate that this is a first and final warning. This warning shall apply throughout the innings. inform the batters of what has occurred.\n\n41.12.3 If, in that innings, there is any further instance of deliberate or avoidable damage to the pitch, by any fielder, either umpire seeing the contravention shall, when the ball is dead, inform the other umpire. The bowler\u2019s end umpire shall then signal No ball or Wide to the scorers, if applicable. award 5 Penalty runs to the batting side. award any other 5-run Penalty that is applicable. inform the fielding captain of the reason for this action. inform the batters and, as soon as practicable, the captain of the batting side of what has occurred. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.13", "title": "Bowler running on protected area", "body": "41.13.1 It is unfair for a bowler to enter the protected area in their follow-through without reasonable cause, whether or not the ball is delivered.\n\n41.13.2 If a bowler contravenes this Law, at the first instance and when the ball is dead, the umpire shall caution the bowler and inform the other umpire of what has occurred. This caution shall apply to that bowler throughout the innings. inform the captain of the fielding side and the batters of what has occurred.\n\n41.13.3 If, in that innings, the same bowler again contravenes this Law, the umpire shall repeat the above procedure indicating that this is a final warning. This warning shall also apply throughout the innings.\n\n41.13.4 If, in that innings, the same bowler contravenes this Law a third time, when the ball is dead, the umpire shall, direct the captain of the fielding side to suspend the bowler immediately from bowling. If applicable, the over shall be completed by another bowler, who shall neither have bowled any part of the previous over, nor be allowed to bowl any part of the next over. The suspended bowler shall not be allowed to bowl again in that innings. inform the other umpire of the reason for this action. inform the batters and, as soon as practicable, the captain of the batting side of what has occurred. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.14", "title": "Batter damaging the pitch", "body": "41.14.1 It is unfair to cause deliberate or avoidable damage to the pitch. If the striker enters the protected area in playing or playing at the ball, the striker must move from it immediately thereafter. A batter will be deemed to be causing avoidable damage if either umpire considers that their presence on the pitch is without reasonable cause.\n\n41.14.2 If either batter causes deliberate or avoidable damage to the pitch, other than as in 41.15, at the first instance the umpire seeing the contravention shall, when the ball is dead, inform the other umpire of the occurrence. The bowler\u2019s end umpire shall then warn both batters that the practice is unfair and indicate that this is a first and final warning. This warning shall apply throughout the innings. The umpire shall so inform each incoming batter. inform the captain of the fielding side and, as soon as practicable, the captain of the batting side of what has occurred.\n\n41.14.3 If there is any further instance of deliberate or avoidable damage to the pitch by any batter in that innings, the umpire seeing the contravention shall, when the ball is dead, inform the other umpire of the occurrence. The bowler\u2019s end umpire shall disallow all runs to the batting side return any not out batter to their original end signal No ball or Wide to the scorers if applicable. award 5 Penalty runs to the fielding side. award any other 5-run Penalty that is applicable except for Penalty runs under Law 28.3 (Protective helmets belonging to the fielding side). inform the captain of the fielding side and, as soon as practicable, the captain of the batting side of the reason for this action.\n\nThe umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.15", "title": "Striker in protected area", "body": "41.15.1 The striker shall not adopt a batting position in the protected area or so close to it that frequent encroachment is inevitable. The striker may make a mark on the pitch, for the purpose of indicating their batting position, provided that no mark is unreasonably close to the protected area.\n\n41.15.2 If there is breach of any of the conditions in 41.15.1 by the striker, if the bowler has not entered their delivery stride, either umpire shall immediately call and signal Dead ball, otherwise, that umpire shall wait until the ball is dead and then inform the other umpire of the occurrence. The bowler\u2019s end umpire shall then warn the striker that the practice is unfair and indicate that this is a first and final warning. This warning shall apply throughout the innings. The umpire shall so inform the non-striker and each incoming batter. inform the captain of the fielding side and, as soon as practicable, the captain of the batting side of what has occurred.\n\n41.15.3 If there is any further breach of any of the conditions in\n\n41.15.1 by any batter in that innings, the umpire seeing the contravention shall, if the bowler has not entered their delivery stride, immediately call and signal Dead ball, otherwise, that umpire shall wait until the ball is dead and then inform the other umpire of the occurrence. The bowler\u2019s end umpire shall then disallow all runs to the batting side return any not out batter to their original end signal No ball or Wide to the scorers if applicable. award 5 Penalty runs to the fielding side. award any other 5-run Penalty that is applicable except for Penalty runs under Law 28.3 (Protective helmets belonging to the fielding side). inform the captain of the fielding side and, as soon as practicable, the captain of the batting side of the reason for this action. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.16", "title": "Batters stealing a run", "body": "It is unfair for the batters to attempt to steal a run during the bowler\u2019s run-up. Unless the bowler attempts to run out the non-striker \u2013 see Law 38.3 (Non-striker leaving their ground early) \u2013 either umpire shall call and signal Dead ball as soon as the batters cross in such an attempt. inform the other umpire of the reason for this action.\n\nThe bowler\u2019s end umpire shall then disallow the attempted run. return the batters to their original ends. award 5 Penalty runs to the fielding side. award any other 5-run Penalty that is applicable. inform the batters, the captain of the fielding side and, as soon as practicable, the captain of the batting side, of the reason for this action. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "41.17", "title": "Penalty runs", "body": "41.17.1 When Penalty runs are awarded to either side, when the ball is dead the umpire shall signal the Penalty runs to the scorers. See Law 2.13 (Signals).\n\n41.17.2 Penalty runs shall be awarded in each case where the Laws require the award, up until the umpires leave the field at the end of the match, even if a result has already been achieved. See Law 16.6 (Winning hit or extras). Note that if the award of Penalty runs means that a result has no longer been achieved, the match continues. Where more than one award of Penalty runs is required during the same delivery, the umpires shall award them in the order that the offences took place. Note, however, that the restrictions on awarding Penalty runs, in Laws 23.3 (Leg byes not to be awarded), 25.7 (Restriction on the striker\u2019s runner), 28.3 (Protective helmets belonging to the fielding side) and 34.4 (Runs permitted from ball lawfully struck more than once) will apply.\n\n41.17.3 When 5 Penalty runs are awarded to the batting side, they shall be scored as Penalty extras and shall be in addition to any other penalties. they are awarded when the ball is dead and shall not be regarded as runs scored from either the immediately preceding delivery or the immediately following delivery, and shall be in addition to any runs from those deliveries. the batters shall not change ends solely by reason of the 5-run Penalty.\n\n41.17.4 When 5 Penalty runs are awarded to the fielding side, they shall be added as Penalty extras to that side\u2019s total of runs in its most recently completed innings. If the fielding side has not completed an innings, the 5 Penalty runs shall be added to the score in its next innings.\n\n41.17.5 When Penalty runs are awarded, except under Law 28.3 (Protective helmets belonging to the fielding side), the umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team.\n\n41.17.6 Whether Penalty runs are awarded or not, if either umpire deems that any item of equipment used by any player is unfair or illegal, the umpires shall:\n\nif practicable, prevent the player from using the illegal or unfair equipment report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}]}, {"num": 42, "title": "Players' conduct", "subs": [{"num": "42.1", "title": "Unacceptable conduct", "body": "42.1.1 The umpires shall act upon any unacceptable conduct. Four Levels of offence and the corresponding actions by the umpires are identified as Level 1, Level 2, Level 3 and Level 4 offences in 42.2 to 42.5.\n\n42.1.2 If either umpire considers that the conduct of a player, at any time during the match, is unacceptable, the umpire concerned shall call and signal Dead ball. This call may be delayed until the umpire is satisfied that it will not disadvantage the non-offending side.\n\n42.1.3 The umpire concerned shall report the matter to the other umpire and together they shall decide whether misconduct has occurred. If so, they shall determine into which of the Levels the conduct falls, as set out in 42.2 to 42.5 below, and then apply the related sanctions.\n\n42.1.4 Any call of No ball or Wide before the offence shall stand.\n\n42.1.5 For each Level 1 to 4, if the offence is by a batter, the umpires shall summon the offending player\u2019s captain to the field. Solely for the purpose of this Law, the batters at the wicket may not deputise for their captain.\n\n42.1.6 For each Level 1 to 4, playing time shall be counted as lost from the call of Time to the call of Play, excluding intervals (Law 11) and suspensions of play (Law 2.8). the time for close of play on that day shall be extended by this length of time. if applicable, no overs shall be deducted during the Last hour of the match solely on account of this time."}, {"num": "42.2", "title": "Level 1 offences and action by umpires", "body": "42.2.1 Any of the following actions by a player shall constitute a Level 1 offence: wilfully mistreating any part of the cricket ground, equipment or implements used in the match showing dissent at an umpire\u2019s decision by word or action using language that, in the circumstances, is obscene, offensive or insulting making an obscene gesture appealing excessively advancing towards an umpire in an aggressive manner when appealing any other misconduct, the nature of which is, in the opinion of the umpires, equivalent to a Level 1 offence.\n\n42.2.2 I fsuch an offence is committed, 42.2.2.1 to 42.2.2.6 shall be implemented as appropriate, according to whether or not it is the first offence at any Level.\n\n42.2.2.1 The umpire shall call Time, if necessary.\n\n42.2.2.2 Together the umpires shall summon and inform the offending player\u2019s captain that an offence at this Level has occurred.\n\n42.2.2.3 If the Level 1 offence is the first offence, at any Level, by that team, the umpire shall 42.2.2.3.1 i ssue a first and final warning which shall apply to all members of the team for the remainder of the match. 42.2.2.3.2 warn the offending player\u2019s captain that any further Level 1 offence by any member of their team shall result in the award of 5 Penalty runs to the opposing team.\n\n42.2.2.4 I fthe Level 1 offence follows an offence, at any Level, by that team, the umpire shall award 5 Penalty runs to the opposing team.\n\n42.2.2.5 A ssoon as practicable the umpire shall call Play.\n\n42.2.2.6 The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending player\u2019s team and to any Governing Body responsible for the match, who shall take such further action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "42.3", "title": "Level 2 offences and action by umpires", "body": "42.3.1 Any of the following actions by a player shall constitute a Level 2 offence: showing serious dissent at an umpire\u2019s decision by word or action making inappropriate and deliberate physical contact with another player throwing the ball at or near a player, umpire or another person in an inappropriate and dangerous manner using language or gesture to another player, umpire, team official or spectator that, in the circumstances, is obscene or of a seriously insulting nature or any other misconduct, the nature of which is, in the opinion of the umpires, equivalent to a Level 2 offence.\n\n42.3.2 If such an offence is committed, 42.3.2.1 to 42.3.2.6 shall be implemented.\n\n42.3.2.1 The umpire shall call Time, if necessary.\n\n42.3.2.2 Together the umpires shall summon and inform the offending player\u2019s captain that an offence at this Level has occurred.\n\n42.3.2.3 The umpire shall award 5 Penalty runs to the opposing team.\n\n42.3.2.4 The umpire shall warn the offending player\u2019s captain that any future Level 1 offence by any member of their team shall result in the award of 5 Penalty runs to the opposing team.\n\n42.3.2.5 A ssoon as practicable the Umpire shall call Play.\n\n42.3.2.6 The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending player\u2019s team and to any Governing Body responsible for the match, who shall take such further action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "42.4", "title": "Level 3 offences and action by umpires", "body": "42.4.1 Either of the following actions by a player shall constitute a Level 3 offence:\n\nintimidating an umpire by language or gesture threatening to assault a player or any other person except an umpire. See 42.5.1.\n\n42.4.2 If such an offence is committed, 42.4.2.1 to 42.4.2.5 shall be implemented.\n\n42.4.2.1 The umpire shall call Time, if necessary.\n\n42.4.2.2 Together the umpires shall summon and inform the offending player\u2019s captain that an offence at this Level has occurred.\n\n42.4.2.3 The umpires shall direct the captain to remove the offending player immediately from the field of play for a period in accordance with the following: 42.4.2.3.1 In a match where the innings are not limited to a number of overs, the player shall be suspended from the field of play for 10 overs. Any balls remaining in the over in progress at the time of suspension shall not count towards the overs for which the player is suspended. 42.4.2.3.2 I n a match where the innings are limited to a number of overs, the player shall be suspended for one fifth of the number of overs allocated to the current innings at its commencement. If, in calculating the length of the suspension, a part-over results, it shall be considered as a whole over. Any balls remaining in the over in progress at the time of suspension shall not count towards the overs for which the player is suspended.\n\n42.4.2.3.3 If the offending player is a fielder, no substitute shall be allowed for that fielder. The offending player may return to the field of play after serving the period of suspension. Penalty time can neither accrue, nor be served, while a player is suspended. 42.4.2.3.4 If a bowler is suspended mid-over, then that over must be completed by a different bowler, who shall not have bowled the previous over nor shall they bowl the next over. 42.4.2.3.5 If the offending player is a member of the batting side, who has not been dismissed, that player may bat or return to bat after having served the suspension, only at the fall of a wicket. If the offending player is suspended while batting, they shall be replaced by another member of their team. If no batter is available to bat during a batter\u2019s suspension, the innings is completed. If the offending player was suspended while batting and does not continue their innings for whatever reason, that batter is to be recorded as \u2018Retired \u2013 not out\u2019. 42.4.2.3.6 If the offending player is a dismissed member of the batting side, the period of suspension will not commence until the start of the next innings. Furthermore, in these circumstances, the offending player may not act as a runner during the innings in which they were suspended. 42.4.2.3.7 Warn the offending player\u2019s captain that any future Level 1 offence shall result in the award of 5 Penalty runs to the opposing team. 42.4.2.3.8 Any overs remaining to be served from a suspension shall be carried forward to the next and subsequent innings of the match. A part over at the end of the innings shall not count towards the overs for which the player is suspended.\n\n42.4.2.4 A ssoon as practicable, the umpire shall signal the Level 3 offence to the scorers award 5 Penalty runs to the opposing team call Play.\n\n42.4.2.5 The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending player\u2019s team and to any Governing Body responsible for the match, who shall take such further action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "42.5", "title": "Level 4 offences and action by umpires", "body": "42.5.1 Any of the following actions by a player shall constitute a Level 4 offence: threatening to assault an umpire making inappropriate and deliberate physical contact with an umpire physically assaulting a player or any other person committing any other act of violence.\n\n42.5.2 If such an offence is committed, 42.5.2.1 to 42.5.2.5 shall be implemented.\n\n42.5.2.1 The umpire shall call Time, if necessary.\n\n42.5.2.2 Together the umpires shall summon and inform the offending player\u2019s captain that an offence at this Level has occurred.\n\n42.5.2.3 The umpires shall direct the captain to remove the offending player immediately from the field of play for the remainder of the match and shall apply the following: 42.5.2.3.1 If the offending player is a fielder, no substitute shall be allowed for that fielder. The offending player to be recorded as \u2018Retired \u2013 out\u2019 at the commencement of any subsequent innings in which their team is the batting side. 42.5.2.3.2 I f a bowler is suspended mid-over, then that over must be completed by a different bowler, who shall not have bowled the previous over nor shall be permitted to bowl the next over. 42.5.2.3.3 I fthe offending player is a batter they should be recorded as \u2018Retired \u2013 out\u2019 in the current innings, unless previously dismissed under any of Laws 32 to 39, and at the commencement of any subsequent innings in which their team is the batting side. If no further batter is available to bat, the innings is completed.\n\n42.5.2.3.4 Warn the offending player\u2019s captain that any future Level 1 offence shall result in the award of 5 Penalty runs to the opposing team.\n\n42.5.2.4 A ssoon as practicable, the umpire shall signal the Level 4 offence to the scorers award 5 Penalty runs to the opposing team call Play.\n\n42.5.2.5 The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending player\u2019s team and to any Governing Body responsible for the match, who shall take such further action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "42.6", "title": "Captain refusing to remove a player from the field", "body": "42.6.1 If a captain refuses to carry out an instruction under 42.4.2.3 or 42.5.2.3, the umpires shall invoke Law 16.3 (Umpires awarding a match).\n\n42.6.2 If both captains refuse to carry out instructions under\n\n42.4.2.3 or 42.5.2.3 in respect of the same incident, the umpires shall instruct the players to leave the field. The match is not concluded as in Law 12.9 (Conclusion of match) and there shall be no result under Law 16 (The result)."}, {"num": "42.7", "title": "Additional points relating to Level 3 and Level 4 offences", "body": "42.7.1 If a player, while acting as wicket-keeper, commits a Level 3 or Level 4 offence, Law 24.1.2 (Substitute fielders) shall not apply, meaning that only a nominated player may act as wicket-keeper, even if another fielder becomes injured or ill and is replaced by a substitute.\n\n42.7.2 A nominated player who has a substitute or has a runner will suffer a penalty for any Level 3 or Level 4 offence committed by that substitute or by that runner.\n\n42.7.2.1 When the offence is committed by a substitute, the nominated player and substitute will each suffer the penalty defined in 42.4.2.3 or in 42.5.2.3 as appropriate. Only the substitute and captain will be reported as in 42.4.2.5 or 42.5.2.5.\n\n42.7.2.2 When the offence is committed by a runner, the batter who has the runner and the runner will each suffer the penalty defined in 42.4.2.3 or in\n\n42.5.2.3 as appropriate. The penalty for a Level 4 offence (see 42.5.2.3) will apply to the runner for the remainder of the match, but in only the current innings to the batter for whom the runner acted. Only the runner and captain will be reported as in 42.4.2.5 or 42.5.2.5."}]}];
const BCDCA_SENIOR = {"title": "BCDCA Senior Competition Rules", "subtitle": "2023-24 Season", "categories": [{"id": "2day", "title": "Two Day Matches", "items": [{"num": "1", "title": "Playing Times", "body": "Play starts 1:20pm, concludes at completion of the over in progress at 6:00pm (stumps). Before daylight saving begins each day's play ends at 5:30pm, with 53\u201355 overs bowled that day. If a 2-day match is reduced to a 1-day match before daylight saving, it becomes a 29-over-per-side match with a 10-minute change of innings: first innings 1:20pm\u20133:20pm, second innings starts 3:30pm, scheduled stumps 5:30pm (extendable to 5:45pm to complete the 29 overs). Scheduled 2-day matches must be played over both allocated days unless both innings are completed and a result recorded on day one (not applicable to semis/finals or weather-affected matches)."}, {"num": "2", "title": "Tea Break", "body": "Tea is taken at 3:35pm, resuming 3:55pm. If an innings ends or there's a stoppage within 30 minutes of scheduled tea, tea is taken immediately. If 9 wickets are down at the scheduled tea time, play continues up to 30 minutes or until the innings ends."}, {"num": "3", "title": "Drinks Break", "body": "With both captains' agreement, drink breaks of up to 5 minutes may be taken at 2:30pm and 5:00pm without reducing the over rate. In adverse weather, by agreement, additional 5-minute drink breaks may be allowed with a reduced over rate."}, {"num": "4", "title": "Number of Overs", "body": "4.1 Calculation: Each team bowls a maximum of 65 overs in the first innings; the team scoring more runs (regardless of wickets lost) wins. If the team batting first receives at least 60 overs (and isn't all out) on day one, the second team bats the same number of overs as their opponents received. Serious departure from the expected over rate may be treated as unfair play.\n\n4.2 Reduced overs (weather/injury): If fewer than 60 overs are bowled to the team batting first and they are not all out, overs are recalculated as (overs received + 60) \u00f7 2 \u2014 e.g. 43 overs bowled \u2192 (43+60)/2 = 51 overs. If the calculation drops below 25 overs, the match is a draw. If the team batting first is dismissed/closes before 65 overs, the team batting second gets its full 65-over allocation \u2014 except if the team batting first loses its last wicket in overs 60\u201365 within 10 minutes of stumps on day one, in which case the second team receives only the same number of overs as the first. If the team batting second uses its full overs, closes, or is dismissed early, the over count no longer applies and play continues to stumps (unless both captains agree to end the game, noted and signed in both scorebooks)."}, {"num": "5", "title": "Over Rate", "body": "Minimum over rate of 15 overs per hour (~4 minutes per over); teams are expected to bowl at or better than this rate."}, {"num": "6", "title": "End of Match", "body": "The match concludes at stumps regardless of overs bowled; if no result by then, it may be a draw. The first innings is deemed ended immediately once the allocated overs are bowled, and play continues to stumps."}, {"num": "7", "title": "No Play on Day 1", "body": "If there is no play on day 1, the match is played on day 2 under one-day match conditions."}, {"num": "8", "title": "Follow On", "body": "The required lead to enforce the follow-on is 75 runs."}, {"num": "9", "title": "Bowling Restrictions", "body": "9.1(a) Turning 12 or under: max 8 overs/innings, max 4-over spell, rested double the overs bowled.\n9.1(b) Turning 13\u201314: max 10 overs/innings, max 5-over spell, rested double.\n9.1(c) Turning 15\u201316: max 12 overs/innings, max 6-over spell, rested double.\n9.1(d) Turning 17\u201319: max 16 overs/innings, max 8-over spell, rested double.\n9.2 A bowler resuming before the rest period ends is treated as extending the same spell (limit still applies); the normal inter-spell break then applies after the spell ends.\n9.3 Rest-period calculation: interruptions (wet weather/interval) count as 1 over per 3.5 minutes; a 20-minute tea interval counts as 3 overs from each end.\n9.4 Scorers and umpires use Bowling Limitation Record Sheets, signed by umpires after each innings.\n9.5 Breach may lead to disciplinary action and/or loss of points."}]}, {"id": "1day", "title": "One Day Matches", "items": [{"num": "1", "title": "Playing Times", "body": "Daylight saving: play 1:20pm to 7:00pm (stumps), extendable to 7:30pm. Non-daylight saving: 1:20pm to 6:00pm (stumps), extendable to 6:30pm \u2014 unless maximum allocated overs haven't been bowled per Rule 3."}, {"num": "2", "title": "Tea Break (Drinks)", "body": "With both captains' agreement, drink breaks up to 5 minutes may be taken at the halfway point of each innings, without reducing the over rate."}, {"num": "3", "title": "Number of Overs", "body": "3.1 Each team bowls a maximum of 30 overs (non-daylight saving) or 40 overs (daylight saving); higher score wins regardless of wickets.\n3.1.1 If no time was lost and the team bowling first hasn't finished its overs by 4:05pm, play continues until all overs are bowled (if team batting first isn't out/declared). The team batting second is then capped at the number of overs bowled to the first team as at 4:05pm, and may play past 6:00/7:00pm (but not past 7:00pm if dismissed/declared earlier). A 20-minute tea break is taken at 4:05pm or end of first innings.\n3.1.2 Injury time lost during the first innings shifts the 4:05pm cut-off by the same number of minutes, with the same capping logic applied at the new cut-off time.\n3.1.3 Inclement weather during the first innings: half the time lost is added to the first innings' completion deadline (e.g. 30 min lost \u2192 +15 min, must finish by 4:20pm), with the same capping logic for the second innings.\n3.2 If the calculated overs drop below 15 (non-daylight saving) or 20 (daylight saving), the match is a draw."}, {"num": "4", "title": "Over Rate", "body": "Minimum over rate of 15 overs per hour (~4 minutes/over). Serious departure may be treated as unfair play."}, {"num": "5", "title": "Bowling Restrictions", "body": "5.1(a) Max 10 overs per bowler in all one-day games.\n5.2(b) Turning 12 or under: max 8 overs/innings, max 4-over spell, rested double.\n5.2(c) Turning 13\u201314: max 5-over spell, rested double.\n5.3(d) Turning 15\u201316: max 6-over spell, rested double.\n5.4(e) Turning 17\u201319: max 8-over spell, rested double.\n5.2 Resuming before rest ends extends the same spell (limit still applies); normal break applies after the spell.\n5.3 Rest-period calc: 1 over per 4 minutes lost; a 20-min tea interval = 3 overs from each end.\n5.4 Bowling Limitation Record Sheets used and signed by umpires each innings.\n5.4.1 Breach may lead to disciplinary action and/or loss of points."}, {"num": "6", "title": "Injured Bowler", "body": "If a bowler is injured mid-over, another player completes the over immediately, but no player may bowl two overs (or part) consecutively in one innings."}, {"num": "7", "title": "End of Match", "body": "The match concludes once a first-innings result is obtained."}, {"num": "8", "title": "Inclement Weather \u2013 Time Lost", "body": "Start delayed by weather reduces max overs on a sliding scale (both non-daylight-saving/daylight-saving figures shown): 1\u20138 min \u2192 29/39 overs; 8\u201316 min \u2192 28/38; 16\u201324 min \u2192 27/37; 24\u201332 min \u2192 26/36; 32\u201340 min \u2192 25/35; 40\u201348 min \u2192 24/34; 48\u201356 min \u2192 23/33; 56+ min \u2192 22/32 overs."}, {"num": "9", "title": "Late Start \u2013 Time Lost", "body": "Late starts (not weather-related), up to 1:35pm, reduce overs: 1\u20138 min \u2192 29/39 overs; 8\u201316 min \u2192 28/38 overs. Match concludes at the rule-specified time. This scale applies only to delayed starts, not interruptions after play has begun."}]}, {"id": "t20", "title": "Twenty20 (20/20) Matches", "items": [{"num": "1", "title": "Playing Times", "body": "Start time set by the Senior Competition Secretary. Scheduled close of play is 3 hours after the start."}, {"num": "2", "title": "Number of Overs", "body": "2.1 Each team bowls a maximum of 20 overs; higher score wins regardless of wickets.\n2.2 If no time was lost and the team bowling first hasn't finished by 90 minutes after start, play continues to complete all overs (if not out/declared); the second team is then capped at the overs bowled as at that 90-minute mark, and may continue past scheduled close (unless dismissed/declared earlier).\n2.3 Injury time lost shifts the cut-off by the same amount, with the same capping logic."}, {"num": "3", "title": "Inclement Weather", "body": "3.1 Delayed start reduces max overs: 1\u20138 min \u2192 19 overs; 8\u201316 \u2192 18; 16\u201324 \u2192 17; 24\u201332 \u2192 16; 32\u201340 \u2192 15; 40\u201348 \u2192 14; 48\u201356 \u2192 13; 56+ \u2192 12 overs.\n3.2 Late starts (non-weather) up to 15 minutes after scheduled start: 1\u20138 min \u2192 19 overs; 8\u201316 min \u2192 18 overs. If overs calculation drops below 10, the match is a draw."}, {"num": "4", "title": "Over Rate", "body": "Minimum over rate of 15 overs/hour (~4 min/over). Serious departure may be treated as unfair play."}, {"num": "5", "title": "Bowling Restrictions", "body": "5.1 Max 4 overs per bowler in all 20/20 games.\n5.2 Failure to comply may lead to disciplinary action and/or loss of points."}, {"num": "6", "title": "Injured Bowler", "body": "Another player completes the over immediately if a bowler is injured, but no player bowls two overs (or part) consecutively in one innings."}, {"num": "7", "title": "End of Match", "body": "A result requires the side batting first to face at least 10 overs, with the side batting second either passing the score or facing the same number of overs (or the overs set by weather rules). Match concludes on a first-innings result."}]}, {"id": "general", "title": "General Rules (All Competitions & Players)", "items": [{"num": "1", "title": "Unregistered Players", "body": "A team playing an unregistered/unqualified player loses that match; opponents get the maximum points gained by any team in that division; the offending team gets none. Unfinancial players cannot play for another club until financial and cleared."}, {"num": "2", "title": "Reports Under Rule 1", "body": "Must be in writing, but need not be a formal protest."}, {"num": "3", "title": "Substitute Player", "body": "3.1 (except U17) No player may play/substitute for more than one team on the same date. 3.2 Substitutes must be named on the team sheet and both scorebooks, and be registered senior players. 3.3 A player can't field/substitute in a lower grade than their own. 3.4 A player is nominated on only one team sheet per date across all BCDCA-linked competitions. 3.5 An ineligible substitute may cost the team its points for that match, awarded to the opposition. 3.6 Up to 3 players/team/round may play down to the club's next lower grade (max 2 grades below original) without regrading, provided: they qualify for finals in that grade only by playing 3 of the last 5 matches there, and no player plays down for more than 5 rounds; this doesn't apply if the higher team isn't playing that round."}, {"num": "4", "title": "Grading Player to a Lower Grade", "body": "A player who has played 6 matches in a higher grade group cannot drop to a lower grade without Grading Committee permission."}, {"num": "5", "title": "Player Transfer During Season", "body": "No player may play for more than one club per season without an Executive Committee permit. No permits/transfers are granted after the Committee meeting before the last December match."}, {"num": "6", "title": "Grading Criteria", "body": "6.1 Regrading applications are lodged in writing with the Honorary Secretary by 8:00pm the Wednesday before a match, with performance data and scorebooks provided within 7 days. Committee decisions are final; misleading info costs points.\n6.2 Batting grading by average: 0\u20135.35 (down 2 grades), 5.36\u201310.70 (down 1), 10.71\u201317.85 (same grade), 17.86\u201325.00 (1 grade higher), 25.01\u201332.15 (2 grades higher), 32.16+ (Committee decides). 5 innings constitute grading.\nBowling grading by wickets: 0\u201314 (down 2), 15\u201325 (down 1), 26\u201330 (same grade), 31\u201340 (1 higher), 41\u201349 (2 higher), 50+ (Committee decides). 5 matches constitute grading. Gradings are a guideline only; final team grading reflects overall Team Nomination Form strength."}, {"num": "7", "title": "Registration and Photo ID", "body": "7.1 Registration forms need full names, last grade/club, lodged by 31 August; minimum 11 forms per team (9 for a club's lowest team). Players must carry acceptable photo ID to every day's play; opposing captains check IDs before play; no ID disputes unless a check preceded the match.\n7.2 Late registrations must be lodged in writing by 8:00pm the Wednesday before the match, cleared by the Grading Committee first.\n7.3 Senior-only players may return from Grade/Shires and play 1st grade without notice; players registered with BCDCA who go to Grade/Shires must notify the Secretary on return for regrading (if below 1st grade); failing to notify forfeits that round's points."}, {"num": "8", "title": "Grading \u2013 Team", "body": "Teams are graded by a Grading Committee (Executive Committee + 2 elected Management Committee members, not for consecutive seasons), which may regrade before the season starts and after 5 completed rounds."}, {"num": "9", "title": "Clearance \u2013 Transfer", "body": "Transferring players need a clearance from their previous club and Grading Committee approval before playing for a new club; violators are deemed unregistered."}, {"num": "10", "title": "Fitness of Grounds", "body": "10.1 The BCDCA can cancel a full round no earlier than 24 hours before start (weather, smoke haze, heat, etc.). Ground fitness is decided by both captains, or the appointed umpire if they disagree, or (if no umpire) the status quo continues, recorded and signed by both captains.\n10.2 The Secretary lists alternate grounds each round for transfers due to vandalism or BCDCA direction. Grounds unplayable due to weather (rain/flood) may NOT be transferred elsewhere."}, {"num": "11", "title": "Forfeits", "body": "11.1 Teams need at least 7 players present by 1:35pm on day 1, or forfeit; late starts must be reported and signed by both captains; a fine of at least $10 may apply.\n11.2 Fines: $30 for a first forfeit; $150 for a second (plus possible suspension) unless excused; the forfeiting team/club pays any appointed umpires' fees within 14 days.\n11.3 A forfeiting team loses 6 competition points."}, {"num": "12", "title": "Positions Decided by Averages", "body": "If two full rounds can't be completed, competition placings use averages (points scored against maximum possible points for matches actually played)."}, {"num": "13", "title": "Awarding of Points", "body": "Outright win: 10. Outright win (lost on 1st innings): 10. First innings win: 6. Tied match (1st innings): 4. Tied match (2nd innings): 5. Drawn match: 3. Win on forfeit: highest points gained that round in that grade. First innings loss: 1. Forfeit/bye/outright loss when behind on 1st innings: 0."}, {"num": "14", "title": "Semi-Finals and Finals", "body": "Top 4 teams meet: 1st v 4th, 2nd v 3rd; winners play the Final. Ties on points/percentage are broken by runs-per-wicket ratio (team's own batting average \u00f7 opponents' batting average against them; higher quotient wins).\n14.1 Semis/Finals are played over 2 days on Committee-allocated grounds (home ground to the higher-finishing team where suitable).\n14.2 A player needs 5 senior matches with their club before the semis to be eligible (reduced to 4 if the team missed 3 matches to weather/bye/forfeit, or 3 if it missed 4).\n14.3 If no result on 1st innings in either semi, the higher-placed team before the semis is declared the winner.\n14.4 If no play is possible on both Final days, it's rescheduled to the following weekend.\n14.5 If the rescheduled Final also has no 1st-innings result, the higher-placed finalist before the semis is declared Premiers.\n14.6 Officially appointed umpires may end a 2nd-innings-only match if they judge there's insufficient time for an outright result."}, {"num": "15", "title": "Clothing Regulation", "body": "Players wear white/cream collared shirts (no T-shirts) and white/cream trousers; no red shoes/boots. White/cream socks and sweater permitted, or a Management Committee-approved uniform (approval required for all shirts/pants; if used, the whole club wears the same approved kit). Exposed clothing (e.g. skins) must be white, black, or match the approved shirt colour (never red). Fielders may not tuck pants into socks. No metal spikes/cleats on synthetic-pitch grounds. Non-compliant players can't take the field until correctly attired. Umpiring players wear a shirt (no singlets) and enclosed footwear (no thongs/sandals)."}, {"num": "16", "title": "Matting Requirement \u2013 No Synthetic Surface", "body": "Home clubs must provide coir matting over concrete wickets lacking other covering. A ball pitching on the matting leathers, exposed concrete centre, or any synthetic/concrete pitch is called and signalled 'No Ball'."}, {"num": "18", "title": "Scorebook Discrepancy", "body": "Disputed scorebooks go to the Executive Committee; an appointed umpire impounds and forwards them to the Honorary Secretary. The Committee decides the winner using batting records first, then bowling records if batting doesn't agree; if neither agrees, the Committee's decision is final."}, {"num": "19", "title": "Less Than 11 Players \u2013 Scorebook Requirement", "body": "If a team plays fewer than 11 and all available wickets fall, absent players are recorded 'NIL' and the 10th wicket is deemed fallen. Absent players who never batted don't count as an innings for individual averages."}, {"num": "20", "title": "Umpires Withdrawn After Wednesday", "body": "An umpire who withdraws from officiating after Wednesday may not play in that round."}, {"num": "21", "title": "Results on Play HQ", "body": "Team sheets must reach the Senior Competition Secretary by 8:00pm the Thursday after the match (fine: $100 for non-compliance).\n21.1 Home team must post full results (teams, batting/bowling figures, stats) on Play HQ by 8:00pm the following Tuesday.\n21.2 Away team must confirm and enter full stats by 8:00pm the following Thursday, or lose 2 competition points."}, {"num": "22", "title": "Cricket Balls \u2013 Approved", "body": "Only BCDCA-approved 156-gram leather six-stitch Kookaburra Tuf Pitch balls bearing the BCDCA brand are used. The batting team has no right to demand a new ball for its 2nd innings; the fielding team may use a satisfactory new or used ball."}, {"num": "23", "title": "No Postponement of Matches", "body": "No match may be postponed for picnics or similar functions."}, {"num": "24", "title": "Competition Rules Not Covered \u2013 Refer to MCC", "body": "Any competition rule not covered above follows the MCC's rules and by-laws."}, {"num": "25", "title": "Power of Committee", "body": "The Committee may address matters not covered by these rules, but cannot change existing rules without a two-thirds majority Delegates' vote."}, {"num": "26", "title": "Signing Scorebooks", "body": "Both captains must sign scorebooks at the end of each innings."}, {"num": "27", "title": "Club Championship Points", "body": "Only clubs with at least 4 teams at season's end are eligible. The lowest-numbered grade's points are multiplied by 1; higher grades increase by 0.10 increments per grade (e.g., 8 grades: 8th\u00d71.0 up to 1st\u00d71.7). A club's total is divided by its number of teams; highest average wins the Club Championship."}, {"num": "28", "title": "Incorrect Team Sheet", "body": "An honest incorrect team sheet (spelling/incomplete details) draws a $15 fine (first offence), $30 (subsequent).\n28.1 A captain/signatory found playing a player under an assumed name is suspended a minimum 21 playing weeks.\n28.2 A player found playing under an assumed name is suspended a minimum 21 playing weeks."}, {"num": "29", "title": "Requirement for 2nd Innings", "body": "A team failing to take the field for its 2nd innings when required (ground/weather permitting) is fined the equivalent of a forfeit and may lose points."}, {"num": "30", "title": "Player Umpire \u2013 Qualification", "body": "An umpire must be a player listed on the match team sheet, or another person mutually agreed by both captains."}, {"num": "31", "title": "Wides and No-Balls \u2013 Scorebook Entry", "body": "Wides and no-balls delivered are entered as runs scored against the bowler."}, {"num": "32", "title": "Juniors Under 15 \u2013 Requirement", "body": "Clubs fielding a player under 15 (as at 31 August) need written parental consent and Executive Committee approval, with supporting performance details. The player cannot participate until the Committee determines eligibility, and cannot play above their graded grade."}, {"num": "33", "title": "Match Report", "body": "Each captain (or representative) submits a signed match report form with the team/result slips to the Senior Competition Secretary. (Not for reporting Code of Behaviour breaches \u2014 those follow the Code's own process.)"}, {"num": "34", "title": "Replacing Player Called to Blacktown Grade", "body": "With Executive Committee approval, a club may replace a player promoted to Blacktown Grade mid-match; the replacement continues the original player's innings and must be a registered, eligible club member."}, {"num": "35", "title": "Helmets \u2013 Mandatory for Under 18's", "body": "All players under 18 (at 31 August) must wear a helmet while batting, in all weather and against all bowling types."}, {"num": "36", "title": "Fielding Restrictions for Under 18's", "body": "36.1 Under-14s can't field within a 10m circle at the striker's end, except wicketkeeper, offside slip, and gully.\n36.2 Over-14 and under-18 players fielding within that 10m circle must wear a helmet with faceguard and a protector (except wicketkeeper, offside slip, gully).\n36.3 A breach before the batter strikes/is struck/ball passes the stumps means the umpire calls Dead Ball.\n36.4 Under-18 wicketkeepers standing up to the stumps (within 2m) must always wear a helmet."}, {"num": "37", "title": "Player Returning from Grade/Shires", "body": "A club must advise the Secretary when a player registered with BCDCA returns from Grade/Shires; the player's grade is reassessed before resuming."}, {"num": "38", "title": "Two Captains Meetings \u2013 Compulsory", "body": "A team representative must attend 2 captains meetings per season; 2 competition points are deducted per missed meeting (up to 4 total)."}, {"num": "39", "title": "Lightning Strike \u2013 Procedure", "body": "If thunder follows a lightning flash within 30 seconds, play stops immediately and doesn't resume until 30 minutes after that flash."}, {"num": "40", "title": "Maximum Players (Bat and Bowl)", "body": "40.1 Maximum 13 players may be nominated on the team sheet.\n40.2 Only 11 may bat and 11 may bowl."}, {"num": "41", "title": "Matches to Continue Under Protest", "body": "Any disputed match continues under protest, with the result decided later by the BCDCA; protest details are recorded in both scorebooks."}, {"num": "42", "title": "Player Umpiring", "body": "42.1 A team with a bye must send 2 senior players (over 18, one per allocated game) to umpire; failure costs 6 competition points per game missed.\n42.2 The umpiring player signs both scorebooks; on-field issues must be reported to the Secretary that afternoon. A qualified BCDCUA member umpiring during their team's bye still counts toward the allocation. Clubs must provide 2 qualified umpires for semi-finals."}, {"num": "43", "title": "Paying a Player Umpire", "body": "A player with a certified community umpires' course is paid $25 per team per day by both teams; only BCDCA executives certify qualifying courses."}, {"num": "44", "title": "Boundaries", "body": "Boundaries are set at 65 metres from the stumps except where impractical."}, {"num": "45", "title": "Junior Player Restrictions", "body": "U15/U16 winter development team selections can't play the bottom 2 senior grades; they must still be nominated to a senior team before the season starts. Once Shield/Cup teams are finalised, only Shield players are restricted from the bottom 2 grades; non-selected players may be re-added to any team's nomination form."}], "short": "General Rules"}, {"id": "mcc", "title": "MCC Law Amendments (BCDCA-Specific)", "items": [{"num": "MCC Law 9", "title": "High Pitch Full Toss (New)", "body": "Any delivery (including slow-paced) passing or that would pass on the full above waist height of an upright striker at the popping crease is deemed dangerous and unfair, injury risk or not. The bowler's-end umpire calls and signals No Ball, then cautions the bowler with a final warning once the ball is dead (informing the other umpire, fielding captain, and batters) \u2014 this caution applies for the rest of the innings. A repeat by the same bowler in that innings: No Ball is called, and once dead the umpire directs the captain to suspend the bowler immediately; the bowler cannot bowl again that innings."}, {"num": "MCC Rule 41.6", "title": "Non-Striker Run-Out Attempt", "body": "MCC Law 41.16 (as written) does not apply in BCDCA competitions. Instead: the bowler may attempt to run out the non-striker before entering their delivery stride. Whether successful or not, the ball doesn't count in the over. If the attempt fails, the umpire calls and signals Dead Ball as soon as possible."}, {"num": "MCC Rule 42", "title": "Not Applied in BCDCA", "body": "MCC Law 42 of the 2017 Laws of Cricket (concerning temporary removal of players from the field) does not apply in BCDCA competitions, since official umpires aren't present at every game, leaving the rule open to abuse."}], "short": "MCC Amendments"}, {"id": "obsolete", "title": "Obsolete Rules", "items": [{"num": "Appendix A", "title": "High Pitched Full Toss (Obsolete)", "body": "Former rule: any high full-pitched ball passing above waist height of an upright batter was called No Ball by either umpire; a deliberate fast full pitch (Beamer) followed a caution/final-warning/action/report procedure per old Law 42.8, with immediate removal (no warning) if judged deliberate \u2014 applicable only under an officially BCDCUA-appointed umpire. Note: Old MCC Law 42.8 is now obsolete and no longer applied in BCDCA matches (obsolete since 6/9/17)."}]}]};
const BCDCA_JUNIOR = {"title": "BCDCA Junior Competition Rules", "subtitle": "2026-27 Season", "categories": [{"id": "process", "title": "Competition Process", "items": [{"num": "1.1", "title": "Team Gradings", "body": "All teams are graded by a Grading Committee (elected by/from the Management Committee) based on each club's originally submitted team; the Committee may regrade before the competition starts."}, {"num": "1.2", "title": "Combined Competitions (U17)", "body": "Under 16 and Under 17 players play in a combined competition formed of Under 17 Division 1 and Division 2."}, {"num": "1.3", "title": "Duration of Matches", "body": "Matches are 2 days' duration unless the Elected Committee decides otherwise."}, {"num": "1.4.1", "title": "Playing Times (All Formats)", "body": "Matches start 8:15am, conclude at the completion of the over in progress at 12:00noon (stumps). A 10-minute tea break is taken at 10:05am. Drinks breaks are scheduled halfway through each session (~9:10am and 10:50am) or as captains/coaches agree, without reducing the over rate."}, {"num": "1.4.2", "title": "One Day Matches", "body": "Play may continue past 12:00noon until the over in progress at 12:10pm to achieve a result; reasons for playing past noon must be noted on the result slip."}]}, {"id": "player", "title": "The Player(s)", "items": [{"num": "2.1", "title": "Age Requirements", "body": "Players must be under the competition's age limit as at 31 August of the current season (e.g. an 11-year-old on 31 Aug may play Under 12 or higher).\n2.1.1 Girls in mixed competition may play one age group below their age.\n2.1.1.1 Clubs may apply for variations to 2.1.1.\n2.1.2 A player under 14 can't play/register more than one year above their age group without Elected Committee approval.\n2.1.3 Boys may play one age group below their age for inclusion only, via a detailed written application (DOB, club, ID number, history, skill level, signed parent/club letters) to the Junior Competition Secretary, approved/withdrawn at the Committee's discretion."}, {"num": "2.2", "title": "Unregistered Players", "body": "A team playing an unregistered/unqualified player loses that match; opponents get the maximum points gained by any team in that division; the offending team gets none."}, {"num": "2.3", "title": "Reports \u2013 Unregistered Players", "body": "Must be in writing but need not be a formal protest."}, {"num": "2.4", "title": "Transfer Between Age Groups", "body": "A player who has played 5 matches in a higher age group cannot drop to a lower age group without Grading Committee permission.\n2.4.1 Where an age group has Division 1 and 2, a Division 2 player may play up to 3 matches in Division 1 before being upgraded; a Division 2 player needs Elected Committee approval to play in the Division 1 semi/final, and must play 3 games in a division to qualify for its semis/final."}, {"num": "2.5", "title": "Player Changing Clubs During Season", "body": "No player may play for more than one club per season without an Elected Committee permit; none granted after the Committee meeting before the last December match. A player who starts a district match cannot leave to play another match (including Blacktown Grade) that day, though call-ups mid-match are still allowed under existing rules; breaching teams forfeit that match with no points awarded."}, {"num": "2.6", "title": "Player Transfer \u2013 Clearance Required", "body": "Transferring players need a clearance from their prior club (this season) and Committee approval; violators are deemed unregistered.\n2.6.1 Registration forms require Committee approval before playing for a different team.\n2.6.2 Late registration applications are considered when complete.\n2.6.3 Late registrations must be lodged in writing with the Junior Competition Secretary by 8:00pm the Wednesday before the match, cleared by the Grading Committee first."}, {"num": "2.7", "title": "Player Transfer in Same Age Group", "body": "A junior player
