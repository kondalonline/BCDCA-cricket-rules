 on the ground, must be placed beyond the boundary and is not itself to be regarded as being the boundary.\n\n19.2.3 If the boundary is marked by means of an object that is in contact with the ground the boundary will be the edge of the grounded part of the object which is nearest the pitch.\n\n19.2.4 Where there is no white line or object providing continuous marking, objects such as flags, posts or boards may be used to mark specific points on the boundary. The boundary shall be the imaginary straight line on the ground joining the two nearest marked points.\n\n19.2.5 A boundary that cannot be identified as in 19.2.2, 19.2.3 or\n\n19.2.4 shall be determined by the umpires before the toss.\n\n19.2.6 An obstacle within the field of play, other than as in 19.2.7, shall not be regarded as a boundary unless so determined by the umpires before the toss. See Law 2.3.1.4 (Consultation with captains).\n\n19.2.7 A person, animal or object coming onto the field of play while the ball is in play shall not be regarded as a boundary unless the umpires determine otherwise at the time that contact between the ball and such a person, animal or object is made. The decision shall be made for each separate occurrence. See also Law 20.4.2.12 (Umpire calling and signalling Dead ball)."}, {"num": "19.3", "title": "Restoring the boundary", "body": "If a solid object used to mark the boundary is disturbed for any reason, then\n\n19.3.1 the boundary shall be considered to be in its original position.\n\n19.3.2 the object shall be returned to its original position as soon as is practicable; if play is taking place, this shall be as soon as the ball is dead.\n\n19.3.3 if some part of a fence or other marker has come within the field of play, that part shall be removed from the field of play as soon as is practicable; if play is taking place, this shall be as soon as the ball is dead."}, {"num": "19.4", "title": "Ball grounded beyond the boundary", "body": "19.4.1 The ball in play is grounded beyond the boundary if it touches the boundary or any part of an object used to mark the boundary the ground beyond the boundary any object that is grounded beyond the boundary.\n\n19.4.2 The ball in play is to be regarded as being grounded beyond the boundary if a fielder, grounded beyond the boundary as in 19.5, touches the ball a fielder, after catching the ball within the boundary, becomes grounded beyond the boundary while in contact with the ball, before completing the catch."}, {"num": "19.5", "title": "Fielder grounded beyond the boundary", "body": "19.5.1 A fielder is grounded beyond the boundary if some part of their person is in contact with any of the following: the boundary or any part of an object used to mark the boundary the ground beyond the boundary any object that is in contact with the ground beyond the boundary another fielder who is grounded beyond the boundary, if the umpire considers that it was the intention of either fielder that the contact should assist in the fielding of the ball.\n\n19.5.2 A fielder who is not in contact with the ground is considered to be grounded beyond the boundary if, prior to their first contact with the ball, their final contact with the ground was not entirely within the boundary. This applies to any fielder who makes contact with the ball after it has been delivered by the bowler, whether or not the ball has previously been touched by another fielder.\n\n19.5.2.1 If a fielder\u2019s first contact with the ball does not contravene 19.5.2, that fielder may then jump from outside the boundary in order to make contact with the ball whilst airborne. After making contact with the ball once airborne, all subsequent contact with the ground by that fielder, until the ball becomes dead, must be within the field of play. Any subsequent contact with the ground outside the boundary by that fielder during that delivery, whether or not in contact with the ball, will result in a boundary being scored.\n\n19.5.2.2 If the ball is returned to the field of play, whether to another fielder or onto the ground, by a fielder who has jumped from outside the boundary, that fielder must land, and remain, within the boundary until the ball becomes dead. Otherwise a boundary shall be scored."}, {"num": "19.6", "title": "Boundary allowances", "body": "19.6.1 Before the toss the umpires shall determine the runs to be allowed for boundaries with both captains. In deciding the allowances the umpires and captains shall be guided by the prevailing custom of the ground.\n\n19.6.2 Unless determined differently under 19.6.1, 6 runs shall be allowed for a Boundary 6; and 4 runs for a Boundary 4. See also 19.7."}, {"num": "19.7", "title": "Runs scored from boundaries", "body": "19.7.1 A Boundary 6 will be scored if and only if the ball has been struck by the bat and is first grounded beyond the boundary without having been in contact with the ground within the field of play. This shall apply even if the ball has previously touched a fielder.\n\n19.7.2 A Boundary 4 will be scored when a ball that is grounded beyond the boundary whether struck by the bat or not, was first grounded within the boundary, or has not been struck by the bat.\n\n19.7.3 When a boundary is scored, the batting side, except in the circumstances of 19.8, shall be awarded whichever is the greater of\n\n19.7.3.1 the allowance for the boundary\n\n19.7.3.2 the runs completed by the batters together with the run in progress if they had already crossed at the instant the boundary is scored.\n\n19.7.4 When the runs in 19.7.3.2 exceed the boundary allowance they shall replace the boundary allowance for the purposes of Law 18.12.2 (Batter returning to wicket they have left).\n\n19.7.5 The scoring of Penalty runs by either side is not affected by the scoring of a boundary."}, {"num": "19.8", "title": "Overthrow or wilful act of fielder", "body": "19.8.1 Runs scored from an overthrow or wilful act of fielder. If the boundary results from an overthrow or from the wilful act of a fielder, the runs scored shall be any runs for penalties awarded to either side and the allowance for the boundary and the runs completed by the batters at the instant of the throw or wilful act of the fielder and the run in progress, if the batters had already crossed at the instant of the throw or wilful act of the fielder.\n\nLaw 18.12.2 (Batter returning to wicket they have left) shall apply as from the instant of the throw or wilful act of the fielder.\n\n19.8.2 Definition of an overthrow or wilful act of fielder.\n\n19.8.2.1 A boundary results from an overthrow if, in the opinion of the umpire, in an attempt to Run out a batter or prevent further run-scoring, a fielder directs the ball towards the wickets, and the ball subsequently crosses the boundary.\n\n19.8.2.2 It is not to be considered an overthrow if the ball crosses the boundary as a result of a fielder attempting to stop the ball, or when fielding near the boundary, a fielder attempting to pass it a short distance to another fielder.\n\n19.8.2.3 For the purposes of this Law only, a wilful act is any deliberate action by a fielder that is not intended to prevent runs, effect a Run out, or complete a catch."}]}, {"num": 20, "title": "Dead ball", "subs": [{"num": "20.1", "title": "Ball is dead", "body": "20.1.1 The ball becomes dead when\n\n20.1.1.1 i tis finally settled.\n\n20.1.1.2 a boundary is scored. See Law 19.7 (Runs scored from boundaries).\n\n20.1.1.3 a batter is dismissed. The ball will be deemed to be dead from the instant of the incident causing the dismissal.\n\n20.1.1.4 whether played or not it becomes trapped between the bat and person of a batter or between items of that batter\u2019s clothing or equipment.\n\n20.1.1.5 whether played or not it lodges in the clothing or equipment of a batter or the clothing of an umpire.\n\n20.1.1.6 under either of Laws 24.4 (Player returning without permission) or 28.2 (Fielding the ball) there is an offence resulting in an award of Penalty runs. The ball shall not count as one of the over.\n\n20.1.1.7 there is contravention of Law 28.3 (Protective helmets belonging to the fielding side).\n\n20.1.1.8 the match is concluded in any of the ways stated in Law 12.9 (Conclusion of match).\n\n20.1.2 The ball is finally settled once it is in the hand or hands of any fielder or stationary on the ground, and the bowler\u2019s end umpire determines that it is no longer in play."}, {"num": "20.2", "title": "Ball finally settled", "body": "Whether the ball is finally settled or not is a matter for the umpire alone to decide."}, {"num": "20.3", "title": "Call of Over or Time", "body": "Neither the call of Over (see Law 17.4 \u2013 Call of over), nor the call of Time (see Law 12.2 \u2013 Call of Time) is to be made until the ball is dead, either under 20.1 or under 20.4."}, {"num": "20.4", "title": "Umpire calling and signalling Dead ball", "body": "20.4.1 When the ball has become dead under 20.1, the bowler\u2019s end umpire may call and signal Dead ball if it is necessary to inform the players.\n\n20.4.2 Where either umpire is required to call and signal Dead ball under 20.4.2.1 to 20.4.2.14, the ball will be considered to be dead at the instant of the incident causing the ball to become dead. However, where the Law specifically provides for the call to be delayed, so as not to disadvantage the non-offending side, under Law 23.3 (Leg byes not to be awarded), Law 25.7 (Restriction on the striker\u2019s runner), Law 34.4 (Runs permitted from the ball lawfully struck more than once), Law 41.2.1 (Unfair actions) and Law 42.1.2 (Unacceptable conduct), the ball will be considered to be dead at the point of the call. Either umpire shall call and signal Dead ball when\n\n20.4.2.1 intervening in a case of unfair play.\n\n20.4.2.2 a possibly serious injury to a player or umpire occurs.\n\n20.4.2.3 leaving their normal position for consultation.\n\n20.4.2.4 one or both bails fall from the striker\u2019s wicket, without intervention from any player or their equipment, before the striker has had the opportunity of playing the ball.\n\n20.4.2.5 the striker is not ready for the delivery of the ball and, if the ball is delivered, makes no attempt to play it. Provided the umpire is satisfied that the striker had adequate reason for not being ready, the ball shall not count as one of the over.\n\n20.4.2.6 the striker is distracted by any noise or movement or in any other way while preparing to receive, or receiving a delivery. This shall apply whether the source of the distraction is within the match or outside it. Note also 20.4.2.7. The ball shall not count as one of the over.\n\n20.4.2.7 there is an instance of a deliberate attempt to distract under either of Laws 41.4 (Deliberate attempt to distract or obstruct striker) or 41.5 (Deliberate distraction, deception or obstruction of batter). The ball shall not count as one of the over.\n\n20.4.2.8 the bowler drops the ball accidentally before delivery.\n\n20.4.2.9 the bowler throws the ball towards the striker\u2019s end before entering their delivery stride. 20.4.2.10 the ball is not delivered for any reason other than an attempt to run out the non-striker under Law 38.3 (Non-striker leaving their ground early). 20.4.2.11 satisfied that the ball in play cannot be recovered. 20.4.2.12 they consider that either side has been disadvantaged by a person, animal or other object within the field of play. However, if both umpires consider the ball would have reached the boundary regardless of the intervention, the boundary should stand. See Law 19.2.7 (Identifying and marking the boundary). 20.4.2.13 the striker attempts to play the ball and no part of the striker\u2019s bat or person, whether grounded or raised, remains within the pitch as defined in Law 6.1 (Area of pitch). 20.4.2.14 they are required to do so under any of the Laws not included above."}, {"num": "20.5", "title": "Ball ceases to be dead", "body": "The ball ceases to be dead \u2013 that is, it comes into play \u2013 when the bowler starts their run-up or, if there is no run-up, starts their bowling action."}, {"num": "20.6", "title": "Dead ball not to be revoked", "body": "Once the ball is dead, no revoking of any decision can bring the ball back into play for that delivery."}, {"num": "20.7", "title": "Dead ball; ball counting as one of over", "body": "20.7.1 When a ball which has been delivered is called dead or is to be considered dead then, other than as in 20.7.2,\n\n20.7.1.1 i twill not count in the over if the striker has not had an opportunity to play it.\n\n20.7.1.2 unless No ball or Wide ball has been called, it will be a valid ball if the striker has had an opportunity to play it, except in the circumstances of 20.4.2.6 and Laws 24.4 (Player returning without permission), 28.2 (Fielding the ball), 41.4 (Deliberate attempt to distract or obstruct striker) and 41.5 (Deliberate distraction, deception or obstruction of batter).\n\n20.7.2 In 20.4.2.5, the ball will not count in the over only if both conditions of not attempting to play the ball and having an adequate reason for not being ready are met. Otherwise the delivery will be a valid ball."}]}, {"num": 21, "title": "No ball", "subs": [{"num": "21.1", "title": "Mode of delivery", "body": "21.1.1 The umpire shall ascertain whether the bowler intends to bowl right-handed or left-handed, over or round the wicket, and shall so inform the striker. It is unfair if the bowler fails to notify the umpire of a change in mode of delivery. In this case the umpire shall call and signal No ball.\n\n21.1.2 Underarm bowling shall not be permitted except by special agreement before the match."}, {"num": "21.2", "title": "Fair delivery \u2013 the arm", "body": "For a delivery to be fair in respect of the arm the ball must not be thrown. A ball is fairly delivered in respect of the arm if, once the bowler\u2019s arm has reached the level of the shoulder in the delivery swing, the elbow joint is not straightened partially or completely from that instant until the ball has left the hand. This definition shall not debar a bowler from flexing or rotating the wrist in the delivery swing. Although it is the primary responsibility of the striker\u2019s end umpire to assess the fairness of a delivery in this respect, there is nothing in this Law to debar the bowler\u2019s end umpire from calling and signalling No ball if they consider that the ball has been thrown."}, {"num": "21.3", "title": "Ball thrown or delivered underarm \u2013 action by umpires", "body": "21.3.1 After the bowler has entered their delivery stride, if in the opinion of either umpire the ball has been thrown or, unless permitted by agreement in 21.1.2, delivered underarm, that umpire shall call and signal No ball and, when the ball is dead, inform the other umpire of the reason for the call. The bowler\u2019s end umpire shall then warn the bowler, indicating that this is a first and final warning. This warning shall apply to that bowler throughout the innings. inform the captain of the fielding side of the reason for this action. inform the batters at the wicket of what has occurred.\n\n21.3.2 If either umpire considers that, in that innings, a further delivery by the same bowler is thrown or, unless permitted by agreement in 21.1.2, delivered underarm, that umpire shall call and signal No ball and when the ball is dead inform the other umpire of the reason for the call. The bowler\u2019s end umpire shall then direct the captain of the fielding side to suspend the bowler immediately from bowling. The over shall, if applicable, be completed by another bowler, who shall neither have bowled the previous over or part thereof nor be allowed to bowl any part of the next over. The suspended bowler shall not bowl again in that innings. inform the batters at the wicket and, as soon as practicable, the captain of the batting side of the reason for this action.\n\n21.3.3 The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "21.4", "title": "Bowler throwing towards striker\u2019s end before delivery", "body": "If the bowler throws the ball towards the striker\u2019s end before entering the delivery stride, it is not a No ball and the procedure stated in 21.3 shall not apply. However, the umpire shall call and signal Dead ball under Law 20.4.2.9."}, {"num": "21.5", "title": "Fair delivery \u2013 the feet", "body": "For a delivery to be fair in respect of the feet, in the delivery stride\n\n21.5.1 the bowler\u2019s back foot must land within and not touching the return crease on the side of their stated mode of delivery.\n\n21.5.2 the bowler\u2019s front foot must land with some part of the foot, whether grounded or raised on the same side of the imaginary line joining the two middle stumps as the return crease described in 21.5.1, and behind the popping crease. If the bowler\u2019s end umpire is not satisfied that all of these three conditions have been met, they shall call and signal No ball. See Law 41.8 (Bowling of deliberate front foot No ball)."}, {"num": "21.6", "title": "Bowler breaking wicket in delivering ball", "body": "If the ball is delivered and if the non-striker is not dismissed under Law 38.3 (Non-striker leaving their ground early), either umpire shall call and signal No ball if the bowler breaks the wicket at any time after the ball comes into play and before completion of the stride after the delivery stride.\n\nThis shall include any clothing or other object that falls from the bowler\u2019s person and breaks the wicket. See Appendix A.12. Laws 20.4.2.8, 20.4.2.10 (Umpire calling and signalling Dead ball)."}, {"num": "21.7", "title": "Ball bouncing more than once, rolling along the ground", "body": "or landing off the pitch The umpire shall call and signal No ball if a ball which they consider to have been delivered, without having previously touched bat or person of the striker,\n\n21.7.1 bounces more than once or rolls along the ground before it reaches the popping crease or\n\n21.7.2 first lands or subsequently bounces wholly or partially off the pitch as defined in Law 6.1 (Area of pitch) before it reaches the line of the striker\u2019s wicket. When a non-turf pitch is being used, this will apply to any ball that wholly or partially first lands or subsequently bounces off the artificial surface."}, {"num": "21.8", "title": "Ball causing the striker to leave the pitch, or ball coming to rest near striker", "body": "to rest in front of striker\u2019s wicket If a ball delivered by the bowler comes to rest in front of the line of the striker\u2019s wicket or is so far from the pitch that the striker would need to leave the pitch to attempt to play the ball (see Law 25.8 \u2013 Striker\u2019s right to play the ball), without having previously touched the bat or person of the striker, the umpire shall call and signal No ball and immediately call and signal Dead ball."}, {"num": "21.9", "title": "Fielder intercepting a delivery", "body": "If, except in the circumstances of Law 27.3 (Position of wicket-keeper), a ball delivered by the bowler makes contact with any part of a fielder\u2019s person before it either makes contact with the striker\u2019s bat or person, or it passes the striker\u2019s wicket, the umpire shall call and signal No ball and immediately call and signal Dead ball. However, if the fielder\u2019s action is a deliberate attempt to obstruct the striker from playing the ball, Law 41.4 shall apply."}, {"num": "21.10", "title": "Call of No ball for infringement of other Laws", "body": "In addition to the instances above, No ball is to be called and signalled as required by the following Laws. Law 27.3 \u2013 Position of wicket-keeper Law 28.4 \u2013 Limitation of on side fielders Law 28.5 \u2013 Fielders not to encroach on pitch Law 41.6 \u2013 Bowling of dangerous and unfair short pitched deliveries Law 41.7 \u2013 Bowling of dangerous and unfair non-pitching deliveries Law 41.8 \u2013 Bowling of deliberate front foot No ball."}, {"num": "21.11", "title": "Revoking a call of No ball", "body": "21.11.1 An umpire shall revoke the call of No ball if Dead ball is called under any of Laws 20.4.2.4, 20.4.2.5, 20.4.2.8 or 20.4.2.10 (Umpire calling and signalling Dead ball), or if, for any other reason, the ball was deemed to be Dead before the bowler released the ball.\n\n21.11.2 A numpire shall revoke the call of No ball if Dead ball is called under Law 20.4.2.6, unless the No ball is called under 21.6."}, {"num": "21.12", "title": "No ball to override Wide", "body": "A call of No ball shall override the call of Wide ball at any time. See Laws 22.1 (Judging a Wide) and 22.2 (Call and signal of Wide ball)."}, {"num": "21.13", "title": "Ball not dead", "body": "The ball does not become dead on the call of No ball."}, {"num": "21.14", "title": "Penalty for a No ball", "body": "A penalty of one run shall be awarded instantly on the call of No ball. Unless the call is revoked, the penalty shall stand even if a batter is dismissed. It shall be in addition to any other runs scored, any boundary allowance and any other runs awarded for penalties."}, {"num": "21.15", "title": "Runs resulting from a No ball \u2013 how scored", "body": "The one-run penalty shall be scored as a No ball extra and shall be debited against the bowler. If other Penalty runs have been awarded to either side these shall be scored as stated in Law 41.17 (Penalty runs). Any runs completed by the batters or any boundary allowance shall be credited to the striker if the ball has been struck by the bat; otherwise they shall also be scored as Byes or Leg byes as appropriate."}, {"num": "21.16", "title": "No ball not to count", "body": "A No ball shall not count as one of the over. See Law 17.3 (Validity of balls)."}, {"num": "21.17", "title": "Out from a No ball", "body": "When No ball has been called, neither batter shall be out under any of the Laws except 34 (Hit the ball twice), 37 (Obstructing the field) or 38 (Run out)."}]}, {"num": 22, "title": "Wide ball", "subs": [{"num": "22.1", "title": "Judging a Wide", "body": "22.1.1 If the bowler bowls a ball, not being a No ball, the umpire shall adjudge it a Wide if, according to the definitions in\n\n22.1.2 and 22.1.3, the ball passes wide of where the striker is standing or has stood at any point after the ball came into play for that delivery, and which also would have passed wide of the striker standing in a normal batting position.\n\n22.1.2 The ball will be considered as passing wide of the striker unless it is sufficiently within reach for the striker to be able to hit it with the bat by means of a normal cricket stroke.\n\n22.1.3 The ball will be considered as passing wide of the striker if any delivery, after landing, passes or would have passed over head height of the striker standing upright at the popping crease."}, {"num": "22.2", "title": "Call and signal of Wide ball", "body": "If the umpire adjudges a delivery to be a Wide they shall call and signal Wide ball as soon as the ball passes the striker\u2019s wicket. It shall, however, be considered to have been a Wide from the instant that the bowler entered their delivery stride, even though it cannot be called Wide until it passes the striker\u2019s wicket."}, {"num": "22.3", "title": "Revoking a call of Wide ball", "body": "22.3.1 The umpire shall revoke the call of Wide ball if there is any contact between the ball and the striker\u2019s bat or person before the ball comes into contact with any fielder.\n\n22.3.2 The umpire shall revoke the call of Wide ball if a delivery is called a No ball. See Law 21.12 (No ball to override Wide)."}, {"num": "22.4", "title": "Delivery not a Wide", "body": "22.4.1 The umpire shall not adjudge a delivery as being a Wide, if the striker, by moving, either causes the ball to pass wide of the striker, as defined in 22.1.2 or brings the ball sufficiently within reach to be able to hit it by means of a normal cricket stroke.\n\n22.4.2 The umpire shall not adjudge a delivery as being a Wide if the ball touches the striker\u2019s bat or person, but only as the ball passes the striker."}, {"num": "22.5", "title": "Ball not dead", "body": "The ball does not become dead on the call of Wide ball."}, {"num": "22.6", "title": "Penalty for a Wide", "body": "A penalty of one run shall be awarded instantly on the call of Wide ball. Unless the call is revoked, under 22.3, this penalty shall stand even if a batter is dismissed, and shall be in addition to any other runs scored, any boundary allowance and any other runs awarded for penalties."}, {"num": "22.7", "title": "Runs resulting from a Wide \u2013 how scored", "body": "All runs completed by the batters or a boundary allowance, together with the penalty for the Wide, shall be scored as Wide balls. Apart from any award of 5 Penalty runs, all runs resulting from a Wide shall be debited against the bowler."}, {"num": "22.8", "title": "Wide not to count", "body": "A Wide shall not count as one of the over. See Law 17.3 (Validity of balls)."}, {"num": "22.9", "title": "Out from a Wide", "body": "When Wide ball has been called, neither batter shall be out under any of the Laws except 35 (Hit wicket), 37 (Obstructing the field), 38 (Run out) or 39 (Stumped)."}]}, {"num": 23, "title": "Bye and Leg bye", "subs": [{"num": "23.1", "title": "Byes", "body": "If the ball, delivered by the bowler, not being a Wide, passes the striker without touching the striker\u2019s bat or person, any runs completed by the batters from that delivery, or a boundary allowance, shall be credited as Byes to the batting side. Additionally, if the delivery is a No ball, the one-run penalty for such a delivery shall be incurred."}, {"num": "23.2", "title": "Leg byes", "body": "23.2.1 If a ball delivered by the bowler first strikes the person of the striker, runs shall be scored only if the umpire is satisfied that the striker has either attempted to play the ball with the bat or tried to avoid being hit by the ball.\n\n23.2.2 If the umpire is satisfied that either of these conditions has been met runs shall be scored as follows.\n\n23.2.2.1 If there is either no subsequent contact with the striker\u2019s bat or person, or only inadvertent contact with the striker\u2019s bat or person any runs completed by the batters or a boundary allowance shall be credited to the striker in the case of subsequent contact with the bat but otherwise to the batting side as in 23.2.3.\n\n23.2.2.2 I fthe striker wilfully makes a lawful second strike, Laws 34.3 (Ball lawfully struck more than once) and 34.4 (Runs permitted from ball lawfully struck more than once) shall apply.\n\n23.2.3 The runs in 23.2.2.1, unless credited to the striker, shall be scored as Leg byes. Additionally, if the delivery is a No ball, the one-run penalty for the No ball shall be incurred."}, {"num": "23.3", "title": "Leg byes not to be awarded", "body": "If in the circumstance of 23.2.1 the umpire considers that neither of the conditions therein has been met, then Leg byes shall not be awarded. If the ball does not become dead for any other reason, the umpire shall delay the call and signal of Dead ball until the ball reaches the boundary or the completion of the first run. The umpire shall then disallow all runs to the batting side; return any not out batter to their original end; signal No ball to the scorers if applicable; award any 5-run Penalty that is applicable except for Penalty runs under Law 28.3 (Protective helmets belonging to the fielding side)."}]}, {"num": 24, "title": "Fielder's absence; substitutes", "subs": [{"num": "24.1", "title": "Substitute fielders", "body": "24.1.1 The umpires shall allow a substitute fielder\n\n24.1.1.1 i fthey are satisfied that a fielder has been injured or become ill and that this occurred during the match, or\n\n24.1.1.2 for any other wholly acceptable reason. In all other circumstances, a substitute is not allowed.\n\n24.1.2 A substitute shall not bowl or act as captain but may act as wicket-keeper only with the consent of the umpires. Note, however, Law 42.7.1 (Additional points relating to Level 3 and Level 4 offences).\n\n24.1.3 A nominated player may bowl or field even though a substitute has previously acted for them, subject to 24.2, 24.3 and Law 42.4 (Level 3 offences and action by umpires)."}, {"num": "24.2", "title": "Fielder absent or leaving the field of play", "body": "24.2.1 A player going briefly outside the boundary while carrying out any duties as a fielder is not absent from the field of play nor, for the purposes of this Law, are they to be regarded as having left the field of play. A fielder may be outside the boundary when the ball comes into play \u2013 however, all fielders shall be within the boundary at the instant the ball is delivered.\n\n24.2.2 If a fielder fails to take the field at the start of play or at any later time, or leaves the field during play,\n\n24.2.2.1 a numpire shall be informed of the reason for this absence.\n\n24.2.2.2 that fielder shall not thereafter come on to the field of play during a session of play without the consent of the umpire. See 24.4. The umpire shall give such consent as soon as it is practicable.\n\n24.2.2.3 that fielder shall not be permitted to bowl, until having been back on the field of play for a period of time known as Penalty time as described in 24.2.3 to\n\n24.2.7 and 24.3.\n\n24.2.3 A player\u2019s unserved Penalty time shall be limited to a maximum of 90 minutes.\n\n24.2.4 If the player leaves the field before having served all of their Penalty time, the balance is carried forward as unserved Penalty time.\n\n24.2.5 The player shall not bowl until all of their Penalty time has been served. On any occasion of absence, the amount of Playing time for which the player is off the field shall be added to any Penalty time that remains unserved, subject to 24.2.3.\n\n24.2.6 If there is an unscheduled break in play, the stoppage time shall count as Penalty time served, provided that,\n\n24.2.6.1 the fielder who was on the field of play at the start of the break either takes the field on the resumption of play, or their side is now batting.\n\n24.2.6.2 the fielder who was already off the field at the start of the break notifies an umpire in person as soon as they are able to participate, and either takes the field on the resumption of play, or their side is now batting. Stoppage time before an umpire has been so notified shall not count towards unserved Penalty time.\n\n24.2.7 Any unserved Penalty time shall be carried forward into the next and subsequent days and innings of the match, as applicable.\n\n24.2.8 If a Level 3 offence under Law 42.4 (Level 3 offences and action by umpires) is committed by a fielder, the period of time spent off the field of play as a result of the suspension shall not be added to any unserved Penalty time if the fielder takes the field at the end of the period of suspension. Any time off the field for an unscheduled break in play shall not count as Penalty time served, unless the player had served the whole of their suspension at the start of that unscheduled break and returns to the field immediately on the resumption of play, or their side is now batting.\n\n24.2.9 If a Level 3 offence under Law 42.4 (Level 3 offences and action by umpires) is committed by a substitute, the following shall apply.\n\n24.2.9.1 The period of time spent off the field as a result of the suspension shall not be added to any Penalty time that remains unserved if the nominated player takes the field at the end of the period of suspension. However, any time spent off the field prior to the offence causing the suspension will remain as unserved Penalty time, subject to 24.2.3.\n\n24.2.9.2 I fthe nominated player does not take the field at the end of the period of suspension, then the entire period of their absence will be treated as Penalty time, up to a maximum of 90 minutes."}, {"num": "24.3", "title": "Penalty time not incurred", "body": "A nominated player\u2019s absence will not incur Penalty time if\n\n24.3.1 the player has suffered an external blow during the match and, as a result, has justifiably left the field or is unable to take the field.\n\n24.3.2 in the opinion of the umpires, the player has been absent or has left the field for other wholly acceptable reasons, which shall not include illness or internal injury."}, {"num": "24.4", "title": "Player returning without permission", "body": "If a player comes on to the field of play in contravention of\n\n24.2.2 and comes into contact with the ball while it is in play, the ball shall immediately become dead. The umpires shall signal No ball or Wide to the scorers, if applicable. The umpire shall award 5 Penalty runs to the batting side. Runs completed by the batters shall be scored together with the run in progress if they had already crossed at the instant of the offence. The ball shall not count as one of the over. The umpire shall inform the other umpire, the captain of the fielding side, the batters and, as soon as practicable, the captain of the batting side of the reason for this action. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}]}, {"num": 25, "title": "Batter's innings; runners", "subs": [{"num": "25.1", "title": "Eligibility to act as a batter or runner", "body": "Only a nominated player may bat or act as a runner and, subject to 25.3 and 25.5.2, may do so even though a substitute fielder has previously acted for that player."}, {"num": "25.2", "title": "Commencement of a batter\u2019s innings", "body": "The innings of the first two batters, and that of any new batter on the resumption of play after a call of Time, shall commence at the call of Play. At any other time, a batter\u2019s innings shall be considered to have commenced when that batter first steps onto the field of play."}, {"num": "25.3", "title": "Restriction on batter commencing an innings", "body": "25.3.1 If a member of the batting side has unserved Penalty time, see Law 24.2.7 (Fielder absent or leaving the field of play), that player shall not be permitted to bat or act as a runner until that Penalty time has been served. However, even if the unserved Penalty time has not expired, that player may bat after their side has lost 5 wickets.\n\n25.3.2 A member of the batting side\u2019s Penalty time is served during Playing time, subject to the conditions in 25.3.2.1 and 25.3.2.2.\n\n25.3.2.1 The period of time while serving a suspension for a Level 3 offence under Law 42.4 (Level 3 offences and action by umpires) does not count as Penalty time served.\n\n25.3.2.2 I nthe event of an unscheduled stoppage, the stoppage time after the batter notifies an umpire in person that they are able to participate shall count as Penalty time served.\n\n25.3.3 I fany unserved Penalty time remains at the end of a team\u2019s innings, it shall be carried forward to the next and subsequent innings of the match if appropriate."}, {"num": "25.4", "title": "Batter retiring", "body": "25.4.1 A batter may retire at any time during their innings when the ball is dead. The umpires, before allowing play to proceed, shall be informed of the reason for a batter retiring.\n\n25.4.2 If a batter retires because of illness, injury or any other unavoidable cause, that batter is entitled to resume their innings. If for any reason this does not happen, that batter is to be recorded as \u2018Retired \u2013 not out\u2019.\n\n25.4.3 If a batter retires for any reason other than as in 25.4.2, the innings of that batter may be resumed only with the consent of the opposing captain. If for any reason their innings is not resumed, that batter is to be recorded as \u2018Retired - out\u2019.\n\n25.4.4 If after retiring a batter resumes their innings, subject to the requirements of 25.4.2 and 25.4.3, it shall be only at the fall of a wicket or the retirement of another batter."}, {"num": "25.5", "title": "Runners", "body": "25.5.1 The umpires shall allow a runner for a batter if they are satisfied\n\n25.5.1.1 that the batter has sustained an injury that affects that batter\u2019s ability to run and that this occurred during the match.\n\n25.5.1.2 for any other wholly acceptable reason. In all other circumstances, a runner is not allowed.\n\n25.5.2 A runner shall\n\n25.5.2.1 b e a member of the batting side.\n\n25.5.2.2 i fpossible, have already completed their innings; when this is not possible, if circumstances change such that a dismissed batter can act as runner, then the runner must be changed immediately.\n\n25.5.2.3 be changed only with the consent of the umpires.\n\n25.5.2.4 wear external protective equipment equivalent to that worn by the injured batter and shall carry a bat.\n\n25.5.2.5 not have any unserved Penalty time as described in Law 24.2.7 (Fielder absent or leaving the field of play).\n\n25.5.3 A batter\u2019s runner is subject to the Laws and will be regarded as a batter except where there are special provisions for the role of a runner. See Law 30.2 (Which is a batter\u2019s ground)."}, {"num": "25.6", "title": "Dismissal and conduct of a batter and their runner", "body": "25.6.1 A batter who has a runner will suffer the penalty for any infringement of the Laws by the runner as if the batter themself had been responsible for the infringement. In particular, the batter will be out if the runner is out under either of Laws 37 (Obstructing the field) or 38 (Run out).\n\n25.6.2 When a batter who has a runner is the striker they remain subject to the Laws and will be liable to the penalties that any infringement of them demands. In the case of Run out and Stumped, however, special provisions, set out in 25.6.3,\n\n25.6.4 and 25.6.5, apply to them as a striker who has a runner.\n\n25.6.3 When a batter who has a runner is the striker, that batter\u2019s ground is always at the wicket-keeper\u2019s end.\n\n25.6.4 If the striker who has a runner is in their ground, and the runner is out of their ground at the wicket-keeper\u2019s end when the wicket is fairly broken at that end, the conditions of Law 38 (Run out) shall apply.\n\n25.6.5 If the striker who has a runner is out of their ground and the wicket at the wicket-keeper\u2019s end is fairly broken, the striker is liable to be out under Laws 38 (Run out) or 39 (Stumped), unless a result has already been reached under Law 16.6. If the runner is also out of their ground at the wicket-keeper\u2019s end, then only Law 38 (Run out) can apply.\n\n25.6.6 If a striker who has a runner is dismissed as in 25.6.5, the umpire shall disallow all runs to the batting side return any not out batter to their original end signal No ball or Wide to the scorers if applicable award any 5-run Penalty that is applicable.\n\n25.6.7 When a batter who has a runner is not the striker, the batter\n\n25.6.7.1 remains subject to Law 37 (Obstructing the field) but is otherwise out of the match.\n\n25.6.7.2 shall stand where directed by the striker\u2019s end umpire so as not to interfere with play.\n\n25.6.7.3 will be liable, even though out of the match as in 25.6.7.1, to any penalty demanded by the Laws should the batter commit any act of unfair play."}, {"num": "25.7", "title": "Restriction on the striker\u2019s runner", "body": "25.7.1 Once the ball comes into play, the runner for an injured batter who is the striker shall have part of their person or bat grounded behind the popping crease until the ball reaches the striker or passes the popping crease, whichever is the sooner.\n\n25.7.2 If the striker\u2019s end umpire considers the runner for an injured striker to be in breach of this restriction then runs may not be scored.\n\nIf the ball does not become dead for any other reason, the striker\u2019s end umpire shall delay the call and signal of Dead ball until the ball reaches the boundary or the completion of the first run. However, the striker\u2019s end umpire shall further delay the call of Dead ball to allow the opportunity for a catch to be completed. The bowler\u2019s end umpire shall then: disallow all runs to the batting side return any not out batter to their original end signal No ball or Wide if applicable award any 5-run Penalty that is applicable except for Penalty runs under Law 28.3 (Protective helmets belonging to the fielding side)."}, {"num": "25.8", "title": "Striker\u2019s right to play the ball", "body": "The striker has a right to play the ball, or to make a legitimate second strike, after it has been delivered, without interference from the wicket-keeper or any other fielder. See Law 27.5 (Restrictions on actions of wicket-keeper) and Law 27.6 (Interference with wicket-keeper by striker). However, the striker may only attempt to play the ball if some of their bat or person, whether grounded or raised, remains within the pitch, as defined in Law 6.1 (Area of pitch). Should no part of the striker\u2019s bat or person remain within the pitch, from the moment the ball comes into play until the striker has finished receiving the delivery, either umpire shall immediately call and signal Dead ball."}]}, {"num": 26, "title": "Practice on the field", "subs": [{"num": "26.1", "title": "Practice on the pitch or the rest of the square", "body": "26.1.1 There shall not be any practice on the pitch at any time on any day of the match.\n\n26.1.2 There shall not be any practice on the rest of the square at any time on any day of the match, except with the approval of the umpires."}, {"num": "26.2", "title": "Practice on the outfield", "body": "26.2.1 On any day of the match, all forms of practice are permitted on the outfield before the start of play, after the close of play and during the lunch and tea intervals or between innings, providing the umpires are satisfied that such practice will not cause significant deterioration in the condition of the outfield.\n\n26.2.2 Between the call of Play and the call of Time, practice shall be permitted on the outfield, providing that all of the following conditions are met: only the fielders as defined in Appendix A.7 participate in such practice. no ball other than the match ball is used for this practice. no bowling practice takes place in the area between the square and the boundary in a direction parallel to the match pitch. the umpires are satisfied that it will not contravene either of Laws 41.3 (The match ball \u2013 changing its condition) or 41.9 (Time wasting by the fielding side). If there is such a contravention, the sanctions in Law 41 shall be applied. However, any warning given shall apply to further instances under both Law 26 and Law 41 (Unfair play)."}, {"num": "26.3", "title": "Trial run-up", "body": "A bowler is permitted to have a trial run-up provided the umpire is satisfied that it will not contravene either of Laws 41.9 (Time wasting by the fielding side) or 41.12 (Fielder damaging the pitch)."}, {"num": "26.4", "title": "Penalties for contravention", "body": "All forms of practice are subject to the provisions of Laws 41.3 (The match ball \u2013 changing its condition), 41.9 (Time wasting by the fielding side) and 41.12 (Fielder damaging the pitch).\n\n26.4.1 If there is a contravention of any of the provisions of 26.1 or 26.2, the umpire shall warn the player that the practice is not permitted; inform the other umpire and, as soon as practicable, both captains of the reason for this action.\n\n26.4.1.1 I fthe contravention is by a batter at the wicket, the umpire shall inform the other batter and each incoming batter that the warning has been issued. The warning shall apply to the team of that player throughout the match.\n\n26.4.2 If during the match there is any further contravention by any player of that team, the umpire shall award 5 Penalty runs to the opposing side; inform the other umpire, the scorers and, as soon as practicable, both captains, and, if the contravention is during play, the batters at the wicket.\n\nThe umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}]}, {"num": 27, "title": "The wicket-keeper", "subs": [{"num": "27.1", "title": "Protective equipment", "body": "The wicket-keeper is the only fielder permitted to wear gloves and external leg guards. If these are worn, they are to be regarded as part of the wicket-keeper\u2019s person for the purposes of Law 28.2 (Fielding the ball). If by the wicket- keeper\u2019s actions and positioning when the ball comes into play it is apparent to the umpires that they will not be able to carry out the normal duties of a wicket-keeper, they shall forfeit this right and also the right to be recognised as a wicket-keeper for the purposes of Laws 33.2 (A fair catch), 39 (Stumped), 28.1 (Protective equipment), 28.4 (Limitation of on-side fielders) and 28.5 (Fielders not to encroach on pitch)."}, {"num": "27.2", "title": "Gloves", "body": "27.2.1 I f, as permitted under 27.1, the wicket-keeper wears gloves, they shall have no webbing between the fingers except joining index finger and thumb, where webbing may be inserted as a means of support.\n\n27.2.2 If used, the webbing shall be a single piece of non-stretch material which, although it may have facing material attached, shall have no reinforcements or tucks.\n\n27.2.3 The top edge of the webbing shall not protrude beyond the straight line joining the top of the index finger to the top of the thumb and shall be taut when a hand wearing the glove has the thumb fully extended. See Appendix E."}, {"num": "27.3", "title": "Position of wicket-keeper", "body": "27.3.1 The wicket-keeper shall remain wholly behind the wicket at the striker\u2019s end from the instant of the bowler\u2019s delivery until a ball delivered by the bowler touches the bat or person of the striker or passes the wicket at the striker\u2019s end or the striker attempts a run.\n\n27.3.2 In the event of the wicket-keeper contravening this Law, the striker\u2019s end umpire shall call and signal No ball as soon as applicable after the delivery of the ball."}, {"num": "27.4", "title": "Movement by wicket-keeper", "body": "27.4.1 After the ball comes into play and before it reaches the striker, it is unfair if the wicket-keeper significantly alters their position in relation to the striker\u2019s wicket, except for the following:\n\n27.4.1.1 movement of a few paces forward unless in so doing it brings the wicket-keeper within reach of the wicket.\n\n27.4.1.2 lateral movement in response to the direction in which the ball has been delivered.\n\n27.4.1.3 movement in response to the stroke that the striker is playing or that the striker\u2019s actions suggest they intend to play. However the provisions of Law 27.3 shall apply.\n\n27.4.2 In the event of unfair movement by the wicket-keeper, either umpire shall call and signal Dead ball and inform the other umpire of the reason for doing so. The bowler\u2019s end umpire shall then:\n\n27.4.2.1 a ward the one-run penalty for Wide or No ball, if applicable\n\n27.4.2.2 award 5 Penalty runs to the batting side\n\n27.4.2.3 i nform the captain of the fielding side of the reason for this action\n\n27.4.2.4 i nform the batters and, as soon as practicable, the captain of the batting side of what has occurred. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "27.5", "title": "Restriction on actions of wicket-keeper", "body": "If, in the opinion of either umpire, the wicket-keeper interferes with the striker\u2019s right to play the ball, Law\n\n20.4.2.6 (Umpire calling and signalling Dead ball) shall apply. However, if the wicket-keeper, or any other fielder, interferes with a legal second strike, either umpire shall call and signal Dead ball and the striker will not be dismissed, but the ball shall count as one for the over. If, however, either umpire considers that the interference by the wicket-keeper was wilful, then Law 41.4 (Deliberate attempt to distract or obstruct striker) shall also apply."}, {"num": "27.6", "title": "Interference with wicket-keeper by striker", "body": "If, in playing at the ball or in the legitimate defence of their wicket, the striker interferes with the wicket-keeper, the striker shall not be out except as provided for in Law 37.3 (Obstructing a ball from being caught)."}]}, {"num": 28, "title": "The fielder", "subs": [{"num": "28.1", "title": "Protective equipment", "body": "No fielder other than the wicket-keeper shall be permitted to wear gloves or external leg guards. In addition, protection for the hand or fingers may be worn only with the consent of the umpires."}, {"num": "28.2", "title": "Fielding the ball", "body": "28.2.1 A fielder may field the ball with any part of their person (see Appendix A.12), except as in 28.2.1.2. However, the fielder will be deemed to have fielded the ball illegally if, while the ball is in play\n\n28.2.1.1 they wilfully use anything other than part of their person to field the ball.\n\n28.2.1.2 they wilfully extend their clothing with their hands and use this to field the ball.\n\n28.2.1.3 any piece of clothing, equipment or any other object, which had been deliberately discarded, subsequently makes contact with the ball.\n\n28.2.2 It is not illegal fielding if the ball in play makes contact with a piece of clothing, equipment or any other object which has accidentally fallen from the fielder\u2019s person or been dropped by an umpire.\n\n28.2.3 If a fielder illegally fields the ball, the ball shall immediately become dead and the penalty for a No ball or a Wide shall stand. any runs completed by the batters shall be credited to the batting side, together with the run in progress if the batters had already crossed at the instant of the offence. the ball shall not count as one of the over. In addition the umpire shall award 5 Penalty runs to the batting side. inform the other umpire and the captain of the fielding side of the reason for this action. inform the batters and, as soon as practicable, the captain of the batting side of what has occurred. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team."}, {"num": "28.3", "title": "Protective helmets belonging to the fielding side", "body": "28.3.1 Protective helmets, when not in use by fielders, may not be placed on the ground, above the surface except behind the wicket-keeper and in line with both sets of stumps.\n\n28.3.2 If the ball while in play strikes the protective helmet, placed as described in 28.3.1, the ball shall immediately become dead and, unless 28.3.3 applies: the umpire shall signal No ball or Wide to the scorers, if applicable the umpire shall award 5 Penalty runs to the batting side any runs completed by the batters before the ball strikes the protective helmet shall be scored, together with the run in progress if the batters had already crossed at the instant of the ball striking the protective helmet.\n\n28.3.3 If the ball while in play strikes a helmet, placed as described in 28.3.1 and the circumstances of Law 23.3 (Leg byes not to be awarded), 25.7 (Restriction on the striker\u2019s runner) or Law 34 (Hit the ball twice) apply, the umpire shall disallow all runs to the batting side return any not out batter to their original end signal No ball or Wide ball to the scorers if applicable award any 5-run Penalty that is applicable except for Penalty runs under 28.3.2."}, {"num": "28.4", "title": "Limitation of on side fielders", "body": "At the instant of the bowler\u2019s delivery there shall not be more than two fielders, other than the wicket-keeper, behind the popping crease on the on side. A fielder will be considered to be behind the popping crease unless the whole of that fielder\u2019s person whether grounded or in the air is in front of this line. In the event of infringement of this Law by any fielder, the striker\u2019s end umpire shall call and signal No ball."}, {"num": "28.5", "title": "Fielders not to encroach on pitch", "body": "While the ball is in play and until the ball has made contact with the striker\u2019s bat or person, or has passed the striker\u2019s bat, no fielder, other than the bowler, may have any part of their person grounded on or extended over the pitch. In the event of infringement of this Law by any fielder other than the wicket-keeper, the bowler\u2019s end umpire shall call and signal No ball as soon as possible after delivery of the ball. Note, however, Law 27.3 (Position of wicket-keeper)."}, {"num": "28.6", "title": "Movement by any fielder other than the wicket-keeper", "body": "28.6.1 Any movement by any fielder, excluding the wicket-keeper, after the ball comes into play and before the ball reaches the striker, is unfair except for the following:\n\n28.6.1.1 minor adjustments to stance or position in relation to the striker\u2019s wicket.\n\n28.6.1.2 movement by any fielder, other than a close fielder, towards the striker or the striker\u2019s wicket that does not significantly alter the position of the fielder.\n\n28.6.1.3 movement by any fielder in response to the stroke that the striker is playing or that the striker\u2019s actions suggest they intend to play.\n\n28.6.2 In all circumstances Law 28.4 (Limitation of on side fielders) shall apply.\n\n28.6.3 In the event of such unfair movement, either umpire shall call and signal Dead ball and inform the other umpire of the reason for doing so. The bowler\u2019s end umpire shall then:\n\n28.6.3.1 a ward the one-run penalty for Wide or No ball, if applicable\n\n28.6.3.2 award 5 Penalty runs to the batting side\n\n28.6.3.3 i nform the captain of the fielding side of the reason for this action.\n\n28.6.3.4 i nform the batters and, as soon as practicable, the captain of the batting side of what has occurred. The umpires together shall report the occurrence as soon as possible after the match to the Executive of the offending side and to any Governing Body responsible for the match, who shall take such action as is considered appropriate against the captain, any other individuals concerned and, if appropriate, the team.\n\n28.6.4 Note also the provisions of Law 41.4 (Deliberate attempt to distract or obstruct striker). See also Law 27.4 (Movement by wicket-keeper)."}]}, {"num": 29, "title": "The wicket is broken", "subs": [{"num": "29.1", "title": "The wicket is broken", "body": "The wicket is broken when at least one bail is completely removed from the top of the stumps, or one or more stumps is removed from the ground."}, {"num": "29.2", "title": "Breaking the wicket fairly", "body": "29.2.1 The wicket is broken fairly if a bail is completely removed from the top of the stumps, or a stump is struck out of the ground,\n\n29.2.1.1 by the ball,\n\n29.2.1.2 by the striker\u2019s bat if held or by any part of the bat that they are holding,\n\n29.2.1.3 for the purpose of this Law only, by the striker\u2019s bat not in hand, or by any part of the bat which has become detached,\n\n29.2.1.4 by the striker\u2019s person or by any part of their clothing or equipment becoming detached from their person. However, any detached equipment shall not include the striker\u2019s protective helmet, or any part thereof, as defined in Appendix A.2.3, 29.2.1.5 b y a fielder with their hand or arm, providing that the ball is held in the hand or hands so used, or in the hand of the arm so used.\n\n29.2.1.6 The wicket is also broken fairly if a fielder strikes or pulls a stump out of the ground as in 29.2.1.5.\n\n29.2.2 The disturbance of a bail, whether temporary or not, shall not constitute its complete removal from the top of the stumps, but if a bail in falling lodges between two of the stumps this shall be regarded as complete removal."}, {"num": "29.3", "title": "One bail off", "body": "If one bail is off, it shall be sufficient for the purpose of breaking the wicket to remove the remaining bail or to strike or pull any of the three stumps out of the ground, in any of the ways stated in 29.2."}, {"num": "29.4", "title": "Remaking wicket", "body": "If a wicket is broken while the ball is in play, it shall not be remade by an umpire until the ball is dead. See Law 20 (Dead ball). Any fielder may, however, while the ball is in play, replace a bail or bails on top of the stumps. put back one or more stumps into the ground where the wicket originally stood."}, {"num": "29.5", "title": "Dispensing with bails", "body": "If the umpires have agreed to dispense with bails in accordance with Law 8.5 (Dispensing with bails), it is for the umpire concerned to decide whether or not the wicket has been broken.\n\n29.5.1 After a decision to play without bails, the wicket has been broken fairly if the umpire concerned is satisfied that the wicket has been struck by the ball, by the striker\u2019s bat, person or items of the striker\u2019s clothing or equipment as described in 29.2.1.2, 29.2.1.3 or 29.2.1.4, or by a fielder in the manner described in 29.2.1.5.\n\n29.5.2 If the wicket has already been broken, 29.5.1 shall apply to any stump or stumps still in the ground. Any fielder may replace a stump or stumps, in accordance with 29.4, in order to have an opportunity of breaking the wicket fairly."}]}, {"num": 30, "title": "Batter out of their ground", "subs": [{"num": "30.1", "title": "When out of their ground", "body": "30.1.1 A batter shall be considered to be out of their ground unless some part of that batter\u2019s person or bat is grounded behind the popping crease at that end.\n\n30.1.2 However, a batter shall not be considered to be out of their ground if, in running or diving towards that ground and beyond, and having grounded some part of their person or bat beyond the popping crease, there is subsequent loss of contact between the ground and any part of that batter\u2019s person or bat, or between the bat and person."}, {"num": "30.2", "title": "Which is a batter\u2019s ground", "body": "30.2.1 If only one batter is within a ground, it is their ground and will remain so even if that batter is later joined there by the other batter.\n\n30.2.2 If both batters are in the same ground and one of them subsequently leaves it, the ground belongs to the batter who remains in it.\n\n30.2.3 If there is no batter in either ground, then each ground belongs to whichever batter is nearer to it, or, if the batters are level, to whichever batter was nearer to it immediately prior to their drawing level.\n\n30.2.4 If a ground belongs to one batter then, unless there is a striker who has a runner, the other ground belongs to the other batter, irrespective of the other batter\u2019s position.\n\n30.2.5 When a batter who has a runner is striker, that batter\u2019s ground is always at the wicket-keeper\u2019s end. However, 30.2.1, 30.2.2, 30.2.3 and 30.2.4 will still apply, but only to the runner and the non-striker, so that that ground will also belong to either the non-striker or the runner, as the case may be."}, {"num": "30.3", "title": "Position of non-striker", "body": "The non-striker, when standing at the bowler\u2019s end, should be positioned on the opposite side of the wicket to that from which the ball is being delivered, unless a request to do otherwise is granted by the umpire."}]}, {"num": 31, "title": "Appeals", "subs": [{"num": "31.1", "title": "Umpire not to give batter out without an appeal", "body": "Neither umpire shall give a batter out, even though that batter may be out under the Laws, unless appealed to by a fielder. This shall not debar a batter who is out under any of the Laws from leaving the wicket without an appeal having been made. Note, however, the provisions of 31.7."}, {"num": "31.2", "title": "Batter dismissed", "body": "A batter is dismissed if they are either given out by an umpire, on appeal or out under any of the Laws and leaves the wicket as in 31.1."}, {"num": "31.3", "title": "Timing of appeals", "body": "For an appeal to be valid, it must be made before the bowler begins their run up to deliver the next ball, or, if the bowler has no run up, the bowler begins their action to deliver the next ball, and before Time has been called. The call of Over does not invalidate an appeal made prior to the start of the following over, provided Time has not been called. See Laws 12.2 (Call of Time) and 17.2 (Start of an over)."}, {"num": "31.4", "title": "Appeal \u201cHow\u2019s That?\u201d", "body": "An appeal \u201cHow\u2019s That?\u201d covers all ways of being out."}, {"num": "31.5", "title": "Answering appeals", "body": "The striker\u2019s end umpire shall answer all appeals arising out of any of Laws 35 (Hit wicket), 39 (Stumped) or 38 (Run out) when this occurs at the wicket-keeper\u2019s end. The bowler\u2019s end umpire shall answer all other appeals. When an appeal is made, each umpire shall answer on any matter that falls within that umpire\u2019s jurisdiction. When a batter has been given Not out, either umpire may When a batter has been given Not out, either umpire may answer an appeal, made in accordance with 31.3, if it is on a further matter and is within the jurisdiction of that umpire."}, {"num": "31.6", "title": "Consultation by umpires", "body": "Each umpire shall answer appeals on matters within their own jurisdiction. If an umpire is doubtful about any point that the other umpire may have been in a better position to see, they shall consult the latter on this point of fact and shall then give the decision. If, after consultation, there is still doubt remaining, the decision shall be Not out."}, {"num": "31.7", "title": "Batter leaving the wicket under a misapprehension", "body": "Either umpire shall call and signal Dead ball if satisfied that a batter, not having been given out, has left the wicket under a reasonable misapprehension of being out. The umpire shall recall the batter. A batter may be recalled at any time up to the instant when the ball comes into play for the next delivery, unless it is the final wicket of the innings, in which case it should be up to the instant when the umpires leave the field."}, {"num": "31.8", "title": "Withdrawal of an appeal", "body": "The captain of the fielding side may withdraw an appeal only after obtaining the consent of the umpire within whose jurisdiction the appeal falls. If such consent is given, the umpire concerned shall, if applicable, revoke the decision and recall the batter. The withdrawal of an appeal must be before the instant when the ball comes into play for the next delivery or, if the innings has been completed, the instant when the umpires leave the field."}]}, {"num": 32, "title": "Bowled", "subs": [{"num": "32.1", "title": "Out Bowled", "body": "32.1.1 The striker is out Bowled if their wicket is broken by a ball delivered by the bowler, not being a No ball, even if it first touches the striker\u2019s bat or person.\n\n32.1.2 However, the striker shall not be out Bowled if before striking the wicket the ball has been in contact with any other player, the wicket at the non-striker\u2019s end, or an umpire. The striker will, however, be subject to Laws 37 (Obstructing the field), 38 (Run out) and 39 (Stumped)."}, {"num": "32.2", "title": "Bowled to take precedence", "body": "The striker is out Bowled if their wicket is broken as in 32.1, even though a decision against either batter for any other method of dismissal would be justified."}]}, {"num": 33, "title": "Caught", "subs": [{"num": "33.1", "title": "Out Caught", "body": "The striker is out Caught if a ball delivered by the bowler, not being a No ball, touches the striker\u2019s bat without having previously been in contact with any fielder, and is subsequently held by a fielder as a fair catch, as described in 33.2 and 33.3, before it touches the ground."}, {"num": "33.2", "title": "A fair catch", "body": "33.2.1 A catch will be fair only if, in every case either the ball, at any time or any fielder in contact with the ball, is not grounded beyond the boundary before the catch is completed. Note Laws 19.4 (Ball grounded beyond the boundary) and 19.5 (Fielder grounded beyond the boundary).\n\n33.2.2 Furthermore, a catch will be fair if any of the following conditions applies:\n\n33.2.2.1 the ball is held in the hand or hands of a fielder, even if the hand holding the ball is touching the ground, or is hugged to the body, or lodges in the external protective equipment worn by a fielder, or lodges accidentally in a fielder\u2019s clothing.\n\n33.2.2.2 a fielder catches the ball after it has been lawfully struck more than once by the striker, but only if it has not been grounded since it was first struck. For the purposes of this Law, a strike is defined as any contact between the ball and the bat or person, provided at least one such strike is on the bat. See Law 34 (Hit the ball twice).\n\n33.2.2.3 a fielder catches the ball after it has touched the wicket, an umpire, another fielder, a runner or the other batter.\n\n33.2.2.4 a fielder catches the ball after it has crossed the boundary in the air, provided that the conditions in\n\n33.2.1 are met.\n\n33.2.2.5 the ball is caught off an obstruction within the boundary that is not designated a boundary by the umpires."}, {"num": "33.3", "title": "Making a catch", "body": "The act of making a catch shall start from the time when the ball first comes into contact with a fielder\u2019s person and shall end when a fielder obtains complete control over both the ball and their own movement."}, {"num": "33.4", "title": "No runs to be scored", "body": "If the striker is dismissed Caught, runs from that delivery completed by the batters before the completion of the catch shall not be scored but any runs for penalties awarded to either side shall stand. The non-striker shall return to their original end. See Law 18.11 (Batter returning to original end)."}, {"num": "33.5", "title": "Caught to take precedence", "body": "If the criteria of 33.1 are met and the striker is not out Bowled, then the striker is out Caught, even though a decision against either batter for another method of dismissal would be justified."}]}, {"num": 34, "title": "Hit the ball twice", "subs": [{"num": "34.1", "title": "Out Hit the ball twice", "body": "34.1.1 The striker is out Hit the ball twice if, while the ball is in play, it strikes any part of the striker\u2019s person or is struck by their bat and, before the ball has been touched by a fielder, the striker wilfully strikes it again with their bat or person, other than a hand not holding the bat, except for the sole purpose of guarding their wicket. See 34.3 and Law 37 (Obstructing the field).\n\n34.1.2 For the purpose of this Law \u2018struck\u2019 or \u2018strike\u2019 shall include contact with the person of the striker.\n\n34.1.3 This Law will apply whether or not No ball is called."}, {"num": "34.2", "title": "Not out Hit the ball twice", "body": "The striker will not be out under this Law if\n\n34.2.1 the striker strikes the ball a second or subsequent time in order to return the ball to any fielder. Note, however, the provisions of Law 37.4 (Returning the ball to a fielder).\n\n34.2.2 the striker wilfully strikes the ball after it has touched a fielder. Note, however the provisions of Law 37.1 (Out Obstructing the field)."}, {"num": "34.3", "title": "Ball lawfully struck more than once", "body": "The striker may, solely in order to guard their wicket and before the ball has been touched by a fielder, lawfully strike the ball a second or subsequent time with the bat, or with any part of their person other than a hand not holding the bat. The striker may guard their wicket even if the delivery is a No ball. However, the striker may not prevent the ball from being caught by striking the ball more than once in defence of their wicket. See Law 37.3 (Obstructing a ball from being caught). If any fielder interferes with a legal second strike, either umpire shall call and signal Dead ball and the striker will not be dismissed, but the ball shall count as one for the over."}, {"num": "34.4", "title": "Runs permitted from ball lawfully struck more than once", "body": "When the ball is lawfully struck more than once, as permitted in 34.3, runs may not be scored. If the ball does not become dead for any other reason, the umpire shall delay the call and signal of Dead ball until the ball reaches the boundary or the completion of the first run.\n\nHowever, the umpire shall further delay the call of Dead ball to allow the opportunity for a catch to be completed. The umpire shall disallow all runs to the batting side return any not out batter to their original end signal No ball to the scorers if applicable. award any 5-run Penalty that is applicable except for Penalty runs under Law 28.3 (Protective helmets belonging to the fielding side)."}, {"num": "34.5", "title": "Bowler does not get credit", "body": "The bowler does not get credit for the wicket."}]}, {"num": 35, "title": "Hit wicket", "subs": [{"num": "35.1", "title": "Out Hit wicket", "body": "35.1.1 The striker is out Hit wicket if, after the bowler has entered the delivery stride and while the ball is in play, the striker\u2019s wicket is broken by either the striker\u2019s bat or person as described in Laws 29.2.1.2 to 29.2.1.4 (Breaking the wicket fairly) in any of the following circumstances:\n\n35.1.1.1 i nthe course of any action taken by the striker in preparing to receive or in receiving a delivery,\n\n35.1.1.2 as a result of any movement that is an attempt to recover their balance after receiving a delivery,\n\n35.1.1.3 i nsetting off for the first run immediately after playing or playing at the ball,\n\n35.1.1.4 i fno attempt is made to play the ball, in setting off for the first run, providing that in the opinion of the umpire this is immediately after the striker has had the opportunity of playing the ball, 35.1.1.5 i nlawfully making a second or further stroke for the purpose of guarding their wicket within the provisions of Law 34.3 (Ball lawfully struck more than once).\n\n35.1.2 If the striker breaks their wicket in any of the ways described in Laws 29.2.1.2 to 29.2.1.4 (Breaking the wicket fairly) before the bowler has entered the delivery stride, either umpire shall call and signal Dead ball."}, {"num": "35.2", "title": "Not out Hit wicket", "body": "The striker is not out under this Law should their wicket be broken in any of the ways referred to in 35.1 if any of the following applies: it occurs after the striker has completed any action in receiving the delivery, other than in 35.1.1.2 to 35.1.1.4. the wicket is broken by a part of the striker\u2019s detached equipment or bat not held in the hand, which has come into contact with any other person before breaking the wicket. the wicket is broken by the striker\u2019s person, or bat held in the hand, as a direct consequence of contact with a member of the fielding side. it occurs when the striker is in the act of running, other than setting off immediately for the first run. it occurs when the striker is trying to avoid being Run out or Stumped. it occurs when the striker is trying to avoid a throw in at any time.\n\nthe bowler after entering the delivery stride does not deliver the ball. In this case either umpire shall immediately call and signal Dead ball. See Law 20.4 (Umpire calling and signalling Dead ball). the delivery is a No ball."}, {"num": "35.3", "title": "Runs scored", "body": "No runs shall be scored when the striker is dismissed Hit wicket other than the one-run penalty for a Wide and any award of 5 Penalty Runs."}]}, {"num": 36, "title": "Leg before wicket", "subs": [{"num": "36.1", "title": "Out LBW", "body": "The striker is out LBW if all the circumstances set out in\n\n36.1.1 to 36.1.5 apply.\n\n36.1.1 The bowler delivers a ball, not being a No ball\n\n36.1.2 the ball, if it is not intercepted without landing, first lands in line between wicket and wicket or on the off side of the striker\u2019s wicket\n\n36.1.3 the ball not having previously touched the bat, the striker intercepts the ball, either with or without landing, with any part of their person\n\n36.1.4 the point of impact, even if above the level of the bails, either is between wicket and wicket or i fthe striker has made no genuine attempt to play the ball with the bat, is between wicket and wicket or outside the line of the off stump.\n\n36.1.5 but for the interception, the ball would have hit the wicket."}, {"num": "36.2", "title": "Interception of the ball", "body": "36.2.1 In assessing points in 36.1.3, 36.1.4 and 36.1.5, only the first interception is to be considered.\n\n36.2.2 In assessing point 36.1.3, if the ball makes contact with the striker\u2019s person and bat simultaneously, this shall be considered as the ball having first touched the bat.\n\n36.2.3 In assessing point 36.1.5, it is to be assumed that the path of the ball before interception would have continued after interception, irrespective of whether the ball might have landed subsequently or not."}, {"num": "36.3", "title": "Off side of wicket", "body": "The off side of the striker\u2019s wicket shall be determined by the striker\u2019s batting position at the moment the ball comes into play for that delivery. See Appendix A.13."}]}, {"num": 37, "title": "Obstructing the field", "subs": [{"num": "37.1", "title": "Out Obstructing the field", "body": "37.1.1 Either batter is out Obstructing the field if, except in the circumstances of 37.2, and while the ball is in play, that batter wilfully attempts to obstruct or distract the fielding side by word or action. See also Law 34 (Hit the ball twice).\n\n37.1.2 The striker is out Obstructing the field if, except in the circumstances of 37.2, in the act of receiving a ball delivered by the bowler, the striker wilfully strikes the ball with a hand not holding the bat. This will apply whether it is the first strike or a second or subsequent strike. The act of receiving the ball shall extend both to playing at the ball and to striking the ball more than once in defence of their wicket.\n\n37.1.3 The striker is out Obstructing the field if, while receiving the ball, they deliberately drop or throw the bat in an attempt to either impact the ball or prevent any dismissal except Hit wicket.\n\n37.1.4 This Law will apply whether or not No ball is called."}, {"num": "37.2", "title": "Not out Obstructing the field", "body": "A batter shall not be out Obstructing the field if obstruction or distraction is accidental, or obstruction is in order to avoid injury, or the striker, makes a second or subsequent strike to guard their wicket lawfully as in Law 34.3 (Ball lawfully struck more than once). However, see 37.3."}, {"num": "37.3", "title": "Obstructing a ball from being caught", "body": "37.3.1 If the delivery is not a No ball, the striker is out Obstructing the field if wilful obstruction or distraction by either batter prevents the striker being out Caught.\n\n37.3.2 37.3.1 shall apply even if an obstruction is caused by the striker in lawfully guarding their wicket under the provision of Law 34.3 (Ball lawfully struck more than once).\n\n37.3.3 If an obstruction or distraction takes place from a No ball then the batter who caused the obstruction or distraction will be out Obstructing the field. However, the striker is not out if the obstruction of a catch occurs while defending their wicket from a No ball with a lawful second strike."}, {"num": "37.4", "title": "Returning the ball to a fielder", "body": "Either batter is out Obstructing the field if, at any time while the ball is in play and, without the consent of a fielder, they use the bat or any part of their person to return the ball to any fielder."}, {"num": "37.5", "title": "Runs scored", "body": "When either batter is dismissed Obstructing the field,\n\n37.5.1 unless the obstruction or distraction prevents the striker being out Caught, any runs completed by the batters before the offence shall be scored, together with any one-run Penalty for No ball or Wide, or any other award of 5 Penalty Runs to either side. See Laws 18.6 (Runs awarded for penalties) and 18.8 (Runs scored when a batter is dismissed).\n\n37.5.2 if the obstruction or distraction prevents the striker being out Caught, any runs completed by the batters shall not be scored but any award of 5 Penalty Runs to either side shall stand. the fielding captain shall decide whether the non-striker, or the incoming batter, is to face the next delivery."}, {"num": "37.6", "title": "Bowler does not get credit", "body": "The bowler does not get credit for the wicket."}]}, {"num": 38, "title": "Run out", "subs": [{"num": "38.1", "title": "Out Run out", "body": "Either batter is out Run out, except as in 38.2, if, at any time while the ball is in play, they are out of their ground and their wicket is fairly broken by either the action of a fielder or the ball rebounding off a fielder\u2019s person even though No ball has been called, except in the circumstances of 38.2.2.2, and whether or not a run is being attempted."}, {"num": "38.2", "title": "Batter not out Run out", "body": "38.2.1 A batter is not out Run out in the circumstances of 38.2.1.1 or 38.2.1.2.\n\n38.2.1.1 The batter has been within their ground and has subsequently left it to avoid injury, when the wicket is fairly broken. Note also the provisions of Law 30.1.2 (When out of their ground).\n\n38.2.1.2 The ball, delivered by the bowler, has not made contact with a fielder before the wicket is fairly broken.\n\n38.2.2 The striker is not out Run out in any of the circumstances in 38.2.2.1 and 38.2.2.2.\n\n38.2.2.1 The striker is out Stumped. See Laws 25.6.5 (Dismissal and conduct of a batter and their runner) and 39.1.2 (Out Stumped).\n\n38.2.2.2 No ball has been called and the striker is out of their ground not attempting a run and the wicket is fairly broken by the wicket- keeper without the intervention of another fielder. However, if the striker has a runner and the runner is out of their ground, then only 38.1 applies."}, {"num": "38.3", "title": "Non-striker leaving their ground early", "body": "38.3.1 If the non-striker is out of their ground at any time from the moment the ball comes into play until the moment the bowler\u2019s arm reaches the highest point of their normal bowling action in the delivery swing, the non-striker is liable to be Run out. In these circumstances, the non-striker will be out Run out if they are out of their ground when the wicket is broken by the bowler throwing the ball at the wicket or by the bowler\u2019s hand holding the ball, whether or not the ball is subsequently delivered.\n\n38.3.1.1 Even if the non-striker had left their ground before the moment the bowler\u2019s arm reac
